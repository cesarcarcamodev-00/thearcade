  <div class="opts">${S.offers.map((id,i)=>id?relicCard(id,RAR[RELIC[id].r].price,'buyRelic('+i+')',S.gold<RAR[RELIC[id].r].price):`<div class="opt sold">${t('sold')}</div>`).join('')}</div>
  ${full?`<p style="color:var(--red)">${t('full')}</p>`:''}
  <div class="row2"><button class="btn" onclick="reroll()" ${S.gold<rc?'disabled':''}>${t('reroll',rc)}</button><button class="btn green" onclick="nextStage()">${t('cont')}</button></div>
  ${ownedList(true)}`);
}
function ownedList(sell){
 return `<p style="color:var(--gold)">${t('owned',S.relics.length)}</p>${S.relics.length?S.relics.map(id=>{const R=RELIC[id];
  return`<div class="own"><div><b style="color:${RAR[R.r].col}">${rtext(R.n)}</b><br>${rtext(R.d)}</div>${sell?`<button class="btn small red" onclick="sellRelic('${id}')">${t('sellr',RAR[R.r].price>>1)}</button>`:''}</div>`}).join(''):`<p>${t('none')}</p>`}`;
}
function buyRelic(i){
 const id=S.offers[i],p=RAR[RELIC[id].r].price;
 if(S.relics.length>=5){toast(t('full'));return}
 if(S.gold<p){toast(t('toast_gold'));return}
 S.gold-=p;S.relics.push(id);S.offers[i]=null;
 if(id==='glass')S.lives=Math.min(S.lives,3);
 beep(700,.12,'triangle',.05,300);showShop();renderHud();
}
function sellRelic(id){S.relics=S.relics.filter(r=>r!==id);S.gold+=RAR[RELIC[id].r].price>>1;beep(250,.1);showShop();renderHud()}
function reroll(){const c=10+5*S.rerolls;if(S.gold<c)return;S.gold-=c;S.rerolls++;S.offers=rollRelics(3);beep(500,.06);showShop();renderHud()}
function nextStage(){
 hide();state='build';const refund=nextLevel();
 if(S.rule)setTimeout(()=>toast(t('boss_now',rtext(RULE[S.rule].n))),60);
 else if(refund)setTimeout(()=>toast(t('refund',refund)),60);
 renderHud();renderBar();
}
function showRelics(){
 const prev=cur;
 show(`<h2>${t('relics')}</h2>${S.rule?`<p style="color:var(--red)">${t('boss_now',ruleTxt(S.rule))}</p>`:bossLine()}${ownedList(false)}<button class="btn" id="cl">${t('close')}</button>`);
 cur=showRelics;$('#cl').onclick=()=>{hide();cur=null};
}

/* ---------- input ---------- */
const canEdit=()=>state==='build'||state==='wave'||state==='clearing';
function tileAt(e){
 const r=cv.getBoundingClientRect(),w=cv.clientWidth,hh=cv.clientHeight;
 const px=(e.clientX-r.left-cv.clientLeft)*VW/w,py=(e.clientY-r.top-cv.clientTop)*VH/hh;
 const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
 return inG(tx,ty)?[tx,ty]:null;
}
function tryBuild(tx,ty){
 const issue=buildIssue(tx,ty);
 if(issue){toast(t(issue));beep(120,.1,'sawtooth');return false}
 const c=tcost(build);
 if(S.gold<c){toast(t('toast_gold'));beep(120,.1,'sawtooth');return false}
 S.gold-=c;placeTower(tx,ty,build,c);
 beep(380,.08,'triangle',.05,200);vib(10);renderHud();renderBar();return true;
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(!canEdit())return;
 const p=tileAt(e);if(!p)return;const [tx,ty]=p;
 const ex=occ[ty][tx];
 if(ex){ghost=null;GI=null;sel=ex===sel?null:ex;beep(600,.04);renderBar();return}
 if(sel){sel=null;renderBar();return}
 // a mouse already previewed this tile on hover, so one click builds; touch needs a second tap
 const same=ghost&&ghost[0]===tx&&ghost[1]===ty&&(e.pointerType==='mouse'||ghost.tapped);
 if(same){if(tryBuild(tx,ty)){ghost=null;GI=null}return}
 ghost=[tx,ty];ghost.tapped=true;ghostInfo();beep(520,.03);
});
cv.addEventListener('pointermove',e=>{
 if(e.pointerType!=='mouse'||!canEdit()||sel)return;
 const p=tileAt(e);
 if(!p||occ[p[1]][p[0]]){if(ghost&&!ghost.tapped){ghost=null;GI=null}return}
 if(!ghost||ghost[0]!==p[0]||ghost[1]!==p[1]){ghost=p;ghostInfo()}
});
cv.addEventListener('pointerleave',()=>{if(ghost&&!ghost.tapped){ghost=null;GI=null}});

/* ---------- language / sound / layout ---------- */
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('#lang').textContent=LANG.toUpperCase();
 $('#mute').textContent=t('snd');$('#mute').classList.toggle('off',muted);
 $('#menu').textContent=t('menu');
 document.title=t('title');
}
$('#lang').onclick=()=>{
 LANG=LANG==='es'?'en':'es';try{localStorage.setItem(langKey,LANG)}catch(e){}
 applyLang();renderHud();renderBar();
 if($('#ov').style.display==='flex'&&cur){if(cur===showPick)drawPick();else cur()}
};
$('#mute').onclick=()=>{muted=!muted;applyLang()};
$('#menu').onclick=()=>{if(state!=='menu'){beep(300,.05);showMenu()}};
function layout(){
 const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;
 const sc=Math.max(.5,Math.min((w-8)/VW,(h-8)/VH));
 cv.style.width=Math.floor(VW*sc)+'px';cv.style.height=Math.floor(VH*sc)+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
 acc+=Math.min(.1,(now-last)/1000);last=now;
 const step=1/60/speed;
 while(acc>=step){update(1/60);acc-=step}
 render();requestAnimationFrame(frame);
}
initLevel(0);applyLang();renderHud();layout();showMenu();
requestAnimationFrame(frame);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-spiderman">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spider-Man Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--red:#d6243a;--blue:#2457d6;--gold:#ffcf3f;--panel:#1b2340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#0b1020;color:#fff;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 font-family:'Press Start 2P',ui-monospace,Consolas,monospace;font-size:9px;line-height:1.6}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
 padding:max(4px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:38px}
h1{margin:0;font-size:10px;color:var(--red);text-shadow:2px 2px 0 #000;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
header .r{display:flex;gap:4px;flex:none}
.btn{font:inherit;font-size:10px;color:#fff;background:var(--blue);border:4px solid #000;box-shadow:0 4px 0 #000;padding:10px 12px;cursor:pointer;text-transform:uppercase;min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.small{font-size:8px;padding:4px 6px;min-height:34px}
.btn.off{text-decoration:line-through;opacity:.55}
.btn.red{background:var(--red)}.btn.gold{background:#d9a21b;color:#000}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;border:4px solid #000;background:#000;display:block;box-shadow:0 4px 0 #000}
#pad{flex:none;height:150px;display:flex;justify-content:space-between;align-items:center;padding:0 4px}
#pad .g{display:flex;gap:12px}
.pb{width:76px;height:76px;border:4px solid #000;box-shadow:0 5px 0 #000,inset 0 0 0 3px rgba(255,255,255,.25);background:#2a3560;color:#fff;
 display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;line-height:1.3;touch-action:none;position:relative}
.pb.on{transform:translateY(4px);box-shadow:0 1px 0 #000;filter:brightness(1.4)}
.pb.j{background:#1f7a3a}.pb.p{background:var(--red)}
.pb i{display:block;width:0;height:0;border-style:solid}
.pb.l i{border-width:14px 22px 14px 0;border-color:transparent #fff transparent transparent}
.pb.r i{border-width:14px 0 14px 22px;border-color:transparent transparent transparent #fff}
#ov{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:12px;overflow:auto}
.modal{background:var(--panel);border:4px solid #000;box-shadow:0 4px 0 #000,inset 0 0 0 3px rgba(255,255,255,.12);max-width:520px;width:100%;padding:16px;text-align:center;margin:auto}
.modal h2{margin:0 0 10px;font-size:18px;color:var(--red);text-shadow:3px 3px 0 #000}
.modal p{font-size:9px;line-height:1.9;color:#dfe6f5;margin:8px 0}
.final .big{font-size:26px;line-height:1.5;color:var(--gold);text-shadow:4px 4px 0 #000;margin:14px 0;animation:bl 1s steps(2) infinite}
.final .big b{color:#fff}
.final .big small{display:block;font-size:13px;color:#fff;margin:4px 0}
@keyframes bl{50%{color:#fff}}
@media(orientation:landscape) and (max-height:520px){
 #app{position:relative}
 #pad{position:absolute;left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));height:auto;pointer-events:none;z-index:5}
 .pb{width:60px;height:60px;pointer-events:auto;opacity:.75;font-size:8px}
 header{min-height:34px}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>SPIDER-MAN</h1>
  <div class="r"><button class="btn small" id="lang">ES</button><button class="btn small" id="mute">SON</button></div>
 </header>
 <div id="stage"><canvas id="c" width="256" height="192"></canvas></div>
 <div id="pad">
  <div class="g"><div class="pb l" id="bl"><i></i></div><div class="pb r" id="br"><i></i></div></div>
  <div class="g"><div class="pb j" id="bj" data-i="jump"></div><div class="pb p" id="bp" data-i="punch"></div></div>
 </div>
</div>
<div id="ov"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const VW=256,VH=192,WORLD=2300,GROUND=150;
const cv=$('#c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ---------- i18n (Spanish default) ---------- */
const langKey='spiderDemoLang';
let LANG='es';try{LANG=localStorage.getItem(langKey)==='en'?'en':'es'}catch(e){}
const T={
en:{jump:'JUMP',punch:'PUNCH',snd:'SND',sub:'One-level demo',
 how:'Run, jump over the gaps and punch the thugs. Beat the boss at the end!',
 keys:'Keyboard: arrows / WASD, Space = jump, Z = punch',start:'Start',
 thugs:'THUGS',boss:'BOSS',pow:'POW!',complete:'LEVEL COMPLETE!',
 dead:'YOU WERE DEFEATED',retry:'Try again',
 final:'CITY <b>SAVED!</b>',beaten:'Thugs beaten: {0}',time:'Time: {0}s',again:'Play again'},
es:{jump:'SALTAR',punch:'GOLPE',snd:'SON',sub:'Demo de un nivel',
 how:'Corre, salta los huecos y golpea a los matones. ¡Derrota al jefe del final!',
 keys:'Teclado: flechas / WASD, Espacio = saltar, Z = golpear',start:'Empezar',
 thugs:'MATONES',boss:'JEFE',pow:'¡PUM!',complete:'¡NIVEL COMPLETO!',
 dead:'FUISTE DERROTADO',retry:'Reintentar',
 final:'¡CIUDAD <b>A SALVO!</b>',beaten:'Matones derrotados: {0}',time:'Tiempo: {0}s',again:'Jugar de nuevo'}
};
const t=(k,...a)=>{let s=T[LANG][k];if(s===undefined)s=T.en[k];a.forEach((v,i)=>s=s.split('{'+i+'}').join(v));return s};

/* ---------- sound ---------- */
let AC=null,muted=false;
function beep(f,d=.08,type='square',v=.04,slide=0){
 if(muted)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
const vib=n=>{try{navigator.vibrate&&!muted&&navigator.vibrate(n)}catch(e){}};

/* ---------- pixel sprites ---------- */
const PAL={R:'#d6243a',B:'#2457d6',K:'#111',W:'#fff'};
const TOP=['..RRRRR..','.RRRRRRR.','.RWWRWWR.','.RRRRRRR.','..RRRRR..','.BBRRRBB.','BBBRKRBBB','BB.RRR.BB','...RRR...','...BBB...','...BBB...'];
const LEGS={
 idle:['..BB.BB..','..BB.BB..','..RR.RR..','..RR.RR..','.RRR.RRR.'],
 run1:['..BB.BB..','..BB..BB.','..RR...RR','..RR...RR','.RRR..RRR'],
 run2:['..BB.BB..','.BB..BB..','RR...RR..','RR...RR..','RRR..RRR.'],
 jump:['.BBB.BBB.','.BB...BB.','..RRRRR..','.........','.........']
};
function mkSprite(rows,pal){
 const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;
 const g=c.getContext('2d');
 rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}));
 return c;
}
const HERO={};for(const k in LEGS)HERO[k]=mkSprite(TOP.concat(LEGS[k]),PAL);
const HEART=mkSprite(['.##.##.','#######','#######','.#####.','..###..','...#...'].map(r=>r.replace(/#/g,'R').replace(/\./g,'.')),PAL);
const HEART0=mkSprite(['.##.##.','#######','#######','.#####.','..###..','...#...'].map(r=>r.replace(/#/g,'K')),{K:'#3a3f55'});

/* ---------- level ---------- */
const solids=[];
[[0,500],[560,980],[1060,1500],[1570,2300]].forEach(([a,b])=>solids.push({x:a,y:GROUND,w:b-a,h:VH-GROUND,g:1}));
[[190,112,64],[320,88,56],[600,112,72],[710,84,64],[1100,112,84],[1224,84,64],[1330,112,64],[1690,112,72],[1790,84,72],
 [516,130,28],[1008,130,28],[1520,130,28]].forEach(([x,y,w])=>solids.push({x,y,w,h:6,g:0}));
const SPAWNS=[[0,330],[1,700],[6,22],[1,880],[2,1250],[9+0,0],[2,1420],[3,1700],[3,1900]];
// index 9 -> platform (1224,84,64); solids 4.. are plats: 4:(190) 5:(320) 6:(600) 7:(710) 8:(1100) 9:(1224)

/* ---------- state ---------- */
let state='title',K={l:0,r:0,j:0,p:0},jumpBuf=0,punchBuf=0;
let P,enemies,parts,kills,tStart,shake,camX=0,lastSafe,winT=0,deadT=0,tick=0,totalThugs=0,time=0;

function mkEnemy(s,x,boss){
 const w=boss?14:9,h=boss?24:16;
 return{x,y:s.y-h,w,h,s,boss:!!boss,hp:boss?6:2,max:boss?6:2,dir:Math.random()<.5?-1:1,
  patrol:boss?30:22,chase:boss?58:38,reach:boss?22:15,wind:0,cd:0,stun:0,kvx:0,dead:0};
}
function resetGame(){
 P={x:24,y:GROUND-16,w:8,h:16,vx:0,vy:0,face:1,onGround:false,coyote:0,punchT:0,cd:0,inv:0,hurt:0,hp:3,hit:null,anim:0};
 lastSafe={x:24,y:GROUND-16};
 enemies=SPAWNS.map(([i,x])=>{const s=solids[i];return mkEnemy(s,i>=4?s.x+x:x)});
 enemies.push(mkEnemy(solids[3],2150,true));
 totalThugs=enemies.length;
 parts=[];kills=0;shake=0;winT=0;deadT=0;time=0;jumpBuf=punchBuf=0;
}

/* ---------- input ---------- */
function down(k){K[k]=1;if(k==='j')jumpBuf=.14;if(k==='p')punchBuf=.14}
function up(k){K[k]=0}
function bindBtn(id,key){
 const el=$(id);
 const on=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(x){}down(key);el.classList.add('on')};
 const off=e=>{e.preventDefault();up(key);el.classList.remove('on')};
 el.addEventListener('pointerdown',on);
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,off));
 el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('#bl','l');bindBtn('#br','r');bindBtn('#bj','j');bindBtn('#bp','p');
const KEYS={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyZ:'p',KeyX:'p',KeyJ:'p',KeyK:'p'};
addEventListener('keydown',e=>{const k=KEYS[e.code];if(!k)return;e.preventDefault();if(!e.repeat)down(k)});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){e.preventDefault();up(k)}});
addEventListener('blur',()=>{K={l:0,r:0,j:0,p:0}});

/* ---------- helpers ---------- */
const rects=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function spawnParts(x,y,n,col){
 for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*120,vy:-Math.random()*90,life:.35+Math.random()*.2,col});
}
function popText(x,y,txt,col){parts.push({x,y,vx:0,vy:-30,life:.6,txt,col:col||'#ffcf3f'})}
function hurtPlayer(dir){
 if(P.inv>0||state!=='play')return;
 P.hp--;P.inv=1.3;P.hurt=.3;P.vx=dir*110;P.vy=-140;P.onGround=false;shake=.2;
 spawnParts(P.x+4,P.y+8,8,'#d6243a');beep(140,.2,'sawtooth',.06,-60);vib(40);
 if(P.hp<=0){state='dead';deadT=.9;beep(90,.5,'sawtooth',.06,-40)}
}
function fall(){
 P.hp--;shake=.2;beep(120,.3,'sawtooth',.06,-80);vib(40);
 if(P.hp<=0){state='dead';deadT=.9;P.y=VH+60;return}
 P.x=lastSafe.x;P.y=lastSafe.y-4;P.vx=P.vy=0;P.inv=1.3;
}

/* ---------- update ---------- */
function update(dt){
 tick+=dt;
 if(shake>0)shake-=dt;
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.txt)p.vy+=300*dt;p.life-=dt});
 parts=parts.filter(p=>p.life>0);
 if(state==='win'){winT-=dt;if(winT<=0){state='final';showFinal()}return}
 if(state==='dead'){deadT-=dt;if(deadT<=0&&state==='dead'){state='over';showOver()}return}
 if(state!=='play')return;
 time+=dt;
 const p=P;
 if(jumpBuf>0)jumpBuf-=dt;if(punchBuf>0)punchBuf-=dt;
 if(p.punchT>0)p.punchT-=dt;if(p.cd>0)p.cd-=dt;if(p.inv>0)p.inv-=dt;if(p.hurt>0)p.hurt-=dt;
 const ax=K.r-K.l;
 if(p.hurt<=0){p.vx=ax*92;if(ax)p.face=ax}else p.vx*=.96;
 p.coyote=p.onGround?.1:p.coyote-dt;
 if(jumpBuf>0&&p.coyote>0&&p.hurt<=0){p.vy=-290;p.onGround=false;p.coyote=0;jumpBuf=0;beep(330,.14,'square',.04,300)}
 if(!K.j&&p.vy<-110)p.vy=-110;
 if(punchBuf>0&&p.cd<=0&&p.hurt<=0){punchBuf=0;p.punchT=.22;p.cd=.3;p.hit=new Set();beep(200,.08,'triangle',.05,-80)}
 // physics (top-only platforms)
 const prevBottom=p.y+p.h;
 p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(p.x<0)p.x=0;if(p.x>WORLD-p.w)p.x=WORLD-p.w;
 p.onGround=false;
 if(p.vy>=0)for(const s of solids){
  if(prevBottom<=s.y+1&&p.y+p.h>=s.y&&p.x+p.w>s.x+1&&p.x<s.x+s.w-1){
   p.y=s.y-p.h;p.vy=0;p.onGround=true;
   if(s.w>=50&&p.x>s.x+8&&p.x<s.x+s.w-16)lastSafe={x:p.x,y:s.y-p.h};
   break;
  }
 }
 if(p.y>VH+30)fall();
 p.anim+=Math.abs(p.vx)*dt*.12;
 // punch hits
 if(p.punchT>0&&p.punchT<.16&&p.hit){
  const hb={x:p.face>0?p.x+p.w:p.x-15,y:p.y,w:15,h:p.h};
  for(const e of enemies){
   if(e.dead||p.hit.has(e)||!rects(hb,e))continue;
   p.hit.add(e);e.hp--;e.stun=.32;e.kvx=p.face*120;e.wind=0;shake=.12;
   spawnParts(e.x+e.w/2,e.y+8,6,'#fff');popText(e.x,e.y-6,t('pow'));beep(120,.1,'square',.06,-40);vib(15);
   if(e.hp<=0){
    e.dead=1;kills++;spawnParts(e.x+e.w/2,e.y+8,14,e.boss?'#ffcf3f':'#c9a227');beep(80,.3,'sawtooth',.06,-30);
    if(e.boss){state='win';winT=1.8;beep(520,.3,'triangle',.06,400)}
   }
  }
 }
 // enemies
 for(const e of enemies){
  if(e.dead)continue;
  const s=e.s,minX=s.x,maxX=s.x+s.w-e.w;
  if(e.cd>0)e.cd-=dt;
  if(e.stun>0){e.stun-=dt;e.x+=e.kvx*dt;e.kvx*=.9;e.x=Math.max(minX,Math.min(maxX,e.x));continue}
  if(e.wind>0){
   e.wind-=dt;
   if(e.wind<=0){
    e.cd=.9;
    const dx=(p.x+p.w/2)-(e.x+e.w/2);
    if(Math.abs(dx)<e.reach+6&&Math.abs((p.y+p.h)-(e.y+e.h))<16)hurtPlayer(Math.sign(dx)||1);
   }
   continue;
  }
  const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+p.h)-(e.y+e.h);
  if(Math.abs(dy)<22&&Math.abs(dx)<95&&state==='play'){
   e.dir=Math.sign(dx)||e.dir;
   if(Math.abs(dx)<=e.reach&&Math.abs(dy)<16){if(e.cd<=0){e.wind=e.boss?.3:.38;beep(500,.05,'square',.02)}}
   else e.x+=e.dir*e.chase*dt;
  }else{
   e.x+=e.dir*e.patrol*dt;
   if(e.x<=minX){e.x=minX;e.dir=1}else if(e.x>=maxX){e.x=maxX;e.dir=-1}
  }
  e.x=Math.max(minX,Math.min(maxX,e.x));
 }
 camX=Math.max(0,Math.min(WORLD-VW,p.x+p.w/2-VW*.42));
}

/* ---------- background ---------- */
function rng(seed){let s=seed;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}
function buildLayer(par,seed,color,minH,maxH,win){
 const w=Math.ceil(WORLD*par+VW)+40,c=document.createElement('canvas');c.width=w;c.height=VH;
 const g=c.getContext('2d'),r=rng(seed);let x=0;
 while(x<w){
  const bw=18+Math.floor(r()*26),bh=minH+Math.floor(r()*(maxH-minH));
  g.fillStyle=color;g.fillRect(x,GROUND+10-bh,bw,bh+40);
  if(win)for(let wy=GROUND+10-bh+5;wy<GROUND-4;wy+=9)for(let wx=x+3;wx<x+bw-4;wx+=7)
   if(r()<.45){g.fillStyle=r()<.8?'#ffd86b':'#9fd0ff';g.fillRect(wx,wy,3,4)}
  x+=bw+Math.floor(r()*3);
 }
 return c;
}
const BG1=buildLayer(.25,7,'#17203d',50,110,false);
const BG2=buildLayer(.5,21,'#202c52',35,85,true);
const SKY=['#0b1020','#101a35','#16244a','#1d2f5c','#26396b','#2f4579'];

/* ---------- render ---------- */
const FONT='8px "Press Start 2P",monospace';
function txt(s,x,y,col,al){ctx.font=FONT;ctx.textAlign=al||'left';ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function render(){
 const sx=shake>0?Math.round((Math.random()-.5)*4):0,sy=shake>0?Math.round((Math.random()-.5)*3):0;
 ctx.save();ctx.translate(sx,sy);
 SKY.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,i*32,VW,32)});
 ctx.fillStyle='#f4ecc8';ctx.fillRect(196,22,18,18);ctx.fillStyle='#d9d0a4';ctx.fillRect(202,26,4,4);ctx.fillRect(207,32,3,3);
 ctx.drawImage(BG1,-Math.floor(camX*.25),0);
 ctx.drawImage(BG2,-Math.floor(camX*.5),0);
 const cx=Math.floor(camX);
 // solids
 for(const s of solids){
  const x=Math.floor(s.x-cx);if(x>VW||x+s.w<0)continue;
  if(s.g){
   ctx.fillStyle='#2b2b3d';ctx.fillRect(x,s.y,s.w,s.h);
   ctx.fillStyle='#4a4a66';ctx.fillRect(x,s.y,s.w,4);
   ctx.fillStyle='#232333';
   for(let by=s.y+8;by<VH;by+=8)for(let bx=(by/8%2)*8;bx<s.w;bx+=16)ctx.fillRect(x+bx,by,1,8),ctx.fillRect(x,by,s.w,1);
  }else{
   ctx.fillStyle='#3a3a52';ctx.fillRect(x,s.y,s.w,s.h);
   ctx.fillStyle='#6a6a92';ctx.fillRect(x,s.y,s.w,2);
   ctx.fillStyle='#22222f';ctx.fillRect(x+2,s.y+s.h,3,6);ctx.fillRect(x+s.w-5,s.y+s.h,3,6);
  }
 }
 // enemies
 for(const e of enemies){
  if(e.dead)continue;
  const x=Math.floor(e.x-cx),y=Math.floor(e.y);if(x>VW||x+e.w<-4)continue;
  const flash=(e.stun>0&&((tick*30|0)%2))||(e.wind>0&&((tick*20|0)%2));
  const sc=e.boss?1.5:1,bw=e.w,bh=e.h;
  ctx.save();ctx.translate(x,y);
  const body=flash?'#fff':(e.boss?'#8a2b2b':'#c9a227'),pants=flash?'#fff':'#2b2b3a',skin=flash?'#fff':'#e0b080',hat=flash?'#fff':'#111';
  const lh=Math.round(5*sc);
  ctx.fillStyle=pants;ctx.fillRect(0,bh-lh,bw,lh);ctx.fillStyle='#000';ctx.fillRect(Math.floor(bw/2),bh-lh,1,lh);
  ctx.fillStyle=body;ctx.fillRect(0,Math.round(5*sc),bw,bh-lh-Math.round(5*sc));
  ctx.fillStyle=skin;const hw=Math.round(7*sc);ctx.fillRect(Math.floor((bw-hw)/2),0,hw,Math.round(5*sc));
  ctx.fillStyle=hat;ctx.fillRect(Math.floor((bw-hw)/2),0,hw,Math.round(2*sc));
  ctx.fillStyle='#000';ctx.fillRect(e.dir>0?bw-4:2,Math.round(3*sc),2,2);
  if(e.wind>0){ctx.fillStyle=skin;ctx.fillRect(e.dir>0?bw:-5,Math.round(4*sc),5,3)}
  ctx.restore();
  if(e.wind>0){txt('!',x+bw/2,y-9,'#ff4d5e','center')}
 }
 // player
 const p=P;
 if(!(p.inv>0&&((tick*20|0)%2)&&state==='play')&&p.y<VH+20){
  const sp=!p.onGround?HERO.jump:(Math.abs(p.vx)>10?(Math.floor(p.anim)%2?HERO.run1:HERO.run2):HERO.idle);
  const px=Math.floor(p.x-cx)-1,py=Math.floor(p.y);
  ctx.save();
  if(p.face<0){ctx.translate(px+9,py);ctx.scale(-1,1);ctx.drawImage(sp,0,0)}else ctx.drawImage(sp,px,py);
  ctx.restore();
  if(p.punchT>0){
   const fx=p.face>0?px+9:px-8;
   ctx.fillStyle='#2457d6';ctx.fillRect(fx,py+6,8,4);ctx.fillStyle='#d6243a';ctx.fillRect(p.face>0?fx+6:fx,py+5,3,6);
  }
 }
 // particles
 for(const q of parts){
  if(q.txt)txt(q.txt,Math.floor(q.x-cx),Math.floor(q.y),q.col,'left');
  else{ctx.fillStyle=q.col;ctx.fillRect(Math.floor(q.x-cx),Math.floor(q.y),2,2)}
 }
 ctx.restore();
 // HUD
 for(let i=0;i<3;i++)ctx.drawImage(i<P.hp?HEART:HEART0,6+i*10,6);
 txt(t('thugs')+' '+Math.min(kills,totalThugs)+'/'+totalThugs,VW-6,6,'#fff','right');
 const boss=enemies[enemies.length-1];
 if(!boss.dead&&P.x>WORLD-520){
  ctx.fillStyle='#000';ctx.fillRect(56,22,144,10);ctx.fillStyle='#5b1f2b';ctx.fillRect(58,24,140,6);
  ctx.fillStyle='#ff4d5e';ctx.fillRect(58,24,Math.max(0,140*boss.hp/boss.max),6);
  txt(t('boss'),VW/2,34,'#ffb3bd','center');
 }
 if(state==='win'){ctx.fillStyle='#0008';ctx.fillRect(0,76,VW,40);txt(t('complete'),VW/2,92,'#ffcf3f','center')}
}

/* ---------- screens ---------- */
let curScreen=null;
function show(html,fn){$('#ov').innerHTML=`<div class="modal ${fn||''}">${html}</div>`;$('#ov').style.display='flex'}
function hide(){$('#ov').style.display='none';curScreen=null}
function showTitle(){curScreen=showTitle;
 show(`<h2>SPIDER-MAN</h2><p>${t('sub')}</p><p>${t('how')}</p><p style="color:var(--gold)">${t('keys')}</p>
 <button class="btn gold" onclick="startGame()">${t('start')}</button>`)}
function showOver(){curScreen=showOver;
 show(`<h2>${t('dead')}</h2><p>${t('beaten',kills)}</p><button class="btn red" onclick="startGame()">${t('retry')}</button>`)}
function showFinal(){curScreen=showFinal;
 show(`<div class="big">${t('final')}</div><p>${t('beaten',kills)} &middot; ${t('time',Math.round(time))}</p>
 <button class="btn gold" onclick="startGame()">${t('again')}</button>`,'final')}
function startGame(){resetGame();state='play';hide();beep(440,.1,'triangle')}

/* ---------- language / sound / layout ---------- */
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('#lang').textContent=LANG.toUpperCase();
 $('#mute').textContent=t('snd');$('#mute').classList.toggle('off',muted);
}
$('#lang').onclick=()=>{LANG=LANG==='es'?'en':'es';try{localStorage.setItem(langKey,LANG)}catch(e){}applyLang();if(curScreen)curScreen()};
$('#mute').onclick=()=>{muted=!muted;applyLang()};
function layout(){
 const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;
 const sc=Math.max(.5,Math.min((w-8)/VW,(h-8)/VH));
 cv.style.width=Math.floor(VW*sc)+'px';cv.style.height=Math.floor(VH*sc)+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
 acc+=Math.min(.1,(now-last)/1000);last=now;
 while(acc>=1/60){update(1/60);acc-=1/60}
 render();requestAnimationFrame(frame);
}
resetGame();applyLang();layout();showTitle();
try{document.fonts&&document.fonts.load('8px "Press Start 2P"')}catch(e){}
requestAnimationFrame(frame);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-space-shooter">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Space Shooter</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffcf3f;--panel:#1b2340;--red:#ff4d5e;--cyan:#5ee7ff;--grey:#8b97ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#070b1a;color:#fff;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 font-family:'Press Start 2P',ui-monospace,Consolas,monospace;font-size:9px;line-height:1.6}
#app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
 padding:max(4px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px}
h1{margin:0;font-size:10px;color:var(--cyan);text-shadow:2px 2px 0 #000;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
header .r{display:flex;gap:4px;flex:none}
.btn{font:inherit;font-size:10px;color:#fff;background:#3a6df0;border:4px solid #000;box-shadow:0 4px 0 #000;padding:10px 12px;cursor:pointer;text-transform:uppercase;min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.small{font-size:8px;padding:4px 6px;min-height:34px}
.btn.gold{background:#d9a21b;color:#000}.btn.red{background:#d63c4a}
.btn.off{text-decoration:line-through;opacity:.55}
#hud{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.stat{background:#10172e;border:3px solid #000;text-align:center;font-size:7px;color:var(--grey);padding:4px 2px}
.stat b{display:block;font-size:12px;margin-top:2px;color:#fff;white-space:nowrap}
#lives b{color:var(--red)}#score b{color:var(--gold)}#wave b{color:var(--cyan)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;border:4px solid #000;background:#000;display:block;box-shadow:0 4px 0 #000;touch-action:none}
#ov{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:12px;overflow:auto}
.modal{background:var(--panel);border:4px solid #000;box-shadow:0 4px 0 #000,inset 0 0 0 3px rgba(255,255,255,.12);max-width:480px;width:100%;padding:16px;text-align:center;margin:auto}
.modal h2{margin:0 0 10px;font-size:16px;color:var(--cyan);text-shadow:3px 3px 0 #000}
.modal p{font-size:9px;line-height:1.9;color:#dfe6f5;margin:8px 0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;text-align:left;font-size:8px;margin:10px 0;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid #000;text-align:center;font-style:normal;font-size:8px;line-height:10px;color:#000}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1 data-i="title">SPACE SHOOTER</h1>
  <div class="r"><button class="btn small" id="lang">ES</button><button class="btn small" id="mute">SON</button></div>
 </header>
 <div id="hud"><div class="stat" id="score"></div><div class="stat" id="lives"></div><div class="stat" id="wave"></div></div>
 <div id="stage"><canvas id="c" width="180" height="300"></canvas></div>
</div>
<div id="ov"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rf=(a,b)=>a+Math.random()*(b-a);
const VW=180,VH=300;
const cv=$('#c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;

/* ---------- i18n (Spanish default) ---------- */
const langKey='spaceShooterLang',hiKey='spaceShooterHi';
let LANG='es';try{LANG=localStorage.getItem(langKey)==='en'?'en':'es'}catch(e){}
let hi=0;try{hi=+localStorage.getItem(hiKey)||0}catch(e){}
const T={
en:{title:'SPACE SHOOTER',snd:'SND',sub:'Short demo: 6 waves and a boss.',
 how:'Drag your finger anywhere to move the ship. It fires by itself. Collect random power-ups - but the red skull is a trap!',
 keys:'Keyboard: arrows / WASD',start:'Start',score:'SCORE',lives:'LIVES',wave:'WAVE',boss:'BOSS',
 p_spread:'SPREAD',p_rapid:'RAPID',p_shield:'SHIELD',p_bomb:'BOMB',p_life:'+1 LIFE',p_jam:'JAM!',
 d_spread:'Triple shot',d_rapid:'Faster fire',d_shield:'Blocks one hit',d_bomb:'Clears the screen',d_life:'Extra life',d_jam:'Slows your fire',
 wv:'WAVE {0}',warn:'WARNING!',bossn:'BOSS INCOMING',
 over:'GAME OVER',retry:'Try again',win:'MISSION COMPLETE',again:'Play again',best:'Best: {0}',sc:'Score: {0}',newbest:'NEW RECORD!'},
es:{title:'SHOOTER ESPACIAL',snd:'SON',sub:'Demo corta: 6 oleadas y un jefe.',
 how:'Arrastra el dedo en cualquier lugar para mover la nave. Dispara sola. Recoge power-ups aleatorios, ¡pero la calavera roja es una trampa!',
 keys:'Teclado: flechas / WASD',start:'Empezar',score:'PUNTOS',lives:'VIDAS',wave:'OLEADA',boss:'JEFE',
 p_spread:'ABANICO',p_rapid:'RÁPIDO',p_shield:'ESCUDO',p_bomb:'BOMBA',p_life:'+1 VIDA',p_jam:'¡ATASCO!',
 d_spread:'Disparo triple',d_rapid:'Disparo más rápido',d_shield:'Bloquea un golpe',d_bomb:'Limpia la pantalla',d_life:'Vida extra',d_jam:'Frena tu disparo',
 wv:'OLEADA {0}',warn:'¡ALERTA!',bossn:'LLEGA EL JEFE',
 over:'FIN DEL JUEGO',retry:'Reintentar',win:'MISIÓN CUMPLIDA',again:'Jugar de nuevo',best:'Récord: {0}',sc:'Puntos: {0}',newbest:'¡NUEVO RÉCORD!'}
};
const t=(k,...a)=>{let s=T[LANG][k];if(s===undefined)s=T.en[k];if(s===undefined)return k;a.forEach((v,i)=>s=s.split('{'+i+'}').join(v));return s};

/* ---------- sound ---------- */
let AC=null,muted=false;
function beep(f,d=.06,type='square',v=.02,slide=0){
 if(muted)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
const vib=n=>{try{navigator.vibrate&&!muted&&navigator.vibrate(n)}catch(e){}};

/* ---------- sprites ---------- */
function mirror(half){return half.map(r=>r+[...r.slice(0,-1)].reverse().join(''))}
function mk(rows,pal){
 const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const g=c.getContext('2d');
 rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}));return c;
}
const SHIP=mk(mirror(['....W','...CW','...CC','..CCC','B.CCW','BCCCC','BCCRC','BC.RY']),{W:'#fff',C:'#5ee7ff',B:'#2457d6',R:'#d6243a',Y:'#ffcf3f'});
const PW={
 spread:{col:'#5ee7ff',ch:'S',w:3},rapid:{col:'#ffcf3f',ch:'R',w:3},shield:{col:'#5b8cff',ch:'O',w:2.5},
 bomb:{col:'#ff9f43',ch:'B',w:1.5},life:{col:'#5be37d',ch:'+',w:.8},jam:{col:'#ff4d5e',ch:'X',w:1.6,bad:1}
};

/* ---------- state ---------- */
let st='title',P,E,PB,EB,PU,FX,stars,wave,queue,waveT,pause,banner,boss,score,tick=0,flash=0,shake=0,K={l:0,r:0,u:0,d:0},kills,endT=0,newBest=false;
function mkStars(){
 stars=[];for(let i=0;i<70;i++)stars.push({x:rf(0,VW),y:rf(0,VH),s:i<30?18:i<55?35:60,c:i<30?'#3a4570':i<55?'#7d8bbd':'#fff'});
}
function resetGame(){
 P={x:VW/2,y:VH-40,lives:3,inv:0,cd:0,spread:0,rapid:0,shield:0,jam:0};
 E=[];PB=[];EB=[];PU=[];FX=[];wave=0;queue=[];waveT=0;pause=1;banner={t:0,txt:''};boss=null;score=0;kills=0;flash=0;shake=0;newBest=false;
 mkStars();
 startWave();
}

/* ---------- waves (randomized each run) ---------- */
function genWave(n){
 const q=[],add=(tm,type,x,o)=>q.push(Object.assign({t:tm,type,x},o));
 const side=()=>Math.random()<.5?-1:1;
 if(n===1){for(let i=0;i<6;i++)add(i*.55,'drone',ri(30,150))}
 else if(n===2){for(let i=0;i<5;i++)add(i*.8,'diver',ri(20,160));for(let i=0;i<3;i++)add(1+i*1.2,'drone',ri(30,150))}
 else if(n===3){add(0,'shooter',0,{dir:side()});add(2.5,'shooter',0,{dir:side()});for(let i=0;i<5;i++)add(1+i*.6,'drone',ri(30,150))}
 else if(n===4){for(let i=0;i<4;i++){add(i*.8,'drone',ri(30,70));add(i*.8,'drone',ri(110,150))}for(let i=0;i<3;i++)add(4+i*.7,'diver',ri(20,160))}
 else if(n===5){for(let i=0;i<3;i++)add(i*2,'shooter',0,{dir:side()});for(let i=0;i<6;i++)add(1+i*.8,'diver',ri(20,160))}
 else{
  for(let i=0;i<4;i++)add(rf(0,9),'shooter',0,{dir:side()});
  for(let i=0;i<6;i++)add(rf(0,9),'drone',ri(30,150));
  for(let i=0;i<6;i++)add(rf(0,9),'diver',ri(20,160));
 }
 return q.sort((a,b)=>a.t-b.t);
}
function startWave(){
 wave++;
 if(wave>6){startBoss();return}
 queue=genWave(wave);waveT=0;banner={t:1.6,txt:t('wv',wave)};renderHud();
}
function startBoss(){
 queue=[];banner={t:2.4,txt:t('warn')+'\n'+t('bossn'),warn:1};beep(150,.5,'sawtooth',.05,-60);
 boss={type:'boss',x:VW/2,y:-34,w:50,h:24,hp:130,max:130,t:0,cd:1.5,enter:1,hurt:0,phase:0,ex:0};
 E.push(boss);renderHud();
}
function spawn(q){
 if(q.type==='drone')E.push({type:'drone',x:q.x,x0:q.x,y:-10,w:10,h:8,hp:2,max:2,t:rf(0,6),ph:rf(0,6),cd:rf(1,2),hurt:0,pts:100});
 else if(q.type==='diver')E.push({type:'diver',x:q.x,y:-10,w:9,h:10,hp:1,max:1,t:0,state:0,vx:0,vy:0,hurt:0,pts:150});
 else E.push({type:'shooter',x:q.dir>0?-12:VW+12,y:rf(40,90),dir:q.dir,w:14,h:8,hp:5,max:5,t:0,cd:rf(.6,1.2),hurt:0,pts:250});
}

/* ---------- helpers ---------- */
function boom(x,y,n,cols,sp){
 for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rf(20,sp||90);FX.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rf(.25,.55),col:cols[ri(0,cols.length-1)]})}
}
function text(x,y,s,col){FX.push({x,y,vx:0,vy:-24,life:.8,txt:s,col:col||'#fff'})}
function ebullet(x,y,ang,sp,big){EB.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:big?3:2,big})}
function aim(x,y){return Math.atan2(P.y-y,P.x-x)}
function dropPU(x,y){
 const keys=Object.keys(PW),tot=keys.reduce((a,k)=>a+PW[k].w,0);let r=Math.random()*tot,k=keys[0];
 for(const key of keys){r-=PW[key].w;if(r<=0){k=key;break}}
 PU.push({x,y,k});
}
function killEnemy(e,drop){
 e.dead=1;score+=e.pts||0;kills++;
 boom(e.x,e.y,e.type==='boss'?40:12,e.type==='drone'?['#5be37d','#fff']:e.type==='diver'?['#ff9f43','#ffcf3f']:['#a66bd6','#fff','#ffcf3f'],e.type==='boss'?150:90);
 beep(e.type==='boss'?70:130,e.type==='boss'?.6:.12,'sawtooth',.04,-40);shake=Math.max(shake,e.type==='boss'?.5:.05);
 if(drop&&e.type!=='boss'&&Math.random()<.16)dropPU(e.x,e.y);
 renderHud();
}
function damageEnemy(e,d){
 if(e.dead||(e.enter))return;
 e.hp-=d;e.hurt=.08;
 if(e.hp<=0){
  killEnemy(e,true);
  if(e.type==='boss'){st='bossdead';endT=2.2;EB=[]}
 }
}
function hurtPlayer(){
 if(P.inv>0||st!=='play')return;
 if(P.shield>0){P.shield=0;P.inv=.8;flash=.15;beep(500,.12,'triangle',.05,-250);return}
 P.lives--;P.inv=1.8;shake=.3;flash=.2;boom(P.x,P.y,18,['#5ee7ff','#fff','#ff4d5e'],110);beep(90,.35,'sawtooth',.06,-40);vib(60);
 P.spread=P.rapid=P.jam=0;
 if(P.lives<=0){st='dying';endT=1.2}
 renderHud();
}
function applyPU(k){
 beep(700,.12,'triangle',.05,400);
 if(k==='spread'){P.spread=10;text(P.x-14,P.y-14,t('p_spread'),'#5ee7ff')}
 else if(k==='rapid'){P.rapid=10;P.jam=0;text(P.x-14,P.y-14,t('p_rapid'),'#ffcf3f')}
 else if(k==='shield'){P.shield=12;text(P.x-14,P.y-14,t('p_shield'),'#5b8cff')}
 else if(k==='life'){P.lives=Math.min(5,P.lives+1);text(P.x-14,P.y-14,t('p_life'),'#5be37d');renderHud()}
 else if(k==='jam'){P.jam=6;P.rapid=0;text(P.x-14,P.y-14,t('p_jam'),'#ff4d5e');beep(120,.25,'sawtooth',.05,-50)}
 else if(k==='bomb'){
  flash=.35;EB=[];text(P.x-14,P.y-14,t('p_bomb'),'#ff9f43');beep(80,.5,'sawtooth',.07,-30);vib(50);
  for(const e of E){if(e.dead)continue;boom(e.x,e.y,6,['#ff9f43','#fff'],80);damageEnemy(e,e.type==='boss'?14:8)}
 }
}

/* ---------- update ---------- */
function update(dt){
 tick+=dt;
 if(shake>0)shake-=dt;if(flash>0)flash-=dt;
 for(const s of stars){s.y+=s.s*dt;if(s.y>VH){s.y=0;s.x=rf(0,VW)}}
 FX.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt});FX=FX.filter(f=>f.life>0);
 if(st==='title'||st==='over'||st==='win')return;
 if(st==='dying'){endT-=dt;if(endT<=0){st='over';finish();showOver()}return}
 if(st==='bossdead'){
  endT-=dt;if(Math.random()<.4)boom(boss.x+rf(-24,24),boss.y+rf(-10,10),8,['#ffcf3f','#ff9f43','#fff'],100);
  if(endT<=0){st='win';score+=2000;finish();showWin()}
  return;
 }
 const p=P;
 if(banner.t>0)banner.t-=dt;
 if(p.inv>0)p.inv-=dt;
 ['spread','rapid','shield','jam'].forEach(k=>{if(p[k]>0)p[k]-=dt});
 // keyboard movement
 p.x+=(K.r-K.l)*130*dt;p.y+=(K.d-K.u)*130*dt;
 p.x=Math.max(8,Math.min(VW-8,p.x));p.y=Math.max(30,Math.min(VH-14,p.y));
 // fire
 p.cd-=dt;
 if(p.cd<=0){
  p.cd=p.rapid>0?.09:p.jam>0?.4:.18;
  if(p.spread>0){[-.22,0,.22].forEach(a=>PB.push({x:p.x,y:p.y-8,vx:Math.sin(a)*260,vy:-Math.cos(a)*260}))}
  else PB.push({x:p.x,y:p.y-8,vx:0,vy:-260});
  beep(880,.03,'square',.008);
 }
 // waves
 if(!boss){
  waveT+=dt;
  while(queue.length&&queue[0].t<=waveT)spawn(queue.shift());
  if(!queue.length&&!E.some(e=>!e.dead)){
   pause-=dt;if(pause<=0){pause=1.2;startWave()}
  }
 }
 // enemies
 for(const e of E){
  if(e.dead)continue;
  if(e.hurt>0)e.hurt-=dt;
  e.t+=dt;
  if(e.type==='drone'){
   e.y+=38*dt;e.x=e.x0+Math.sin(e.t*2+e.ph)*28;
   e.cd-=dt;if(e.cd<=0&&e.y>10&&e.y<VH*.6){e.cd=rf(1.6,2.6);ebullet(e.x,e.y+4,Math.PI/2,70)}
   if(e.y>VH+12)e.dead=1;
  }else if(e.type==='diver'){
   if(e.state===0){e.y+=Math.min(50,(46-e.y)*2+8)*dt;if(e.t>1.1&&e.y>30)e.state=1,e.t=0}
   else if(e.state===1){if(e.t>.5){const a=aim(e.x,e.y);e.vx=Math.cos(a)*135;e.vy=Math.sin(a)*135;e.state=2}}
   else{e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y>VH+14||e.x<-20||e.x>VW+20)e.dead=1}
  }else if(e.type==='shooter'){
   e.x+=e.dir*42*dt;
   e.cd-=dt;if(e.cd<=0&&e.x>8&&e.x<VW-8){e.cd=1.3;ebullet(e.x,e.y+4,aim(e.x,e.y),85)}
   if((e.dir>0&&e.x>VW+16)||(e.dir<0&&e.x<-16))e.dead=1;
  }else if(e.type==='boss'){
   if(e.enter){e.y+=40*dt;if(e.y>=46){e.y=46;e.enter=0}}
   else{
    e.x=VW/2+Math.sin(e.t*.9)*(VW/2-34);
    const pc=e.hp/e.max;e.phase=pc>.66?0:pc>.33?1:2;
    e.cd-=dt;
    if(e.cd<=0){
     if(e.phase===0){e.cd=1.1;const a=aim(e.x,e.y+10);[-.28,0,.28].forEach(d=>ebullet(e.x,e.y+12,a+d,80,1))}
     else if(e.phase===1){e.cd=1.5;const off=rf(0,6.28);for(let i=0;i<12;i++)ebullet(e.x,e.y+8,off+i*Math.PI/6,62,1);}
     else{e.cd=.5;ebullet(rf(10,VW-10),-4,Math.PI/2,95);ebullet(e.x,e.y+12,aim(e.x,e.y+10),95,1)}
    }
   }
  }
  // body collision with player
  if(!e.enter&&Math.abs(e.x-P.x)<e.w/2+3&&Math.abs(e.y-P.y)<e.h/2+3){hurtPlayer();if(e.type!=='boss'){e.dead=1;boom(e.x,e.y,8,['#fff','#ff9f43'])}}
 }
 // player bullets
 for(const b of PB){
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y<-8||b.x<-8||b.x>VW+8){b.dead=1;continue}
  for(const e of E){
   if(e.dead||e.enter)continue;
   if(Math.abs(b.x-e.x)<e.w/2+1&&Math.abs(b.y-e.y)<e.h/2+2){b.dead=1;damageEnemy(e,1);beep(300,.03,'square',.01);break}
  }
 }
 // enemy bullets
 for(const b of EB){
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y>VH+8||b.y<-12||b.x<-8||b.x>VW+8){b.dead=1;continue}
  if(Math.hypot(b.x-P.x,b.y-P.y)<b.r+3){b.dead=1;hurtPlayer()}
 }
 // power-ups
 for(const u of PU){
  u.y+=42*dt;
  if(Math.abs(u.x-P.x)<9&&Math.abs(u.y-P.y)<10){u.dead=1;applyPU(u.k)}
  if(u.y>VH+10)u.dead=1;
 }
 PB=PB.filter(b=>!b.dead);EB=EB.filter(b=>!b.dead);PU=PU.filter(u=>!u.dead);E=E.filter(e=>!e.dead||e===boss&&st==='bossdead');
}
function finish(){
 if(score>hi){hi=score;newBest=true;try{localStorage.setItem(hiKey,hi)}catch(e){}}
}

/* ---------- rendering ---------- */
const F='7px "Press Start 2P",monospace';
function txt(s,x,y,col,al){ctx.font=F;ctx.textAlign=al||'left';ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function drawEnemy(e){
 const x=Math.round(e.x),y=Math.round(e.y),f=e.hurt>0;
 if(e.type==='drone'){
  const c=f?'#fff':'#5be37d',d=f?'#fff':'#2f9e55';
  ctx.fillStyle='#000';ctx.fillRect(x-6,y-4,12,9);
  ctx.fillStyle=d;ctx.fillRect(x-5,y-1,10,3);ctx.fillRect(x-6,y+1,2,4);ctx.fillRect(x+4,y+1,2,4);
  ctx.fillStyle=c;ctx.fillRect(x-4,y-3,8,6);
  ctx.fillStyle='#fff';ctx.fillRect(x-3,y-1,2,2);ctx.fillRect(x+1,y-1,2,2);ctx.fillStyle='#000';ctx.fillRect(x-2,y,1,1);ctx.fillRect(x+2,y,1,1);
 }else if(e.type==='diver'){
  const c=f?'#fff':(e.state===1&&((tick*20|0)%2)?'#ff4d5e':'#ff9f43');
  ctx.fillStyle='#000';ctx.fillRect(x-5,y-6,10,6);ctx.fillRect(x-3,y,6,3);ctx.fillRect(x-1,y+3,2,3);
  ctx.fillStyle=c;ctx.fillRect(x-4,y-5,8,5);ctx.fillRect(x-2,y,4,2);ctx.fillRect(x,y+2,1,2);
  if(e.state===2){ctx.fillStyle='#ffcf3f';ctx.fillRect(x-1,y-9,2,3)}
 }else if(e.type==='shooter'){
  const c=f?'#fff':'#a66bd6';
  ctx.fillStyle='#000';ctx.fillRect(x-8,y-4,16,9);
  ctx.fillStyle=c;ctx.fillRect(x-7,y-1,14,4);ctx.fillRect(x-4,y-3,8,7);
  ctx.fillStyle='#ffcf3f';ctx.fillRect(x-1,y-1,2,2);ctx.fillStyle='#4a2a6a';ctx.fillRect(x-6,y+3,2,3);ctx.fillRect(x+4,y+3,2,3);
 }else{
  const c=f?'#fff':'#e63946',d=f?'#fff':'#7a1c25',m=f?'#fff':'#444a66';
  ctx.fillStyle='#000';ctx.fillRect(x-27,y-14,54,28);
  ctx.fillStyle=d;ctx.fillRect(x-26,y-8,52,14);ctx.fillRect(x-20,y+6,40,6);
  ctx.fillStyle=c;ctx.fillRect(x-18,y-12,36,16);
  ctx.fillStyle=m;ctx.fillRect(x-26,y+4,8,8);ctx.fillRect(x+18,y+4,8,8);ctx.fillRect(x-4,y+8,8,6);
  ctx.fillStyle='#ffcf3f';ctx.fillRect(x-6,y-7,12,6);ctx.fillStyle='#000';ctx.fillRect(x-1,y-6,2,4);
 }
}
function render(){
 const sx=shake>0?Math.round((Math.random()-.5)*4):0,sy=shake>0?Math.round((Math.random()-.5)*4):0;
 ctx.save();ctx.translate(sx,sy);
 ctx.fillStyle='#070b1a';ctx.fillRect(-4,-4,VW+8,VH+8);
 for(const s of stars){ctx.fillStyle=s.c;ctx.fillRect(Math.round(s.x),Math.round(s.y),s.s>50?2:1,s.s>50?2:1)}
 // power-ups
 for(const u of PU){
  const d=PW[u.k],x=Math.round(u.x),y=Math.round(u.y);
  ctx.fillStyle='#000';ctx.fillRect(x-6,y-6,12,12);ctx.fillStyle=d.col;ctx.fillRect(x-5,y-5,10,10);
  ctx.fillStyle=d.bad?'#fff':'#000';ctx.fillRect(x-5,y-5,10,1);
  txt(d.ch,x,y-3,d.bad?'#fff':'#000','center');
  if(d.bad&&((tick*8|0)%2)){ctx.strokeStyle='#ff4d5e';ctx.strokeRect(x-7.5,y-7.5,15,15)}
 }
 E.forEach(drawEnemy);
 // bullets
 ctx.fillStyle='#5ee7ff';for(const b of PB)ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-3,2,6);
 for(const b of EB){
  const r=b.r;ctx.fillStyle='#000';ctx.fillRect(Math.round(b.x)-r-1,Math.round(b.y)-r-1,r*2+2,r*2+2);
  ctx.fillStyle=b.big?'#ff4de0':'#ff7a45';ctx.fillRect(Math.round(b.x)-r,Math.round(b.y)-r,r*2,r*2);
  ctx.fillStyle='#fff';ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,1,1);
 }
 // player
 if(st==='play'||st==='bossdead'){
  if(!(P.inv>0&&((tick*20|0)%2))){
   const x=Math.round(P.x),y=Math.round(P.y);
   ctx.drawImage(SHIP,x-4,y-4);
   ctx.fillStyle=(tick*30|0)%2?'#ffcf3f':'#ff9f43';ctx.fillRect(x-1,y+4,2,2+((tick*30|0)%3));
   if(P.shield>0){ctx.strokeStyle=P.shield<3&&((tick*10|0)%2)?'#fff':'#5b8cff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,9,0,6.3);ctx.stroke()}
  }
 }
 // particles
 for(const f of FX){
  if(f.txt)txt(f.txt,Math.round(f.x),Math.round(f.y),f.col);
  else{ctx.fillStyle=f.col;ctx.fillRect(Math.round(f.x),Math.round(f.y),2,2)}
 }
 ctx.restore();
 if(flash>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(.6,flash*2)})`;ctx.fillRect(0,0,VW,VH)}
 // boss bar
 if(boss&&!boss.dead&&st==='play'){
  ctx.fillStyle='#000';ctx.fillRect(20,6,140,9);ctx.fillStyle='#5b1f2b';ctx.fillRect(22,8,136,5);
  ctx.fillStyle='#ff4d5e';ctx.fillRect(22,8,Math.max(0,136*boss.hp/boss.max),5);
 }
 // effects hud
 let ly=VH-10;
 [['spread','#5ee7ff'],['rapid','#ffcf3f'],['shield','#5b8cff'],['jam','#ff4d5e']].forEach(([k,c])=>{
  if(P&&P[k]>0){txt(t('p_'+k)+' '+Math.ceil(P[k]),4,ly,c);ly-=10}
 });
 // banner
 if(banner.t>0&&st==='play'){
  const lines=banner.txt.split('\n'),y0=110-lines.length*6;
  lines.forEach((l,i)=>txt(l,VW/2,y0+i*12,banner.warn?(((tick*6|0)%2)?'#ff4d5e':'#fff'):'#ffcf3f','center'));
 }
}

/* ---------- UI ---------- */
function renderHud(){
 $('#score').innerHTML=`${t('score')}<b>${score||0}</b>`;
 $('#lives').innerHTML=`${t('lives')}<b>${P?P.lives:3}</b>`;
 $('#wave').innerHTML=`${t('wave')}<b>${boss?t('boss'):Math.min(wave,6)+'/6'}</b>`;
}
let cur=null;
function show(html){$('#ov').innerHTML=`<div class="modal">${html}</div>`;$('#ov').style.display='flex'}
function hide(){$('#ov').style.display='none';cur=null}
function legend(){
 return '<div class="legend">'+Object.keys(PW).map(k=>`<span><i style="background:${PW[k].col};${PW[k].bad?'color:#fff':''}">${PW[k].ch}</i></span><span style="color:${PW[k].bad?'#ff9aa5':'#dfe6f5'}">${t('p_'+k).replace('!','')}: ${t('d_'+k)}</span>`).join('')+'</div>';
}
function showTitle(){cur=showTitle;
 show(`<h2>${t('title')}</h2><p>${t('sub')}</p><p>${t('how')}</p>${legend()}<p style="color:var(--gold)">${t('keys')}</p>
 <button class="btn gold" onclick="startGame()">${t('start')}</button>`)}
function showOver(){cur=showOver;
 show(`<h2 style="color:var(--red)">${t('over')}</h2><p>${t('sc',score)}</p>${newBest?`<p style="color:var(--gold)">${t('newbest')}</p>`:''}<p>${t('best',hi)}</p>
 <button class="btn red" onclick="startGame()">${t('retry')}</button>`)}
function showWin(){cur=showWin;
 show(`<h2>${t('win')}</h2><p>${t('sc',score)}</p>${newBest?`<p style="color:var(--gold)">${t('newbest')}</p>`:''}<p>${t('best',hi)}</p>
 <button class="btn gold" onclick="startGame()">${t('again')}</button>`)}
function startGame(){resetGame();st='play';hide();renderHud();beep(440,.1,'triangle',.04)}

/* ---------- input: drag anywhere to move ---------- */
let drag=null;
const app=$('#app');
app.addEventListener('pointerdown',e=>{
 if(e.target.closest('button'))return;
 e.preventDefault();drag={id:e.pointerId,x:e.clientX,y:e.clientY};
});
addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id||!P||st!=='play')return;
 const k=VW/cv.clientWidth*1.35;
 P.x=Math.max(8,Math.min(VW-8,P.x+(e.clientX-drag.x)*k));
 P.y=Math.max(30,Math.min(VH-14,P.y+(e.clientY-drag.y)*k));
 drag.x=e.clientX;drag.y=e.clientY;
});
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,e=>{if(drag&&e.pointerId===drag.id)drag=null}));
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();K[k]=1}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){e.preventDefault();K[k]=0}});
addEventListener('blur',()=>{K={l:0,r:0,u:0,d:0};drag=null});

/* ---------- language / sound / layout ---------- */
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('#lang').textContent=LANG.toUpperCase();
 $('#mute').textContent=t('snd');$('#mute').classList.toggle('off',muted);
 document.title=t('title');
}
$('#lang').onclick=()=>{
 LANG=LANG==='es'?'en':'es';try{localStorage.setItem(langKey,LANG)}catch(e){}
 applyLang();renderHud();
 if($('#ov').style.display==='flex'&&cur)cur();
};
$('#mute').onclick=()=>{muted=!muted;applyLang()};
function layout(){
 const s=$('#stage'),w=s.clientWidth,h=s.clientHeight,sc=Math.max(.5,Math.min((w-8)/VW,(h-8)/VH));
 cv.style.width=Math.floor(VW*sc)+'px';cv.style.height=Math.floor(VH*sc)+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
 acc+=Math.min(.1,(now-last)/1000);last=now;
 while(acc>=1/60){update(1/60);acc-=1/60}
 render();requestAnimationFrame(frame);
}
mkStars();P={x:VW/2,y:VH-40,lives:3,spread:0,rapid:0,shield:0,jam:0,inv:0};E=[];PB=[];EB=[];PU=[];FX=[];banner={t:0,txt:''};boss=null;score=0;wave=0;
applyLang();renderHud();layout();showTitle();
requestAnimationFrame(frame);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-pixel-poker">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Poker Rogue</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#14202b;--felt:#1d5c47;--felt2:#17503d;--panel:#26344d;--panel2:#1c273b;--ink:#000;--cream:#f4ecd8;
--chip:#3fa7ff;--mult:#ff4d5e;--gold:#ffcf3f;--green:#5be37d;--grey:#8b97ad;
--avail:calc(min(100vw,640px) - 32px)}
*{box-sizing:border-box;image-rendering:pixelated;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 background:var(--bg);color:#fff;font-family:'Press Start 2P',ui-monospace,Consolas,monospace;font-size:9px;line-height:1.5}
body{background:repeating-conic-gradient(#182633 0 25%,#14202b 0 50%) 0 0/32px 32px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px)}
#app{height:100vh;height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
 padding:max(6px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
header .btn{font-size:8px;padding:4px 5px;min-height:36px}
header .btn.off{text-decoration:line-through;opacity:.55}
header .r{flex:none;gap:4px}
h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
header .k{font-size:7px;white-space:nowrap}
h1{font-size:10px;margin:0;color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap}
header{display:flex;justify-content:space-between;align-items:center;gap:6px;flex:none}
header .r{display:flex;align-items:center;gap:4px}
.px{border:3px solid var(--ink);box-shadow:0 3px 0 #000,inset 0 0 0 2px rgba(255,255,255,.12)}
.panel{background:var(--panel);padding:6px}
.btn{font:inherit;font-size:11px;color:#fff;background:#3a6df0;border:4px solid #000;box-shadow:0 4px 0 #000;padding:10px 12px;cursor:pointer;text-transform:uppercase;min-height:44px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #000;filter:brightness(1.2)}
.btn:disabled{background:#4a5160;color:#8a90a0;cursor:not-allowed}
.btn.red{background:#d63c4a}.btn.gold{background:#d9a21b;color:#000}.btn.green{background:#2f9e55}
.btn.small{font-size:9px;padding:6px 8px;min-height:40px}
#hud{display:flex;gap:6px;flex:none}
#blind{flex:1 1 0;min-width:0}
#blind .k{font-size:7px}
#blind .name{font-size:9px;color:var(--gold);margin:2px 0;overflow-wrap:anywhere}
#blind .target{font-size:12px}
#blind .mod{margin-top:4px;padding:4px;font-size:7px;line-height:1.5;border:2px solid #000}
.mod.nerf{background:#5b1f2b;color:#ffb3bd}.mod.boon{background:#1f5b33;color:#b8ffcb}.mod.none{background:#222c3f;color:var(--grey)}
#scorebox{flex:1 1 0;min-width:0}
#scorebox .k{font-size:7px}
#rscore{font-size:13px}
#scorebox .hn{height:14px;font-size:8px;color:var(--gold);white-space:nowrap;overflow:hidden}
#scorebox .eq{display:flex;align-items:center;gap:4px;margin-top:2px}
#scorebox .eq div{flex:1;text-align:center;font-size:12px;padding:8px 1px;border:3px solid #000;min-width:0;overflow:hidden}
#scorebox .eq span{font-size:8px}
#chips{background:var(--chip);color:#000}#mult{background:var(--mult);color:#fff}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:none}
.stat{background:var(--panel2);padding:5px 2px;border:3px solid #000;text-align:center;font-size:6px;color:var(--grey);min-height:44px}
.stat b{display:block;font-size:13px;margin-top:3px;color:#fff}
.stat.h b{color:var(--chip)}.stat.d b{color:var(--mult)}.stat.m b{color:var(--gold)}
.stat.tap{border-color:var(--gold);cursor:pointer}
#table{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--felt);padding:8px;border:4px solid #000;
 box-shadow:0 4px 0 #000,inset 0 0 0 4px var(--felt2)}
#jokers{display:flex;gap:4px;height:76px;flex:none}
.slot{flex:1 1 0;max-width:80px;min-width:0;border:3px dashed #0007;background:#0002}
#jinfo{flex:none;min-height:34px;font-size:8px;line-height:1.5;padding:5px 2px;color:#dfe6f5}
#jinfo b{color:var(--gold)}
#hand{--cols:6;--cw:min(64px,calc((var(--avail) - (var(--cols) - 1) * 4px) / var(--cols)));
 flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:12px 4px;justify-content:center;align-content:center;padding-top:14px}
.card{width:var(--cw);height:calc(var(--cw) * 1.4);background:var(--cream);border:3px solid #000;box-shadow:0 3px 0 #000;
 position:relative;cursor:pointer;transition:transform .08s;flex:none}
.card.sel{transform:translateY(-14px)}
.card.score{transform:translateY(-18px);outline:3px solid var(--gold)}
.card .cn{position:absolute;left:3px;top:3px;text-align:center;font-size:calc(var(--cw) * .2);line-height:1.1}
.card .cn img{display:block;margin:2px auto 0;width:calc(var(--cw) * .2)}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.card .mid img{width:calc(var(--cw) * .48)}
.card.deb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#000a 0 4px,#0006 4px 8px)}
.joker{width:100%;background:#2d3550;border:3px solid #000;box-shadow:0 3px 0 #000;padding:6px;text-align:center;position:relative}
.joker img{display:block;margin:0 auto;width:36px}
.joker.curse{background:#4a1d2a;box-shadow:0 3px 0 #000,inset 0 0 0 3px #ff4d5e}
.joker.good{box-shadow:0 3px 0 #000,inset 0 0 0 3px var(--gold)}
.joker .jn{font-size:8px;margin:5px 0;color:var(--gold);overflow-wrap:anywhere}
.joker .jd{font-size:8px;line-height:1.6;color:#dfe6f5}
.joker.c{flex:1 1 0;max-width:80px;min-width:0;height:100%;padding:3px 2px;cursor:pointer}
.joker.c img{width:46%}
.joker.c .jn{font-size:6px;margin:3px 0 0;overflow-wrap:anywhere;line-height:1.35}
.joker.c.on{outline:3px solid #fff}
.joker.pop{animation:pop .3s steps(3)}
@keyframes pop{50%{transform:translateY(-10px) scale(1.08)}}
#btns{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#btns .big{min-height:54px;font-size:12px}
#btns .row3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#overlay,#deckview{position:fixed;inset:0;background:#000b;z-index:60;display:none;align-items:flex-start;justify-content:center;
 overflow:auto;-webkit-overflow-scrolling:touch;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
#deckview{z-index:70;background:#000c}
.modal{background:var(--panel);width:100%;max-width:640px;padding:12px;margin:auto}
.modal h2{margin:0 0 10px;color:var(--gold);font-size:14px;text-shadow:2px 2px 0 #000}
.modal p{font-size:9px;line-height:1.9;color:#dfe6f5}
.pay div{display:flex;justify-content:space-between;font-size:9px;padding:3px 0;border-bottom:2px dashed #fff3}
.pay .tot{color:var(--gold);font-size:11px;border:none}
.shop,.sellrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.item{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:0}
.item.sold{opacity:.25;pointer-events:none}
.upg{background:#1e4f6e;border:3px solid #000;box-shadow:0 3px 0 #000,inset 0 0 0 3px var(--chip);padding:6px;text-align:center;flex:1}
.upg .jn{font-size:8px;color:var(--chip);margin:6px 0}.upg .big{font-size:20px;margin:6px 0}
.upg .jd{font-size:8px;line-height:1.6}
.sticky{position:sticky;bottom:-12px;margin:14px -12px -12px;padding:10px 12px;background:var(--panel);border-top:3px solid #000;display:flex;gap:10px}
.sticky .btn{flex:1}
.float{position:fixed;transform:translate(-50%,0);font-size:12px;z-index:80;pointer-events:none;text-shadow:2px 2px 0 #000;animation:fl .9s steps(9) forwards}
.float.c{color:var(--chip)}.float.m{color:var(--mult)}.float.x{color:var(--gold);font-size:16px}.float.d{color:#aaa}
@keyframes fl{to{transform:translate(-50%,-44px);opacity:0}}
#flash{animation:fs .35s steps(3)}@keyframes fs{50%{transform:scale(1.12)}}
.title{text-align:center}.title h2{font-size:20px;margin:6px 0 14px}
.k{color:var(--grey);font-size:8px}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0}
.dh{display:flex;justify-content:center;align-items:center;padding:4px 0;background:#cfd6e6;border:3px solid #000}
.dc{background:var(--cream);border:3px solid #000;height:30px;display:flex;align-items:center;gap:4px;padding:0 4px;font-size:10px;overflow:hidden;min-width:0}
.dc img{width:14px;flex:none}
.dc .n{margin-left:auto;color:#fff;background:var(--mult);font-size:7px;padding:2px 3px}
.dc.zero{opacity:.18}
.dsum{display:flex;gap:10px;flex-wrap:wrap;font-size:8px;margin-top:6px}
.hl{margin-top:10px}
.hl .r{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 6px;border-bottom:2px solid #0004;font-size:9px}
.hl .r.on{background:var(--gold);color:#000}
@media(max-height:620px) and (orientation:portrait){
 #jokers{height:62px}#jinfo{min-height:28px;padding:3px 2px}#hand{gap:8px 4px}
 .stat{min-height:38px}#btns .big{min-height:46px}
}
@media(orientation:landscape) and (max-height:520px){
 :root{--avail:calc(min(100vw,900px) * .58 - 24px)}
 #app{max-width:900px;display:grid;grid-template-columns:42% 1fr;grid-template-rows:auto auto 1fr auto;column-gap:8px;row-gap:4px;
  padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
 header{grid-column:1;grid-row:1}
 #hud{grid-column:1;grid-row:2}
 #stats{grid-column:1;grid-row:3;align-self:start}
 #table{grid-column:2;grid-row:1/4}
 #btns{grid-column:2;grid-row:4}
 #btns .big{min-height:40px}#btns .btn.small{min-height:32px}
 #jokers{height:54px}#jinfo{min-height:24px}
 #hand{gap:8px 4px;padding-top:10px}
 .modal h2{font-size:12px}
}

  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

/* ---------- poker ---------- */
const HANDS=['High Card','Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
const BASE={'High Card':[5,1],'Pair':[10,2],'Two Pair':[20,2],'Three of a Kind':[30,3],'Straight':[30,4],'Flush':[35,4],'Full House':[40,4],'Four of a Kind':[60,7],'Straight Flush':[100,8]};
const GROW={'High Card':[10,1],'Pair':[15,1],'Two Pair':[20,1],'Three of a Kind':[20,2],'Straight':[30,3],'Flush':[15,2],'Full House':[25,2],'Four of a Kind':[30,3],'Straight Flush':[40,4]};
function evalHand(cs){
 if(!cs.length)return null;
 const n=cs.length,cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);
 const gr=Object.entries(cnt).map(([r,k])=>({r:+r,k})).sort((a,b)=>b.k-a.k||b.r-a.r);
 const rs=cs.map(c=>c.r).sort((a,b)=>a-b);
 const flush=n===5&&cs.every(c=>c.s===cs[0].s);
 const straight=n===5&&new Set(rs).size===5&&(rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14');
 const pr=g=>cs.filter(c=>g.some(x=>x.r===c.r));
 if(straight&&flush)return{name:'Straight Flush',scoring:cs};
 if(gr[0].k===4)return{name:'Four of a Kind',scoring:pr([gr[0]])};
 if(gr[0].k===3&&gr[1]&&gr[1].k===2)return{name:'Full House',scoring:cs};
 if(flush)return{name:'Flush',scoring:cs};
 if(straight)return{name:'Straight',scoring:cs};
 if(gr[0].k===3)return{name:'Three of a Kind',scoring:pr([gr[0]])};
 if(gr[0].k===2&&gr[1]&&gr[1].k===2)return{name:'Two Pair',scoring:pr([gr[0],gr[1]])};
 if(gr[0].k===2)return{name:'Pair',scoring:pr([gr[0]])};
 const hi=cs.reduce((a,b)=>b.r>a.r?b:a);
 return{name:'High Card',scoring:[hi]};
}

 curse3:{w:3,curse:1,gen:()=>{const c=ri(12,20)*10;return{c,name:'Heavy Coin',cost:3}},

const JARGS={mult:j=>[j.m],chips:j=>[j.c],suit:j=>[sn(j.s),j.m],faces:j=>[j.c],xhand:j=>[j.x,hn(j.T)],money:j=>[j.v],
 hands:()=>[],disc:()=>[],size:()=>[],gambler:j=>[j.hi],grow:j=>[j.inc,j.val],final:j=>[j.x],curse1:j=>[j.x],curse2:j=>[j.m],curse3:j=>[j.c]};

function genJoker(){
 const keys=Object.keys(JT),tot=keys.reduce((a,k)=>a+JT[k].w,0);
 let r=Math.random()*tot,t=keys[0];
 for(const k of keys){r-=JT[k].w;if(r<=0){t=k;break}}
 return Object.assign({t,val:0},JT[t].gen());
}

/* ---------- blind modifiers (nerfs & boons) ---------- */
const NERFS=[
 {id:'suit'},{id:'face'},{id:'slim',mods:{hands:-1}},{id:'dry',mods:{disc:-1}},{id:'weak'},
 {id:'small',mods:{size:-2}},{id:'heavy',tm:1.3}
];
const BOONS=[
 {id:'ehand',mods:{hands:1}},{id:'edisc',mods:{disc:2}},{id:'bmult'},{id:'cash'}
];
function rollMod(level,boss){
 let pk=null,kind='none';
 if(boss){pk=pick(NERFS);kind='nerf'}
 else{const r=Math.random();if(r<.3){pk=pick(NERFS);kind='nerf'}else if(r<.55){pk=pick(BOONS);kind='boon'}}
 if(!pk)return{kind:'none',id:'none'};
 const m=Object.assign({},pk,{kind});
 if(m.id==='suit')m.s=pick(Object.keys(SUIT));
 return m;
}

function newDeck(){
 const d=[];for(const s of Object.keys(SUIT))for(let r=2;r<=14;r++)d.push({s,r});
 // randomize the deck: swap 8-14 cards for random ones, with a biased suit and rank each round
 const suits=Object.keys(SUIT),hotS=pick(suits);
 for(let n=ri(8,14);n>0;n--){
  const roll=Math.random();
  d[ri(0,d.length-1)]={s:roll<.4?hotS:pick(suits),r:ri(2,14)};
 }
 for(let i=d.length-1;i>0;i--){const j=ri(0,i);[d[i],d[j]]=[d[j],d[i]]}
 return d;
}
function startGame(){
 G={level:1,money:4,jokers:[],lv:{},rerolls:0,busy:false,sort:'rank'};
 HANDS.forEach(h=>G.lv[h]=0);
 startRound();
}
function computeMods(mod){
 const m={hands:0,disc:0,size:0};
 const add=o=>{if(o)for(const k in o)m[k]+=o[k]};
 G.jokers.forEach(j=>{const f=JT[j.t].mods;if(f)add(f(j))});
 add(mod&&mod.mods);
 return m;
}
function startRound(){
 hideOverlay();
 G.boss=G.level%3===0;
 G.mod=rollMod(G.level,G.boss);
 let t=250*Math.pow(2.1,G.level-1);
 if(G.boss)t*=1.4; if(G.mod.tm)t*=G.mod.tm;
 G.target=Math.round(t/10)*10;
 const m=computeMods(G.mod);
 G.handsLeft=Math.max(1,4+m.hands);
 G.discLeft=Math.max(0,3+m.disc);
 G.handSize=Math.max(5,6+m.size);
 G.deck=newDeck();G.full=G.deck.slice();G.info=null;G.hand=[];G.sel=new Set();G.score=0;G.busy=false;
 draw();sortHand();
 setBox('',0,0);
 render();
}
function draw(){while(G.hand.length<G.handSize&&G.deck.length)G.hand.push(G.deck.pop())}
function sortHand(){
 if(G.sort==='rank')G.hand.sort((a,b)=>b.r-a.r||a.s.localeCompare(b.s));
 else G.hand.sort((a,b)=>a.s.localeCompare(b.s)||b.r-a.r);
}
function debuffed(c){
 const m=G.mod;
 return (m.id==='suit'&&c.s===m.s)||(m.id==='face'&&c.r>=11);
}
function handStats(n){
 const [c,m]=BASE[n],[gc,gm]=GROW[n],l=G.lv[n];
 return{chips:c+gc*l,mult:m+gm*l};

function float(el,txt,cls){

/* ---------- play / discard ---------- */
async function playHand(){
 if(G.busy||!G.sel.size||G.handsLeft<=0)return;
 G.busy=true;
 const idxs=[...G.sel].sort((a,b)=>a-b),played=idxs.map(i=>G.hand[i]);
 const ev=evalHand(played);
 const st=handStats(ev.name);
 let chips=st.chips,mult=st.mult;
 if(G.mod.id==='weak')mult=Math.max(1,mult-1);
 G.handsLeft--;
 render();
 setBox(ev.name,chips,mult);
 const handEl=$('#hand'),jEls=[...$('#jokers').querySelectorAll('.joker')];
 const ctx={hand:ev.name,last:G.handsLeft===0};
 let step=0;
 const apply=async(e,el)=>{
  const parts=[];
  if(e.chips){chips+=e.chips;parts.push(['+'+e.chips,'c'])}
  if(e.mult){mult+=e.mult;parts.push(['+'+e.mult,'m'])}
  if(e.xmult){mult*=e.xmult;parts.push(['x'+e.xmult,'x'])}
  if(!parts.length)return;
  setBox(ev.name,chips,mult);
  parts.forEach(([t,c],k)=>setTimeout(()=>float(el,t,c),k*120));
  if(el.classList.contains('joker')){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
  beep(300+step*45,.09);vib(12);step++;
  await sleep(380);
 };
 // mark scoring cards
 await sleep(250);
 for(const c of ev.scoring){
  const i=G.hand.indexOf(c),el=handEl.children[i];
  el.classList.add('score');
  const deb=debuffed(c);
  if(deb){float(el,t('debuff'),'d');beep(120,.12,'sawtooth');await sleep(300)}
  else await apply({chips:cval(c.r)},el);
  if(!deb)for(let k=0;k<G.jokers.length;k++){
   const f=JT[G.jokers[k].t].card,e=f&&f(G.jokers[k],c);
   if(e)await apply(e,jEls[k]);
  }
 }
 for(let k=0;k<G.jokers.length;k++){
  const f=JT[G.jokers[k].t].hand,e=f&&f(G.jokers[k],ctx);
  if(e)await apply(e,jEls[k]);
 }
 if(G.mod.id==='bmult')await apply({mult:5},$('#blind'));
 G.jokers.forEach(j=>{const f=JT[j.t].after;if(f)f(j)});
 const total=Math.floor(chips*mult);
 await sleep(200);
 // tween score
 const from=G.score,to=from+total;
 const box=$('#chips').parentElement;box.id='flash';
 setBox(ev.name,chips,mult);
 for(let s=1;s<=12;s++){$('#rscore').textContent=fmt(from+(to-from)*s/12);beep(200+s*30,.04,'triangle');await sleep(35)}
 box.id='';
 G.score=to;
 // remove played cards
 G.hand=G.hand.filter((_,i)=>!G.sel.has(i));G.sel.clear();
 draw();sortHand();G.busy=false;
 render();
 if(G.score>=G.target){await sleep(300);roundWin()}
 else if(G.handsLeft<=0){await sleep(300);gameOver()}
}
function discard(){
 if(G.busy||!G.sel.size||G.discLeft<=0)return;
 G.hand=G.hand.filter((_,i)=>!G.sel.has(i));G.sel.clear();
 G.discLeft--;draw();sortHand();beep(180,.1,'sawtooth');render();
}

 }
 for(const s of Object.keys(SUIT))sums+=`<span style="color:${s==='S'?'#aab':SUIT[s].c}">${sn(s)}: ${tots[s]}</span>`;

 DV=handsView;

 $('#deckview').style.display='flex';
}

 document.documentElement.lang=LANG;

 LANG=LANG==='es'?'en':'es';

 render();
 if($('#overlay').style.display==='flex'&&OV)OV();

HANDS.forEach(h=>G.lv[h]=0);

};

    if (b.x < -LX) { b.x = -LX; if (b.vx < 0) { hit = -b.vx; b.vx *= -0.78; } }

/* ---------- AI opponent ---------- */
const gauss = () => (Math.random() + Math.random() + Math.random() + Math.random() - 2) / 0.58;

    return Math.hypot(o.x - (ax + vx * t), o.z - (az + vz * t)) > 2 * R * 0.99;

/** Every clean "cue -> ghost ball -> pocket" shot the AI could take from (x0, z0) at a ball it is allowed to hit first. */
function shotsFrom(x0, z0) {

    let ux = px - b.x, uz = pz - b.z; const d2 = Math.hypot(ux, uz); ux /= d2; uz /= d2;
    const gx = b.x - ux * 2 * R, gz = b.z - uz * 2 * R;

    let cx = gx - x0, cz = gz - z0; const d1 = Math.hypot(cx, cz); if (d1 < 0.05) continue;
    cx /= d1; cz /= d1;

    if (balls.some(b => b !== cueBall && inPlay(b) && Math.hypot(b.x - x, b.z - z) < 2 * R + 0.1)) continue;
    const l = shotsFrom(x, z), q = l.length ? Math.max(...l.map(c => c.q)) : -5;

  } else {                                 // nothing clean: tap the nearest legal ball (prefer one with a clear line)
    const c = balls.filter(b => b !== cueBall && inPlay(b) && allowed('ai', b.num))
      .map(b => ({ b, d: Math.hypot(b.x - cueBall.x, b.z - cueBall.z) })).sort((a, b) => a.d - b.d);
    const t = c.find(o => segClear(cueBall.x, cueBall.z, o.b.x, o.b.z, o.b)) || c[0];
    pick = { dx: (t.b.x - cueBall.x) / t.d, dz: (t.b.z - cueBall.z) / t.d, v: 9 + t.d * 0.4 };

/* ---------- online play ----------

  isHost = true; netGone = false;
  const attempt = n => {
    const code = Array.from({ length: 4 }, () => CODE_CHARS[Math.random() * CODE_CHARS.length | 0]).join('');
    const pr = peer = new Peer(NET_PREFIX + code);
    pr.on('open', () => { hostCode = code; netStatus('netWait', code); $('#mShare').style.display = ''; });
    pr.on('error', e => { if (e.type === 'unavailable-id' && n < 6) attempt(n + 1); else netStatus('netErr'); });
    pr.on('connection', c => { if (conn) { c.close(); return; } setupConn(c); });
  };
  attempt(0);
}
function netJoin(code) {
  netClose(); netStatus('');
  if (typeof Peer === 'undefined') return netStatus('netNoLib');
  isHost = false; netGone = false; netStatus('netConnecting');
  const pr = peer = new Peer();
  pr.on('open', () => setupConn(pr.connect(NET_PREFIX + code, { reliable: true })));
  pr.on('error', e => netStatus(e.type === 'peer-unavailable' ? 'netNotFound' : 'netErr'));
}
function setupConn(c) {
  conn = c;
  const ready = () => { if (isHost) startOnline(); };
  c.on('open', ready); if (c.open) ready();
  c.on('data', onNet);
  c.on('close', onNetClose); c.on('error', onNetClose);
}
/** Link that opens this game on the join screen with the code filled in (the hub page's address + the code). */
function inviteUrl(code) {
  let base = ''; try { base = parent.location.href.split('#')[0]; } catch (e) { base = location.href.split('#')[0]; }
  return base + '#/game/low-poly-pool?join=' + code;
}
async function shareInvite() {
  if (!hostCode) return;
  const url = inviteUrl(hostCode);
  try { if (navigator.share) { await navigator.share({ title: tr('menuT'), text: tr('shareText'), url }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); netStatus('shareCopied'); }
  catch (e) { $('#mNet').textContent = url; }          // last resort: show it so it can be copied by hand
}
/** Opened through an invite link (#/game/low-poly-pool?join=ABCD): join that room straight away. */
function autoJoin() {
  let h = ''; try { h = parent.location.hash; } catch (e) {}
  const m = h.match(/[?&]join=([A-Za-z0-9]{4})/); if (!m) return;
  const code = m[1].toUpperCase();
  try { parent.history.replaceState(null, '', parent.location.href.split('#')[0] + '#/game/low-poly-pool'); } catch (e) {}
  $('#mCode').value = code; netJoin(code);
}
$('#mShare').onclick = shareInvite;
function startOnline() {                   // host: fresh rack, random breaker, tell the guest
  mode = 'online'; netGone = false; $('#menu').style.display = 'none';
  rack();
  const hostBreaks = Math.random() < 0.5;
  netSend({ t: 'start', order: lastOrder, hostBreaks });
  beginOnline(hostBreaks);
}
function beginOnline(iBreak) {
  turn = iBreak ? 'me' : 'ai'; state = iBreak ? 'aim' : 'aiAim';
  hud(); defaultAim(); say(iBreak ? 'youTurn' : 'aiTurn');
}
function onNet(m) {
  if (!m || typeof m.t !== 'string') return;
  if (m.t === 'start' && !isHost) {
    if (!Array.isArray(m.order) || m.order.length !== 15 || !m.order.every(Number.isInteger)) return;
    mode = 'online'; netGone = false; $('#menu').style.display = 'none';
    rack(m.order); beginOnline(!m.hostBreaks);
  } else if (m.t === 'rematch' && isHost && mode === 'online') startOnline();
  else if (mode !== 'online') return;
  else if (m.t === 'emote') { const n = performance.now(); if (EMOTES.includes(m.e) && n - lastEmoteIn > 500) { lastEmoteIn = n; showEmote('ai', m.e); } }
  else if (m.t === 'aim' && state === 'aiAim' && num(m.x, m.z, m.p)) { aimDir = { x: m.x, z: m.z }; aiPull = Math.max(0, Math.min(1, m.p)); }
  else if (m.t === 'place' && state === 'aiAim' && num(m.x, m.z)) { cueBall.x = Math.max(-LX, Math.min(LX, m.x)); cueBall.z = Math.max(-LZ, Math.min(LZ, m.z)); }
  else if (m.t === 'shot' && state === 'aiAim' && num(m.x, m.z, m.p, m.cx, m.cz)) {
    cueBall.x = Math.max(-LX, Math.min(LX, m.cx)); cueBall.z = Math.max(-LZ, Math.min(LZ, m.cz));
    aimDir = { x: m.x, z: m.z }; power = Math.max(0, Math.min(1, m.p)); aiPull = 0; fire(); power = 0;
  } else if (m.t === 'end' && (state === 'rolling' || state === 'await')) applyEnd(m);
}
/** The balls stopped on this screen: the shooter publishes the result; the watcher waits for it. */
function onlineSettled() {
  if (who0() !== 'me') { state = 'await'; return; }
  netSend({ t: 'end', b: balls.map(b => ({ n: b.num, x: +b.x.toFixed(4), z: +b.z.toFixed(4), on: b.on ? 1 : 0 })),
    fh: firstHit, pn: pottedNums, sc: scratched, cb: clearedBefore });
  endShot();
}
function applyEnd(m) {                     // snap to the shooter's result, then run the same rules they did
  if (!Array.isArray(m.b)) return;
  m.b.forEach(e => {
    const b = balls.find(o => o.num === e.n); if (!b || !num(e.x, e.z)) return;
    b.x = e.x; b.z = e.z; b.vx = b.vz = 0; b.sink = null; b.on = !!e.on; b.mesh.scale.setScalar(1);
  });
  firstHit = Number.isInteger(m.fh) ? m.fh : null; pottedNums = Array.isArray(m.pn) ? m.pn.filter(Number.isInteger) : [];
  scratched = !!m.sc; clearedBefore = !!m.cb;
  syncMeshes(0); endShot();
}
function onNetClose() {
  if ($('#menu').style.display === 'flex') { netStatus('netErr'); return; }
  if (mode !== 'online' || netGone) return;
  netGone = true; state = 'won'; dragging = false; placing = false;
  $('#oT').textContent = tr('netLeft'); $('#oP').textContent = tr('netLeftP'); $('#oB').textContent = tr('toMenu');
  $('#ov').style.display = 'flex';
}

/* ---------- main loop ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'aiAim' && ai) runAI(dt);
  if (state === 'rolling') {
    acc += dt; const h = 1 / 240;
    while (acc >= h) { stepPhysics(h); acc -= h; }
    const moving = balls.some(b => b.on && (b.sink || b.vx || b.vz));
    if (!moving) { if (mode === 'online') onlineSettled(); else endShot(); }
  }
  syncMeshes(dt); updateFx(dt);
  camT += ((viewMode === 'top' ? 1 : 0) - camT) * Math.min(1, dt * 6);
  camA += ((viewMode === 'aim' && state === 'aim' ? 1 : 0) - camA) * Math.min(1, dt * 4);
  camAng += normAng(aimAngle() - camAng) * Math.min(1, dt * 9);
  placeCamera();

  // glowing rings under the balls the shooter must hit (only once solids/stripes are known)
  let ri = 0;
  if (state === 'aim' && groups[who0()]) {
    const w = who0(), cl = clearedNow();
    for (const b of balls) if (b !== cueBall && inPlay(b) && allowed(w, b.num, cl) && ri < rings.length) {
      const r = rings[ri++]; r.visible = true; r.position.x = b.x; r.position.z = b.z; r.scale.setScalar(1 + 0.12 * Math.sin(now / 220));
    }
  }
  for (; ri < rings.length; ri++) rings[ri].visible = false;

  const showAim = state === 'aim' || state === 'aiAim';
  cue.visible = showAim; aimLine.visible = ghost.visible = state === 'aim';
  const pulling = dragging || !!slide;
  $('#pow').style.opacity = dragging ? 1 : 0; $('#pow i').style.width = (power * 100) + '%';
  $('#pwr').classList.toggle('on', touchUI && state === 'aim');
  pwrT.classList.toggle('on', !!slide); $('#pwrT i').style.height = (pulling ? power * 100 : 0) + '%';
  if (showAim) {
    const pull = pulling ? power * 2.4 : state === 'aiAim' ? aiPull * 2.4 : 0.1 * Math.sin(now / 350) + 0.1;
    cue.position.set(cueBall.x - aimDir.x * (R + 0.12 + pull), R + 0.02, cueBall.z - aimDir.z * (R + 0.12 + pull));
    cue.rotation.y = Math.atan2(-aimDir.z, aimDir.x);
    const { t, hitBall } = aimTarget();
    const p = lineGeo.attributes.position;
    p.setXYZ(0, cueBall.x, R, cueBall.z); p.setXYZ(1, cueBall.x + aimDir.x * t, R, cueBall.z + aimDir.z * t);
    p.needsUpdate = true;
    ghost.position.set(cueBall.x + aimDir.x * t, R, cueBall.z + aimDir.z * t);
    ghost.material.color.setHex(hitBall ? (allowed(who0(), hitBall.num, clearedNow()) ? 0xffcf3f : 0xff4d5e) : 0xffffff);
  }
  renderer.render(scene, camera);
}

setTouch(touchUI); applyLang(); rack(); placeCamera(); showMenu(); autoJoin();
requestAnimationFrame(frame);
<\/script>
</body>
</html>
</script>

/* ---------- game state ---------- */
let mode = 'menu';                        // menu | solo | online

let viewMode = 'all', cardEnd = 0, cardTimer = null;
let myName = '';

let bests = {};                           // best solo round per course: course id -> strokes
try { bests = JSON.parse(localStorage.getItem(BESTS_KEY) || '{}') || {}; } catch (e) {}
const bestHere = () => +bests[STAGES[stage].id] || 0;

function say(k, v) { $('#msg').textContent = k ? tr(k, v) : ''; $('#msg').classList.remove('mine'); }

function beginHole(h) {

/** Each player tees off from their own spot across the tee mat (x only), so waiting balls never sit on top of each other. */
function teeSpot(id) {

/** Keep one ghost ball + name tag for every other player in the room. */
function syncGhosts() {

  ghosts.forEach((g, id) => { if (!ids.has(id)) { scene.remove(g.mesh); g.tag.remove(); ghosts.delete(id); } });
  ids.forEach(id => {

const myTag = document.createElement('div'); myTag.className = 'tag'; $('#tags').appendChild(myTag);
