/** Overview: the closest camera (same tilt) that shows every corner of the hole inside the space the HUD leaves free. */
function fitHole() {
  const land = innerHeight < 460 && innerWidth > innerHeight;
  const key = stage + ':' + hi + ':' + innerWidth + 'x' + innerHeight + ':' + $('#top').offsetHeight;
  if (fitCache && fitCache.key === key) return fitCache;
  const b = bounds(H), m = 0.5, pts = [[b.x0 - m, b.z0 - m], [b.x1 + m, b.z0 - m], [b.x0 - m, b.z1 + m], [b.x1 + m, b.z1 + m]];
  const vh = Math.max(1, innerHeight), vw = Math.max(1, innerWidth);
  const topY = 1 - 2 * ($('#top').offsetHeight + 14) / vh, botY = -1 + 2 * (land ? 12 : 44) / vh;
  const sideL = -1 + 2 * (land ? 12 : 58) / vw, sideR = 1 - 2 * (land ? 12 : 14) / vw;
  const cx0 = (b.x0 + b.x1) / 2, v = new THREE.Vector3();
  let cx = cx0, cz = (b.z0 + b.z1) / 2, d = 12;
  const proj = (dd, xx, zz) => {
    camera.position.set(xx, dd * Math.sin(PITCH), zz + dd * Math.cos(PITCH)); camera.lookAt(xx, 0, zz); camera.updateMatrixWorld();
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
    for (const [x, z] of pts) for (const y of [0, H.maxY + WALL_H]) { v.set(x, y, z).project(camera); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
    return { x0, x1, y0, y1 };
  };
  for (let pass = 0; pass < 5; pass++) {
    let lo = 3, hi2 = 120;
    for (let k = 0; k < 28; k++) { const mid = (lo + hi2) / 2, r = proj(mid, cx, cz); if (r.x0 >= sideL && r.x1 <= sideR && r.y0 >= botY && r.y1 <= topY) hi2 = mid; else lo = mid; }
    d = hi2;
    const r = proj(d, cx, cz);       // slide the view so the hole sits centred in the free area
    cz += ((topY + botY) / 2 - (r.y0 + r.y1) / 2) * d * 0.35;
    cx -= ((sideL + sideR) / 2 - (r.x0 + r.x1) / 2) * d * 0.3;
  }
  fitCache = { key, x: cx, z: cz, d };
  return fitCache;
}
function camGoal() {
  if (viewMode === 'ball') {
    let x = me.x, z = me.z;
    if (mode === 'online' && turnId !== myId && ghosts.has(turnId)) { const g = ghosts.get(turnId); x = g.x; z = g.z; }   // watch whoever is putting
    return { x, z: z + 0.4, d: 7.5, y: heightAt(x, z) };
  }
  const f = fitHole(); return { x: f.x, z: f.z, d: f.d, y: 0 };
}
function placeCamera(dt) {
  if (!H) { camera.position.set(0, 12, 10); camera.lookAt(0, 0, 0); return; }
  const g = camGoal(), k = snapCam ? 1 : Math.min(1, dt * 3);
  snapCam = false;
  cam.x += (g.x - cam.x) * k; cam.z += (g.z - cam.z) * k; cam.d += (g.d - cam.d) * k; cam.y += (g.y - cam.y) * k;
  camera.position.set(cam.x, cam.y + cam.d * Math.sin(PITCH), cam.z + cam.d * Math.cos(PITCH));
  camera.lookAt(cam.x, cam.y, cam.z);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / Math.max(1, innerHeight); camera.updateProjectionMatrix();
  hud(); snapCam = true;
}
addEventListener('resize', resize);

/* ---------- main loop ---------- */
const STEP = 1 / 240, tmpV = new THREE.Vector3();
let last = performance.now(), acc = 0;
function toScreen(x, z) {
  tmpV.set(x, (H ? heightAt(x, z) : 0) + R * 2 + 0.25, z).project(camera);
  if (tmpV.z > 1) return null;
  return { x: (tmpV.x + 1) / 2 * innerWidth, y: (1 - tmpV.y) / 2 * innerHeight };
}
/** Name tag above a ball; every other player's tag sits a row higher so neighbours on the tee don't overlap. */
function placeTag(el, x, z, id) {
  const p = toScreen(x, z);
  if (!p) { el.style.display = 'none'; return; }
  el.style.display = '';
  const k = players.map(q => q.id).sort((a, b) => a - b).indexOf(id), lift = k % 2 ? 18 : 0;
  el.style.transform = `translate(${p.x}px,${p.y - lift}px) translate(-50%,-100%)`;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (H && phase === 'play') {
    acc += dt;
    while (acc >= STEP) {
      acc -= STEP; obsT += STEP;
      if (me.state === 'roll') { const ev = stepBall(STEP); if (ev) { ballEvent(ev); } }
    }
    if (me.state === 'roll') sendPos(false);
  } else obsT += dt;

  // own ball: follows the ground, but drops (with gravity) when it rolls off a ledge or an open edge
  if (me.mesh && H) {
    if (me.state === 'sink') { me.sinkT += dt; me.x += (H.cup[0] - me.x) * Math.min(1, dt * 14); me.z += (H.cup[1] - me.z) * Math.min(1, dt * 14); }
    const gy = heightAt(me.x, me.z) + R;
    if (me.y > gy + 0.01) { me.vy -= 16 * dt; me.y += me.vy * dt; if (me.y <= gy) { if (me.vy < -1.5) sThud(-me.vy); me.y = gy; me.vy = 0; } }
    else { me.y = gy; me.vy = 0; }
    const sink = me.state === 'sink' || (me.state === 'done' && me.sinkT > 0);
    me.mesh.position.set(me.x, sink ? me.y - Math.min(0.4, me.sinkT * 1.4) : me.y, me.z);
    me.mesh.visible = !(sink && me.sinkT > 0.35) && mode !== 'menu';
    me.mesh.rotation.set(me.roll * 0.7, 0, me.roll * 0.3);
  }
  ghosts.forEach((g, id) => {
    const k = Math.min(1, dt * 12);
    if (Math.hypot(g.tx - g.x, g.tz - g.z) > 2) { g.x = g.tx; g.z = g.tz; }   // teleported: jump, don't slide across the course
    g.x += (g.tx - g.x) * k; g.z += (g.tz - g.z) * k;
    g.mesh.position.set(g.x, (H ? heightAt(g.x, g.z) : 0) + R, g.z);
    g.mesh.visible = phase === 'play' && !g.done;
    g.tag.classList.toggle('turn', id === turnId);
    if (g.mesh.visible) placeTag(g.tag, g.x, g.z, id); else g.tag.style.display = 'none';
  });
  myTag.classList.toggle('turn', turnId === myId);
  if (mode === 'online' && me.mesh && me.mesh.visible && phase === 'play') placeTag(myTag, me.x, me.z, myId); else myTag.style.display = 'none';
  // ring under the ball whose turn it is
  const tb = mode === 'online' && phase === 'play' ? (turnId === myId ? (finished() ? null : me) : ghosts.get(turnId)) : null;
  turnRing.visible = !!(tb && (tb === me || !tb.done));
  if (turnRing.visible) { turnRing.position.set(tb.x, heightAt(tb.x, tb.z) + 0.012, tb.z); turnRing.scale.setScalar(1 + 0.15 * Math.sin(now / 180)); }
  if (flag) flag.children[1].rotation.y = Math.sin(now / 400) * 0.25;
  for (const s of slopeMarks) {                    // chevrons drift downhill
    const t = (now / 1000 * 0.4) % 1;
    s.o.position.x = s.x + s.dx * (t - 0.5) * 0.9; s.o.position.z = s.z + s.dz * (t - 0.5) * 0.9;
    s.o.material.opacity = 0.25 + 0.5 * Math.sin(t * Math.PI);
  }
  animateHole(now);
  updateWeather(dt, now);

  // aim arrow
  const aiming = !!drag && me.state === 'aim' && aim.p > 0.02;
  arrow.visible = aiming;
  $('#pow').style.opacity = aiming ? 1 : 0; $('#pow i').style.width = (aim.p * 100) + '%';
  if (aiming) {
    const len = 0.35 + aim.p * 2.6;
    arrow.position.set(me.x, me.y - R + 0.03, me.z); arrow.rotation.y = Math.atan2(-aim.z, aim.x);
    shaft.scale.x = len; shaft.position.x = R + len / 2; tip.position.x = R + len + 0.12;
    arrowM.color.setHSL(0.33 - aim.p * 0.33, 0.85, 0.6);
  }

  turnMsg(now);
  if (phase === 'card' && cardEnd) $('#oP').textContent = tr('after', hi + 1) + ' · ' + tr('nextIn', Math.max(0, Math.ceil((cardEnd - now) / 1000)));
  updateEmotes(now);

  placeCamera(dt);
  renderer.render(scene, camera);
}

// host referee timers run on setInterval, so they keep going when the host's tab is in the background
setInterval(() => { if (isHost && mode === 'online') hostTick(performance.now()); }, 250);
setStage(Math.random() * STAGES.length | 0); buildHole(0); resize(); applyLang(); showMenu(); autoJoin();
requestAnimationFrame(frame);
<\/script>

/* ---------- 1. Utilities ------------------------------------------- */
class Rng {
  static int(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min }
  static chance(p){ return Math.random() < p }
  static pick(list){ return list[Math.floor(Math.random() * list.length)] }
  static weighted(items, weightOf){
    let roll = Math.random() * items.reduce((s, i) => s + weightOf(i), 0);
    for (const item of items){ roll -= weightOf(item); if (roll < 0) return item }
    return items[items.length - 1];
  }
  static shuffle(list){
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] }
    return a;
  }
  /** Deterministic 0..1 noise, used for decorative placement that must not change between renders. */
  static noise(a, b){ const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x) }
}

class Fmt {
  static num(n){ return Math.round(n).toLocaleString(I18n.locale()) }

  /** Renders a stored message: a {k, v} object (translated now) or a legacy plain string. */
  static msg(m){ return !m ? '' : typeof m === 'string' ? m : I18n.t(m.k, m.v) }
  static locale(){ return I18n.lang === 'es' ? 'es-ES' : 'en-US' }
  static set(lang){
    I18n.lang = I18n.LANGS.includes(lang) ? lang : 'en';
    document.documentElement.lang = I18n.lang;
  }
  /** Fills static markup: data-i18n (text/HTML), data-i18n-ph (placeholder), data-i18n-aria (aria-label). */
  static apply(root = document){
    root.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = I18n.t(el.dataset.i18n) });
    root.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = I18n.t(el.dataset.i18nPh) });
    root.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', I18n.t(el.dataset.i18nAria)) });
  }
}
const t = (key, vars) => I18n.t(key, vars);

/* ---------- 3. Services ------------------------------------------- */
/** Namespaced localStorage with an in-memory fallback when storage is blocked. */
class SaveStore {
  constructor(prefix = 'arcadehub:v1:'){
    this.prefix = prefix;
    this.memory = {};
    this.persistent = this.probe();
  }
  probe(){
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true } catch { return false }
  }
  read(key){ return this.persistent ? localStorage.getItem(key) : (this.memory[key] ?? null) }
  write(key, value){ this.persistent ? localStorage.setItem(key, value) : (this.memory[key] = value) }
  remove(key){ this.persistent ? localStorage.removeItem(key) : delete this.memory[key] }
  keys(){ return Object.keys(this.persistent ? localStorage : this.memory) }

  /** Ids starting with "_" are hub internals (settings) and hidden from the UI. */
  ids(){ return this.keys().filter(k => k.startsWith(this.prefix)).map(k => k.slice(this.prefix.length)).filter(id => !id.startsWith('_')) }
  load(id, fallback = null){
    try { const v = this.read(this.prefix + id); return v ? JSON.parse(v).data : fallback } catch { return fallback }
  }
  save(id, data){
    try { this.write(this.prefix + id, JSON.stringify({ data, updated: Date.now() })); return true }
    catch { Toast.show(t('saves.full')); return false }
  }
  clear(id){ this.remove(this.prefix + id) }
  clearAll(){ this.ids().forEach(id => this.clear(id)) }
  info(id){
    try { const v = this.read(this.prefix + id); return v ? { bytes: v.length, updated: JSON.parse(v).updated } : null } catch { return null }
  }
  /** Exports hub saves plus the listed un-prefixed keys (embedded games) under "__raw__". */
  exportAll(rawKeys = []){
    const out = Object.fromEntries(this.ids().map(id => [id, JSON.parse(this.read(this.prefix + id))]));
    const raw = Object.fromEntries(rawKeys.map(k => [k, this.rawGet(k)]).filter(([, v]) => v !== null));
    if (Object.keys(raw).length) out.__raw__ = raw;
    return out;
  }
  /** Imports hub saves; raw keys are only written if they belong to a known embedded game. */
  importAll(obj, rawKeys = []){
    Object.entries(obj).forEach(([id, v]) => {
      if (id === '__raw__') Object.entries(v || {}).forEach(([k, val]) => { if (rawKeys.includes(k)) this.write(k, String(val)) });
      else if (v && 'data' in v) this.write(this.prefix + id, JSON.stringify(v));
    });
  }
  slot(id){ return new GameSlot(this, id) }
  /* Un-prefixed keys owned by embedded games, which manage their own storage. */
  rawGet(key){ try { return this.read(key) } catch { return null } }
  rawRemove(key){ try { this.remove(key) } catch {} }
}

/** What a game receives: load / save / clear for its own slot only. */
class GameSlot {
  constructor(store, id){ this.store = store; this.id = id }
  load(fallback = null){ return this.store.load(this.id, fallback) }
  save(data){ return this.store.save(this.id, data) }
  clear(){ this.store.clear(this.id) }
}

/** Hub preferences (theme, language) kept together in one hidden slot. */
class Settings {
  constructor(store){ this.slot = store.slot('_settings') }
  get(key){ return this.slot.load({})[key] }
  set(key, value){ this.slot.save({ ...this.slot.load({}), [key]: value }) }
}

class Toast {
  static show(message){
    const el = document.getElementById('toast');
    el.textContent = message; el.classList.add('show');
    clearTimeout(Toast.timer); Toast.timer = setTimeout(() => el.classList.remove('show'), 2200);
  }
}

class ThemeToggle {
  constructor(settings, button){
    this.settings = settings;
    this.root = document.documentElement;
    this.root.dataset.theme = settings.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    button.addEventListener('click', () => this.toggle());
  }
  toggle(){
    this.root.dataset.theme = this.root.dataset.theme === 'dark' ? 'light' : 'dark';
    this.settings.set('theme', this.root.dataset.theme);
  }
}

/** Switches English ⇄ Spanish. Defaults to the browser language on first visit. */
class LanguageToggle {
  constructor(settings, button, label, onChange){
    this.settings = settings; this.label = label; this.onChange = onChange;
    I18n.set(settings.get('lang') || (navigator.language || 'en').slice(0, 2));
    this.update();
    button.addEventListener('click', () => this.toggle());
  }
  toggle(){
    I18n.set(I18n.lang === 'en' ? 'es' : 'en');
    this.settings.set('lang', I18n.lang);
    this.update();
    this.onChange();
  }
  update(){ this.label.textContent = I18n.lang.toUpperCase(); I18n.apply() }
}

/* ---------- 4. Engine --------------------------------------------- */
/** Base class: owns a container, one click listener, and a save slot. */
class Game {
  constructor(root, slot){ this.root = root; this.slot = slot; this.handler = e => this.onClick(e) }
  mount(){ this.root.addEventListener('click', this.handler); this.render() }
  destroy(){ this.root.removeEventListener('click', this.handler); this.root.innerHTML = '' }
  onClick(e){
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled) this.act(el.dataset.act, el.dataset);
  }
  render(){}
  act(){}
  /* ---- save-data hooks used by the hub (menu cards, save dialog, reset, export) ---- */
  static savesData(){ return true }
  static hasSave(store, id){ return !!store.info(id) }
  static saveBytes(store, id){ return store.info(id)?.bytes || 0 }
  static clearSave(store, id){ store.clear(id) }
  static rawKeys(){ return [] }
  static embedded(){ return false }
  static summary(store, id){ return '' }
  static thumb(){ return '' }
}

/**
 * Balatro-style structure shared by every game here:
 *   run  -> rounds with a goal -> pick 1 of 3 upgrades -> ... -> a failed round ends the run
 *   meta -> stars earned per run, spent on permanent perks (survives between runs)
 * Subclasses supply rules, art and the play screen; this class supplies the
 * themed shell (title, HUD, upgrade cards, banners) and the saving.
 * Text is never stored translated: saved messages are {k, v} pairs rendered with I18n.msg().
 */
class RunGame extends Game {
  constructor(root, slot){ super(root, slot); this.data = this.loadData(); this.fx = null }

  /* ---- override in subclasses ---- */
  get key(){ return '' }                // string prefix in I18n: sc / dp / dg
  get theme(){ return '' }              // CSS theme: .g-<theme>
  get palette(){ return ['#5b8cff', '#ff4f8b', '#ffb627', '#34c46a'] }  // upgrade card colours
  logoHtml(){ return '' }
  perkDefs(){ return [] }               // [{id,icon,max,base,step}]  cost = base + step * level
  upgradeDefs(){ return [] }            // [{id,icon,max}]
  defaults(){ return { meta: { stars: 0, best: 0, runs: 0, perks: {} }, run: null } }
  newRun(){ return {} }                 // extra fields for a fresh run
  startRound(run){}                     // reset per-round fields
  goal(run){ return 0 }
  roundValue(run){ return 0 }           // progress toward goal
  hudStats(run){ return [] }            // [{icon, label, value}]
  extraBadges(meta){ return '' }
  viewPlay(run){ return '' }
  playAct(name, data, run){}
  afterRender(){}                       // hook for canvas / scroll work after the DOM is replaced
  roundWon(run){ return null }          // reward on clear, returns a {k, v} message
  resultNote(run){ return '' }
  starsFor(run){ return Math.max(0, run.round - 1) }

  /* ---- text ---- */
  tr(key, vars){ return t(`${this.key}.${key}`, vars) }
  localize(kind, list){
    return list.map(x => ({ ...x, name: this.tr(`${kind}.${x.id}.name`), desc: this.tr(`${kind}.${x.id}.desc`) }));
  }
  perks(){ return this.localize('perk', this.perkDefs()) }
  upgrades(){ return this.localize('up', this.upgradeDefs()) }

  /* ---- state ---- */
  loadData(){
    const def = this.defaults(), saved = this.slot.load(null) || {};
    return { ...def, ...saved, meta: { ...def.meta, ...saved.meta, perks: { ...saved.meta?.perks } } };
  }
  save(){ this.slot.save(this.data) }
  commit(){ this.save(); this.render() }
  perkLevel(id){ return this.data.meta.perks[id] || 0 }
  level(id){ return this.data.run?.upgrades[id] || 0 }
  upgradeDef(id){ return this.upgrades().find(u => u.id === id) }

  /* ---- lifecycle ---- */
  startRun(){
    const run = { round: 1, phase: 'play', upgrades: {}, ...this.newRun() };
    this.data.run = run;
    this.data.meta.runs++;
    this.startRound(run);
    this.commit();
  }
  finishRound(){
    const run = this.data.run;
    run.won = this.roundValue(run) >= this.goal(run);
    run.bonus = run.won ? this.roundWon(run) : null;
    run.phase = 'result';
    this.commit();
  }
  afterResult(){
    const run = this.data.run;
    if (!run.won) return this.endRun();
    const pool = this.upgradeDefs().filter(u => this.level(u.id) < (u.max || 5));
    run.offer = Rng.shuffle(pool).slice(0, 3).map(u => u.id);
    if (!run.offer.length) return this.nextRound();
    run.phase = 'upgrade';
    this.commit();
  }
  pickUpgrade(id){
    const run = this.data.run;
    if (!run.offer?.includes(id)) return;
    run.upgrades[id] = this.level(id) + 1;
    this.nextRound();
  }
  nextRound(){
    const run = this.data.run;
    run.round++; run.offer = null; run.phase = 'play';
    this.startRound(run);
    this.commit();
  }
  endRun(){
    const run = this.data.run, meta = this.data.meta;
    run.cleared = run.round - 1;
    run.earned = this.starsFor(run);
    run.newBest = run.cleared > meta.best;
    meta.stars += run.earned;
    meta.best = Math.max(meta.best, run.cleared);
    run.phase = 'over';
    this.commit();
  }
  buyPerk(id){
    const perk = this.perkDefs().find(p => p.id === id), lvl = this.perkLevel(id);
    if (!perk || lvl >= perk.max) return;
    const cost = perk.base + perk.step * lvl;
    if (this.data.meta.stars < cost) return Toast.show(t('shell.noStars'));
    this.data.meta.stars -= cost;
    this.data.meta.perks[id] = lvl + 1;
    this.commit();
  }

  /* ---- input ---- */
  act(name, d){
    this.fx = null;
    switch (name){
      case 'start':    return this.startRun();
      case 'buy-perk': return this.buyPerk(d.id);
      case 'pick':     return this.pickUpgrade(d.id);
      case 'continue': return this.afterResult();
      case 'title':    this.data.run = null; return this.commit();
      case 'abandon':  return confirm(t('shell.confirmQuit')) && this.endRun();
    }
    const run = this.data.run;
    if (run?.phase === 'play') this.playAct(name, d, run);
  }

  /* ---- views ---- */
  render(){
    const run = this.data.run;
    let html;
    if (!run) html = this.viewTitle();
    else if (run.phase === 'play') html = this.viewHud(run) + this.viewPlay(run);
    else if (run.phase === 'result') html = this.viewHud(run) + this.viewResult(run);
    else if (run.phase === 'upgrade') html = this.viewHud(run) + this.viewUpgrade(run);
    else html = this.viewOver(run);
    this.root.innerHTML = `<div class="g g-${this.theme}">${html}</div>`;
    this.afterRender();
  }
  badge(icon, label, value){ return `<div class="g-badge">${icon}<span>${label}</span><b>${value}</b></div>` }
  dots(max, filled, next = -1){
    return `<div class="g-dots">${Array.from({ length: max }, (_, i) => `<i class="${i < filled ? 'on' : i === next ? 'next' : ''}"></i>`).join('')}</div>`;
  }
  viewTitle(){
    const m = this.data.meta;
    const perks = this.perks().map(p => {
      const lvl = this.perkLevel(p.id), maxed = lvl >= p.max, cost = p.base + p.step * lvl;
      return `<div class="g-perk"><span class="ico">${p.icon}</span><div><b>${p.name}</b>${this.dots(p.max, lvl)}</div><p>${p.desc}</p>
        <button class="g-btn sm ${maxed ? 'alt' : ''}" data-act="buy-perk" data-id="${p.id}" ${maxed || m.stars < cost ? 'disabled' : ''}>
          ${maxed ? t('shell.maxed') : `${Art.icon('star')} ${t('shell.buy', { cost })}`}</button></div>`;
    }).join('');
    return `<div class="g-title">
      ${this.logoHtml()}
      <p class="g-tag">${this.tr('blurb')}</p>
      <button class="g-btn big" data-act="start">${t('shell.start')}</button>
      <div class="g-badges">
        ${this.badge(Art.icon('star'), t('shell.stars'), m.stars)}
        ${this.badge(Art.icon('flag'), t('shell.best'), m.best)}
        ${this.badge(Art.icon('runs'), t('shell.runs'), m.runs)}
        ${this.extraBadges(m)}
      </div>
      <div class="g-shop"><h3>${Art.icon('star')} ${t('shell.shop')} <span>${t('shell.shopHint')}</span></h3><div class="g-perks">${perks}</div></div>
    </div>`;
  }
  viewHud(run){
    const value = this.roundValue(run), goal = this.goal(run);
    const res = this.hudStats(run).map(s => `<div class="g-res">${s.icon}<div><small>${s.label}</small>${s.value}</div></div>`).join('');
    const relics = Object.entries(run.upgrades).filter(([, n]) => n > 0).map(([id, n]) => {
      const u = this.upgradeDef(id);
      return `<span class="g-relic" title="${u.name} (${t('shell.level', { n })}): ${u.desc}">${u.icon}<b>${n}</b></span>`;
    }).join('');
    return `<div class="g-hud">
        <div class="g-round"><small>${t('shell.round')}</small><b>${run.round}</b></div>
        <div class="g-meter"><div class="g-meter-top"><span>${this.tr('goal')}</span><span><b>${Fmt.num(value)}</b> / ${Fmt.num(goal)}</span></div>
          <div class="g-track ${value >= goal ? 'done' : ''}"><i style="width:${Math.min(100, value / goal * 100)}%"></i></div></div>
        ${res}
        ${run.phase === 'play' ? `<button class="g-btn sm alt" data-act="abandon">${t('shell.quit')}</button>` : ''}
      </div>${relics ? `<div class="g-relics">${relics}</div>` : ''}`;
  }
  viewResult(run){
    const value = this.roundValue(run), goal = this.goal(run);
    const notes = [I18n.msg(run.bonus), this.resultNote(run)].filter(Boolean).join(' · ');
    return `<div class="g-banner">
      <div class="g-stamp ${run.won ? 'ok' : 'bad'}">${run.won ? t('shell.clear') : t('shell.fail')}</div>
      <div class="g-big">${Fmt.num(value)} <span>/ ${Fmt.num(goal)}</span></div>
      <div class="g-muted">${notes}</div>
      <button class="g-btn big" data-act="continue">${run.won ? t('shell.chooseBoon') : t('shell.seeResults')}</button></div>`;
  }
  viewUpgrade(run){
    const all = this.upgradeDefs(), pal = this.palette;
    const cards = run.offer.map((id, k) => {
      const u = this.upgradeDef(id), n = this.level(id), color = pal[all.findIndex(x => x.id === id) % pal.length];
      return `<button class="g-card" data-act="pick" data-id="${id}" style="--c:${color};--i:${k}">
        <div class="g-card-art"><span>${u.icon}</span></div>
        <div class="g-card-body"><b>${u.name}</b><p>${u.desc}</p>${this.dots(u.max || 5, n, n)}</div></button>`;
    }).join('');
    return `<div class="g-pick"><div class="g-stamp neutral">${t('shell.boonTitle')}</div>
      <p class="g-muted">${t('shell.boonHint')}</p><div class="g-cards">${cards}</div></div>`;
  }
  viewOver(run){
    return `<div class="g-banner">
      <div class="g-stamp bad">${t('shell.over')}</div>
      <svg class="g-bigstar" viewBox="0 0 32 32">${Art.ICONS.star}</svg>
      <div class="g-big">+${run.earned} <span>${t('shell.starsEarned')}</span></div>
      <div class="g-badges">${this.badge(Art.icon('flag'), t('shell.cleared'), run.cleared)}</div>
      ${run.newBest ? `<div class="g-newbest">${t('shell.newBest')}</div>` : ''}
      <div class="g-row"><button class="g-btn big" data-act="start">${t('shell.newRun')}</button><button class="g-btn alt big" data-act="title">${t('shell.shop')}</button></div></div>`;
  }

  static summary(store, id){
    const data = store.load(id);
    return data?.meta ? t('hub.summary', { best: data.meta.best, stars: data.meta.stars }) : '';
  }
}

/**
 * Incremental scratch-ticket game with one currency: coins. Buy a ticket, scratch it by hand, win coins,
 * and spend them on everything else - a better scraper, luck, prize boosts, new ticket types, an
 * auto-scratcher and an auto-buyer - until you can afford the Golden Crown, which is the goal.
 * Each ticket type has its own rule (match symbols, winning numbers, 3x3 lines) and rare jackpots,
 * so single tickets swing a lot while the average return (shown in the booth) climbs with upgrades.

class ScratchLotto extends Game {
  static GOAL = 1000000;
  static START = 50;
  static SAVE_VERSION = 2;
  /**
   * Ticket types, in unlock order. syms: [id, weight, prize] with the prize as a multiple of the ticket price;
   * x2/x3/x5 spots multiply a winning ticket and jokers are wild. numbers: `wins` winning numbers drawn from
   * 1..pool, `n` of your numbers each hiding a prize [multiple, weight].
   */
  static TICKETS = [
    { id: 'pocket', cost: 5, unlock: 0, rule: 'match', n: 6, need: 3, cols: 3, col: ['#d4823b', '#8a4f1c'],
      syms: [['cherry', 22, 0.6], ['lemon', 19, 1], ['bell', 16, 2], ['clover', 11, 3.7], ['gem', 5, 13], ['seven', 1.5, 95]] },
    { id: 'rush', cost: 25, unlock: 150, rule: 'numbers', n: 8, wins: 2, pool: 30, cols: 4, col: ['#2f9e8f', '#145c52'],
      prizes: [[0.5, 30], [0.7, 24], [1.4, 16], [3.6, 8], [7, 4], [36, 0.8], [360, 0.08]] },
    { id: 'lines', cost: 150, unlock: 1000, rule: 'lines', n: 9, cols: 3, col: ['#7f95ad', '#40516a'],
      syms: [['cherry', 24, 0.9], ['lemon', 21, 1.7], ['bell', 17, 3.7], ['clover', 12, 8.6], ['gem', 5, 37], ['seven', 1.5, 220], ['x2', 3, 0]] },
    { id: 'vault', cost: 1000, unlock: 8000, rule: 'match', n: 9, need: 4, cols: 3, col: ['#3fa7d6', '#1a5f86'],
      syms: [['cherry', 22, 0.4], ['lemon', 20, 0.8], ['bell', 16, 1.6], ['clover', 12, 3.2], ['gem', 7, 10], ['seven', 2, 63], ['joker', 2, 0], ['x2', 3, 0], ['x3', 1, 0]] },
    { id: 'royal', cost: 6000, unlock: 60000, rule: 'lines', n: 9, cols: 3, col: ['#f0b429', '#8f6200'],
      syms: [['cherry', 22, 0.5], ['lemon', 19, 1], ['bell', 16, 2], ['clover', 12, 4.7], ['gem', 6, 18], ['seven', 1.6, 130], ['joker', 2, 0], ['x2', 3, 0], ['x5', 0.7, 0]] },
  ];
  static LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  static MULTS = { x2: 2, x3: 3, x5: 5 };
  /** Scraper tiers: brush = stroke width on the 120px foil, reveal = share of foil to clear before a spot counts. */
  static TOOLS = [
    { id: 'nail',    icon: '💅', brush: 16, reveal: 0.55 },
    { id: 'coin',    icon: '🪙', brush: 22, reveal: 0.48 },
    { id: 'lucky',   icon: '🏅', brush: 28, reveal: 0.42 },
    { id: 'golden',  icon: '✨', brush: 36, reveal: 0.36 },
    { id: 'diamond', icon: '💎', brush: 48, reveal: 0.3 },
  ];
  static TOOL_COST = [15, 80, 400, 2500];
  /** Everything for sale. cost(level) is the price of the next level. */
  static SHOP = [
    { id: 'tool',    icon: '🪙', max: 4,  cost: l => ScratchLotto.TOOL_COST[l] },
    { id: 'luck',    icon: '🍀', max: 10, cost: l => Math.round(25 * 2.3 ** l) },
    { id: 'auto',    icon: '🤖', max: 10, cost: l => Math.round(60 * 2.4 ** l) },
    { id: 'prize',   icon: '💰', max: 20, cost: l => Math.round(20 * 1.9 ** l) },
    { id: 'autobuy', icon: '🔁', max: 1,  cost: () => 500 },
  ];
  static autoInterval(l){ return 2.2 * 0.78 ** (l - 1) }          // seconds per spot the auto-scratcher clears
  static prizeMult(l){ return 1 + 0.25 * l }   // one Prize boost for every ticket, so pricier tickets always pay more

  get key(){ return 'sc' }
  tr(key, vars){ return t(`sc.${key}`, vars) }
  static thumb(){
    return `<div class="th th-scratch"><div class="th-ticket">${Art.symbol('seven')}${Art.symbol('seven')}${Art.symbol('seven')}</div></div>`;
  }
  static summary(store, id){
    const d = store.load(id);
    if (!d || d.v !== ScratchLotto.SAVE_VERSION) return '';
    return d.crown ? t('sc.summaryCrown', { n: Fmt.num(d.coins) }) : t('sc.summary', { n: Fmt.num(d.coins) });
  }

  /* ---- state ---- */
  constructor(root, slot){ super(root, slot); this.data = this.loadData(); this.fx = null }
  defaults(){
    return { v: ScratchLotto.SAVE_VERSION, coins: ScratchLotto.START, earned: 0, scratched: 0, biggest: 0,
      lv: {}, unlocked: { pocket: true }, autobuy: false, crown: false, sel: 'pocket', ticket: null };
  }
  loadData(){
    const saved = this.slot.load(null);   // saves from the old round-based version start fresh
    return saved && saved.v === ScratchLotto.SAVE_VERSION ? { ...this.defaults(), ...saved } : this.defaults();
  }
  save(){ this.slot.save(this.data) }
  commit(){ this.save(); this.render() }
  lv(id){ return this.data.lv[id] || 0 }
  ticketType(id){ return ScratchLotto.TICKETS.find(x => x.id === id) }
  tool(){ return ScratchLotto.TOOLS[this.lv('tool')] }
  cheapest(){ return Math.min(...ScratchLotto.TICKETS.filter(T => this.data.unlocked[T.id]).map(T => T.cost)) }

  /* ---- pure rules (also used by the return estimate) ---- */
  static symWeight(s, luck){ return s[1] * (s[2] >= 3 || s[0] === 'joker' || s[0] in ScratchLotto.MULTS ? 1 + 0.06 * luck : 1) }
  static draw(T, luck){
    if (T.rule === 'numbers'){
      const wins = Rng.shuffle(Array.from({ length: T.pool }, (_, i) => i + 1)).slice(0, T.wins);
      const pw = p => p[1] * (p[0] >= 5 ? 1 + 0.06 * luck : 1);
      const mine = Array.from({ length: T.n }, () => {
        let num = Rng.int(1, T.pool);
        if (Rng.chance(0.003 * luck)) num = Rng.pick(wins);   // luck: a nudge toward the winning numbers
        return { num, p: Rng.weighted(T.prizes, pw)[0] };
      });
      return { wins, mine };
    }
    return { cells: Array.from({ length: T.n }, () => Rng.weighted(T.syms, s => ScratchLotto.symWeight(s, luck))[0]) };
  }
  /** Returns { mult: total prize as a multiple of the ticket price, hit: indexes of winning spots }. */
  static evaluate(T, tk){
    if (T.rule === 'numbers'){
      let mult = 0; const hit = [];
      tk.mine.forEach((m, i) => { if (tk.wins.includes(m.num)){ mult += m.p; hit.push(T.wins + i) } });
      if (hit.length) tk.wins.forEach((w, i) => { if (tk.mine.some(m => m.num === w)) hit.push(i) });
      return { mult, hit };
    }
    const cells = tk.cells, prize = id => (T.syms.find(s => s[0] === id) || [0, 0, 0])[2];
    const mults = cells.reduce((m, c) => m * (ScratchLotto.MULTS[c] || 1), 1);
    let base = 0, hit = new Set();
    if (T.rule === 'match'){
      const counts = {}; let wild = 0;
      cells.forEach(c => { if (c === 'joker') wild++; else if (!(c in ScratchLotto.MULTS)) counts[c] = (counts[c] || 0) + 1 });
      const score = target => {
        let total = 0; const wins = [];
        for (const s of T.syms){
          if (!s[2]) continue;
          const n = (counts[s[0]] || 0) + (s[0] === target ? wild : 0);
          if (n >= T.need){ total += s[2] * (n - T.need + 1); wins.push(s[0]) }
        }
        return { total, wins };
      };
      let best = score(null);
      if (wild) for (const s of T.syms){ const r = score(s[0]); if (r.total > best.total) best = r }
      base = best.total;
      cells.forEach((c, i) => { if (best.wins.includes(c) || (c === 'joker' && best.total)) hit.add(i) });
    } else {
      const top = T.syms.filter(s => s[2]).reduce((a, s) => s[2] > a[2] ? s : a);
      for (const line of ScratchLotto.LINES){
        const ids = line.map(i => cells[i]);
        if (ids.some(c => c in ScratchLotto.MULTS)) continue;
        const real = [...new Set(ids.filter(c => c !== 'joker'))];
        if (real.length > 1) continue;
        base += real.length ? prize(real[0]) : top[2];
        line.forEach(i => hit.add(i));
      }
    }
    if (base) cells.forEach((c, i) => { if (c in ScratchLotto.MULTS) hit.add(i) });
    return { mult: base * mults, hit: [...hit] };
  }
  /** Estimated odds for a ticket type (cached per luck level): win chance, mean payout multiple, and how often each symbol is part of a win. */
  static stats(T, luck){
    const key = `${T.id}|${luck}`;
    ScratchLotto._st = ScratchLotto._st || new Map();
    if (!ScratchLotto._st.has(key)){
      const N = 12000, hit = {}; let sum = 0, wins = 0;
      for (let i = 0; i < N; i++){
        const tk = ScratchLotto.draw(T, luck), r = ScratchLotto.evaluate(T, tk);
        sum += r.mult; if (r.mult > 0) wins++;
        if (tk.cells) new Set(r.hit.map(j => tk.cells[j])).forEach(id => { hit[id] = (hit[id] || 0) + 1 });
      }
      ScratchLotto._st.set(key, { win: wins / N, ret: sum / N, hit: Object.fromEntries(Object.entries(hit).map(([k, v]) => [k, v / N])) });
    }
    return ScratchLotto._st.get(key);
  }
  static avgReturn(T, luck, prizeLv){ return ScratchLotto.stats(T, luck).ret * ScratchLotto.prizeMult(prizeLv) }
  /** Exact chance that a single spot shows each symbol (or prize, on number tickets), from the same weights the draw uses. */
  static spotOdds(T, luck){
    if (T.rule === 'numbers'){
      const pw = p => p[1] * (p[0] >= 5 ? 1 + 0.06 * luck : 1), tot = T.prizes.reduce((a, p) => a + pw(p), 0);
      return T.prizes.map(p => ({ p: pw(p) / tot }));
    }
    const tot = T.syms.reduce((a, x) => a + ScratchLotto.symWeight(x, luck), 0);
    return T.syms.map(x => ({ id: x[0], p: ScratchLotto.symWeight(x, luck) / tot }));
  }
  /** Chance one of your numbers is a winning number (number tickets). */
  static numberOdds(T, luck){ const b = T.wins / T.pool; return b + 0.003 * luck * (1 - b) }
  spotCount(T){ return T.rule === 'numbers' ? T.wins + T.n : T.n }

  /* ---- actions ---- */
  act(name, d){
    this.fx = null;
    const D = this.data;
    switch (name){
      case 'buy':       return this.buy(d.tier);
      case 'unlock':    return this.unlock(d.tier);
      case 'up':        return this.buyUpgrade(d.id);
      case 'crown':     return this.buyCrown();
      case 'autobuy':   D.autobuy = !D.autobuy; return this.commit();
      case 'change':    D.coins += 1; this.fx = 'change'; return this.commit();
      case 'reset':     if (confirm(this.tr('confirmReset'))){ this.data = this.defaults(); this.commit() } return;
    }
  }
  pay(cost){ if (this.data.coins < cost){ Toast.show(this.tr('noCoins')); return false } this.data.coins -= cost; return true }
  buy(id){
    const T = this.ticketType(id), D = this.data;
    if (!T || !D.unlocked[id] || (D.ticket && D.ticket.paid === null) || !this.pay(T.cost)) return;
    D.sel = id;
    D.ticket = { tier: id, paid: null, hit: [], rev: Array(this.spotCount(T)).fill(false), serial: String(Rng.int(0, 999999)).padStart(6, '0'),
      ...ScratchLotto.draw(T, this.lv('luck')) };
    this.settledAt = 0;
    this.commit();
  }
  unlock(id){
    const T = this.ticketType(id);
    if (!T || this.data.unlocked[id] || !this.pay(T.unlock)) return;
    this.data.unlocked[id] = true; this.data.sel = id;
    this.commit();
  }
  buyUpgrade(id){
    const u = ScratchLotto.SHOP.find(x => x.id === id), l = this.lv(id);
    if (!u || l >= u.max || !this.pay(u.cost(l))) return;
    this.data.lv[id] = l + 1;
    if (id === 'autobuy') this.data.autobuy = true;
    this.commit();
  }
  buyCrown(){
    if (this.data.crown || !this.pay(ScratchLotto.GOAL)) return;
    this.data.crown = true; this.fx = 'crown';
    this.commit();
  }
  /** Reveals spots. Partial reveals patch the DOM so half-scratched foils survive. */
  reveal(indexes){
    const tk = this.data.ticket;
    if (!tk || tk.paid !== null) return;
    indexes.forEach(i => { tk.rev[i] = true });
    if (tk.rev.every(Boolean)){ this.settle(); return this.commit() }
    this.save();
    indexes.forEach(i => this.root.querySelector(`.spot[data-i="${i}"]`)?.classList.add('open'));
  }
  settle(){
    const D = this.data, tk = D.ticket, T = this.ticketType(tk.tier);
    const r = ScratchLotto.evaluate(T, tk);
    tk.paid = Math.round(r.mult * T.cost * ScratchLotto.prizeMult(this.lv('prize')));
    tk.hit = r.hit; tk.big = r.mult >= 50;
    D.coins += tk.paid; D.earned += tk.paid; D.scratched++;
    D.biggest = Math.max(D.biggest, tk.paid);
    this.fx = tk.paid ? (tk.big ? 'jackpot' : 'win') : null;
    this.settledAt = performance.now();
  }

  /* ---- auto-scratcher and auto-buyer ---- */
  mount(){
    super.mount();
    let acc = 0, last = performance.now();
    this.timer = setInterval(() => {
      const now = performance.now(), dt = Math.min(1, (now - last) / 1000), D = this.data, tk = D.ticket;
      last = now;
      if (tk && tk.paid === null && this.lv('auto')){
        acc += dt;
        if (acc >= ScratchLotto.autoInterval(this.lv('auto'))){
          acc = 0;
          const i = tk.rev.findIndex(r => !r);
          if (i >= 0) this.reveal([i]);
        }
      } else acc = 0;
      if (D.autobuy && this.lv('autobuy') && (!tk || tk.paid !== null) && now - (this.settledAt || 0) > 900){
        const T = this.ticketType(D.sel);
        if (T && D.unlocked[T.id] && D.coins >= T.cost) this.buy(T.id);
      }
    }, 100);
  }
  destroy(){ clearInterval(this.timer); super.destroy() }

  /* ---- scratch foil (canvas) ---- */
  afterRender(){ const tool = this.tool(); this.root.querySelectorAll('canvas.foil').forEach(c => this.initFoil(c, tool)) }
  static cursor(tool){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text x="2" y="26" font-size="24">${tool.icon}</text></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}") 6 26, crosshair`;
  }
  initFoil(canvas, tool){
    const ctx = canvas.getContext('2d', { willReadFrequently: true }), W = canvas.width, H = canvas.height;
    canvas.style.cursor = ScratchLotto.cursor(tool);
    ctx.fillStyle = '#c3cad5'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 7;
    for (let x = -H; x < W; x += 20){ ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + H, 0); ctx.stroke() }
    ctx.fillStyle = '#9aa3b2'; ctx.font = '700 58px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', W / 2, H / 2 + 3);
    let drawing = false, last = null, strokes = 0;
    const pos = e => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H } };
    const cleared = () => {
      const px = ctx.getImageData(0, 0, W, H).data; let n = 0, total = 0;
      for (let i = 3; i < px.length; i += 32){ total++; if (px[i] < 128) n++ }
      return n / total;
    };
    const check = () => {
      if (canvas.dataset.done || cleared() < tool.reveal) return;
      canvas.dataset.done = '1';
      this.reveal([Number(canvas.dataset.i)]);
    };
    const scratch = p => {
      ctx.globalCompositeOperation = 'destination-out'; ctx.strokeStyle = '#000'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = tool.brush;
      ctx.beginPath(); ctx.moveTo((last || p).x, (last || p).y); ctx.lineTo(p.x + 0.01, p.y); ctx.stroke();
      last = p;
      if (++strokes % 5 === 0) check();
    };
    canvas.addEventListener('pointerdown', e => { drawing = true; last = null; canvas.setPointerCapture(e.pointerId); scratch(pos(e)) });
    canvas.addEventListener('pointermove', e => { if (drawing) scratch(pos(e)) });
    const end = () => { if (drawing){ drawing = false; last = null; check() } };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  }

  /* ---- view ---- */
  money(n){ return '$' + Fmt.num(n) }
  ticketName(T){ return this.tr('t.' + T.id) }
  ruleText(T){ return this.tr('rule.' + T.rule, { need: T.need || 3 }) }
  cellHtml(T, tk, i){
    if (T.rule === 'numbers'){
      if (i < T.wins) return `<div class="sc-num big"><b>${tk.wins[i]}</b></div>`;
      const m = tk.mine[i - T.wins];
      return `<div class="sc-num"><b>${m.num}</b><small>${this.money(Math.round(m.p * T.cost * ScratchLotto.prizeMult(this.lv('prize'))))}</small></div>`;
    }
    const c = tk.cells[i];
    return c in ScratchLotto.MULTS ? `<b class="sc-mult">×${ScratchLotto.MULTS[c]}</b>` : Art.symbol(c);
  }
  spotHtml(T, tk, i){
    const settled = tk.paid !== null, win = settled && tk.hit.includes(i);
    const cls = ['spot', tk.rev[i] ? 'open' : '', settled ? (win ? 'win' : 'lose') : ''].join(' ');
    const foil = tk.rev[i] ? '' : `<canvas class="foil" data-i="${i}" width="120" height="120" aria-label="${this.tr('spot', { n: i + 1 })}"></canvas>`;
    return `<div class="${cls}" data-i="${i}">${this.cellHtml(T, tk, i)}${foil}</div>`;
  }
  viewTicket(){
    const tk = this.data.ticket;
    if (!tk) return `<div class="ticket-empty"><div>${Art.icon('ticket')}${this.tr('empty')}</div></div>`;
    const T = this.ticketType(tk.tier), settled = tk.paid !== null, n = this.spotCount(T);
    const idx = a => a.map(i => this.spotHtml(T, tk, i)).join('');
    const all = Array.from({ length: n }, (_, i) => i);
    const body = T.rule === 'numbers'
      ? `<div class="sc-label">${this.tr('winNums')}</div><div class="spots sc-winrow">${idx(all.slice(0, T.wins))}</div>
         <div class="sc-label">${this.tr('yourNums')}</div><div class="spots c${T.cols}">${idx(all.slice(T.wins))}</div>`
      : `<div class="spots c${T.cols}">${idx(all)}</div>`;
    const stamp = settled ? `<div class="ticket-stamp ${tk.paid ? 'win' : 'lose'}">${tk.paid ? this.tr(tk.big ? 'jackpot' : 'winner') : this.tr('noLuck')}</div>` : '';
    return `<div class="ticket" style="--tc:${T.col[0]};--tc2:${T.col[1]}">
      <div class="ticket-head"><div><small>${this.tr('ticketOf')}</small><b>${this.ticketName(T)}</b></div>
        <div class="ticket-price"><div>${this.money(T.cost)}</div></div></div>
      <div class="ticket-sub">${this.ruleText(T)}</div>${body}
      <div class="ticket-foot"><span>No. ${tk.serial}</span><span class="barcode"></span></div>${stamp}</div>`;
  }
  /** The next thing worth saving up for, so there is always a clear short-term target. */
  nextTarget(){
    const D = this.data, next = ScratchLotto.TICKETS.find(T => !D.unlocked[T.id]);
    if (next) return { text: this.tr('nextUnlock', { name: this.ticketName(next) }), cost: next.unlock };
    return D.crown ? null : { text: this.tr('nextCrown'), cost: ScratchLotto.GOAL };
  }
  viewTop(){
    const D = this.data, goal = ScratchLotto.GOAL, nt = this.nextTarget();
    const goalHtml = D.crown ? `<div class="sc-goal done"><b>👑 ${this.tr('crownOwned')}</b></div>`
      : `<div class="sc-goal"><div class="g-meter-top"><span>👑 ${this.tr('goal')}</span><span><b>${this.money(D.coins)}</b> / ${this.money(goal)}</span></div>
          <div class="g-track"><i style="width:${Math.min(100, D.coins / goal * 100)}%"></i></div></div>`;
    const next = nt ? `<div class="sc-next">🎯 ${nt.text}: <b>${this.money(nt.cost)}</b>${D.coins >= nt.cost ? ` · ${this.tr('canAfford')}` : ` · ${this.tr('toGo', { n: this.money(nt.cost - D.coins) })}`}</div>` : '';
    return `<div class="sc-top"><div class="sc-coins">${Art.icon('coin')}<b>${this.money(D.coins)}</b></div>${goalHtml}</div>${next}`;
  }
  viewBooth(){
    const D = this.data, busy = D.ticket && D.ticket.paid === null, luck = this.lv('luck');
    const firstLocked = ScratchLotto.TICKETS.find(T => !D.unlocked[T.id]);
    return ScratchLotto.TICKETS.map(T => {
      const style = `style="--tc:${T.col[0]};--tc2:${T.col[1]}"`;
      if (D.unlocked[T.id]){
        const ret = ScratchLotto.avgReturn(T, luck, this.lv('prize'));
        return `<button class="stub ${D.sel === T.id ? 'sel' : ''}" ${style} data-act="buy" data-tier="${T.id}" ${busy || D.coins < T.cost ? 'disabled' : ''}>
          <div><b>${this.ticketName(T)}</b><small>${this.ruleText(T)}</small><small class="ret ${ret >= 1 ? 'up' : 'down'}">${this.tr('avgReturn', { n: Math.round(ret * 100) })}</small></div>
          <span class="price">${this.money(T.cost)}</span></button>`;
      }
      if (T !== firstLocked) return `<div class="stub locked" ${style}><div><b>🔒 ${this.ticketName(T)}</b><small>${this.tr('unlockFirst')}</small></div><span class="price">${this.money(T.unlock)}</span></div>`;
      return `<button class="stub locked next" ${style} data-act="unlock" data-tier="${T.id}" ${D.coins < T.unlock ? 'disabled' : ''}>
        <div><b>🔓 ${this.ticketName(T)}</b><small>${this.ruleText(T)}</small><small>${this.tr('unlockFor', { n: this.money(T.unlock) })}</small></div><span class="price">${this.money(T.cost)}</span></button>`;
    }).join('');
  }
  shopRow(icon, name, desc, lvl, max, cost, act, extra = ''){
    const maxed = lvl >= max, poor = this.data.coins < cost;
    return `<div class="sc-item"><span class="ico">${icon}</span><div><b>${name}</b>${max > 1 ? ` <span class="lv">${this.tr('lv', { n: lvl, max })}</span>` : ''}<p>${desc}</p></div>
      ${maxed ? `<span class="g-muted sc-max">${this.tr('maxed')}</span>` : `<button class="g-btn sm" ${act} ${poor ? 'disabled' : ''}>${this.money(cost)}</button>`}${extra}</div>`;
  }
  viewShop(){
    const D = this.data, rows = [];
    for (const u of ScratchLotto.SHOP){
      const l = this.lv(u.id);
      if (u.id === 'autobuy' && l){
        rows.push(`<div class="sc-item"><span class="ico">${u.icon}</span><div><b>${this.tr('up.autobuy')}</b><p>${this.tr('up.autobuyOn', { name: this.ticketName(this.ticketType(D.sel)) })}</p></div>
          <button class="g-btn sm ${D.autobuy ? '' : 'alt'}" data-act="autobuy">${D.autobuy ? this.tr('on') : this.tr('off')}</button></div>`);
        continue;
      }
      const desc = u.id === 'tool' ? this.tr('up.toolD', { tool: this.tr('tool.' + ScratchLotto.TOOLS[Math.min(4, l + 1)].id) })
        : u.id === 'auto' ? this.tr('up.autoD', { s: ScratchLotto.autoInterval(l + 1).toFixed(1) })
        : u.id === 'prize' ? this.tr('up.prizeD', { n: Math.round(ScratchLotto.prizeMult(l + 1) * 100) }) : this.tr(`up.${u.id}D`);
      rows.push(this.shopRow(u.icon, this.tr('up.' + u.id), desc, l, u.max, u.max > l ? u.cost(l) : 0, `data-act="up" data-id="${u.id}"`));
    }
    if (!D.crown) rows.push(`<div class="sc-item sc-crown"><span class="ico">👑</span><div><b>${this.tr('crown')}</b><p>${this.tr('crownD')}</p></div>
      <button class="g-btn sm" data-act="crown" ${D.coins < ScratchLotto.GOAL ? 'disabled' : ''}>${this.money(ScratchLotto.GOAL)}</button></div>`);
    return rows.join('');
  }
  pct(x){ return x <= 0 ? '0%' : x < 0.001 ? '<0.1%' : (x * 100 < 10 ? (x * 100).toFixed(1) : Math.round(x * 100)) + '%' }
  viewBoard(){
    const T = this.ticketType(this.data.ticket?.tier || this.data.sel), pm = ScratchLotto.prizeMult(this.lv('prize')), luck = this.lv('luck');
    const st = ScratchLotto.stats(T, luck), so = ScratchLotto.spotOdds(T, luck), pct = x => this.pct(x);
    const amt = x => this.money(Math.round(x * T.cost * pm));
    const head = `<div class="pt-row pt-head"><span></span><span class="lab"></span><span>${this.tr('oSpot')}</span><span>${this.tr('oHit')}</span><span>${this.tr('oPrize')}</span></div>`;
    let rows;
    if (T.rule === 'numbers') rows = T.prizes.map((x, i) => `<div class="pt-row"><span style="font-weight:700">#</span><span class="lab">${this.tr('underNum')}</span><em>${pct(so[i].p)}</em><em></em><b>${amt(x[0])}</b></div>`).join('');
    else rows = T.syms.map((x, i) => {
      const id = x[0], ico = id in ScratchLotto.MULTS ? `<b class="sc-mult sm">×${ScratchLotto.MULTS[id]}</b>` : Art.symbol(id);
      const label = id === 'joker' ? this.tr('wild') : id in ScratchLotto.MULTS ? this.tr('multD') : T.rule === 'lines' ? this.tr('inLine') : '×' + T.need;
      return `<div class="pt-row">${ico}<span class="lab">${label}</span><em>${pct(so[i].p)}</em><em>${pct(st.hit[id] || 0)}</em><b>${x[2] ? amt(x[2]) : ''}</b></div>`;
    }).join('');
    const match = T.rule === 'numbers' ? `<div class="pt-sum"><span>${this.tr('oMatch')}</span><b>${pct(ScratchLotto.numberOdds(T, luck))}</b></div>` : '';
    return `<h3>${this.tr('board', { name: this.ticketName(T) })}</h3><p class="g-muted board-hint">${this.tr('hint.' + T.rule, { need: T.need || 3 })}</p>
      <div class="pt">${head}${rows}</div>${match}
      <div class="pt-sum"><span>${this.tr('oWin')}</span><b>${pct(st.win)}</b></div>
      <div class="pt-sum"><span>${this.tr('oRet')}</span><b>${Math.round(st.ret * pm * 100)}%</b></div>`;
  }
  /** One compact row of per-spot chances right under the ticket (small screens, where the board is far below). */
  viewStrip(){
    const T = this.ticketType(this.data.ticket?.tier || this.data.sel), luck = this.lv('luck'), st = ScratchLotto.stats(T, luck), pct = x => this.pct(x);
    const chips = T.rule === 'numbers' ? `<span>${this.tr('oMatch')} ${pct(ScratchLotto.numberOdds(T, luck))}</span>`
      : ScratchLotto.spotOdds(T, luck).map(x => `<span>${x.id in ScratchLotto.MULTS ? '<b>×' + ScratchLotto.MULTS[x.id] + '</b>&nbsp;' : Art.symbol(x.id)}${pct(x.p)}</span>`).join('');
    return `<div class="odds-strip">${chips}<span class="win">${this.tr('oWin')} ${pct(st.win)}</span></div>`;
  }
  render(){
    const D = this.data, tk = D.ticket, settled = !tk || tk.paid !== null;
    let msg = `<div class="sc-msg">${this.tr('pick')}</div>`;
    if (tk && !settled) msg = `<div class="sc-msg">${this.tr(this.lv('auto') ? 'dragAuto' : 'drag')}</div>`;
    else if (tk) msg = tk.paid ? `<div class="sc-msg win">${this.tr(tk.big ? 'wonBig' : 'won', { n: this.money(tk.paid) })}</div>` : `<div class="sc-msg lose">${this.tr('noWin')}</div>`;
    const tool = this.tool();
    const broke = settled && D.coins < this.cheapest();
    const action = broke ? `<button class="g-btn big" data-act="change">${this.tr('change')}</button>`
      : tk && !settled ? `<div class="sc-actions"><span class="sc-tool">${tool.icon} ${this.tr('toolLabel', { tool: this.tr('tool.' + tool.id) })}</span></div>` : '';
    const pop = this.fx === 'win' || this.fx === 'jackpot' ? `<div class="g-pop ${this.fx}">${Art.icon('coin')} +${this.money(tk.paid)}</div>`
      : this.fx === 'crown' ? `<div class="g-pop jackpot">👑 ${this.tr('crownWon')}</div>` : '';
    this.root.innerHTML = `<div class="g g-scratch sc2">
      ${this.viewTop()}
      <div class="sc-play">
        <div class="sc-stage">${pop}${this.viewTicket()}${msg}${action}${this.viewStrip()}</div>
        <div class="booth">
          <div class="g-panel"><h3>${this.tr('booth')}</h3><div class="stubs">${this.viewBooth()}</div></div>
          <div class="g-panel">${this.viewBoard()}</div>
          <div class="g-panel"><h3>${this.tr('shop')}</h3><div class="sc-shop">${this.viewShop()}</div></div>
          <p class="g-muted sc-stats">${this.tr('stats', { n: Fmt.num(D.scratched), b: this.money(D.biggest), e: this.money(D.earned) })}
            · <button class="sc-link" data-act="reset">${this.tr('reset')}</button></p>
        </div></div></div>`;
    this.afterRender();
  }
}

/* ---------- 5b. Dice Pit ------------------------------------------ */
class DicePit extends RunGame {
  static HANDS = [
    { id: 'five',     chips: 100, mult: 10, kind: true },
    { id: 'four',     chips: 60,  mult: 7,  kind: true },
    { id: 'straight', chips: 50,  mult: 5,  straight: true },
    { id: 'house',    chips: 40,  mult: 4,  kind: true },
    { id: 'small',    chips: 30,  mult: 4,  straight: true },
    { id: 'three',    chips: 30,  mult: 3,  kind: true },
    { id: 'twopair',  chips: 20,  mult: 2 },
    { id: 'pair',     chips: 10,  mult: 2 },
    { id: 'high',     chips: 5,   mult: 1 },
  ];
  static PIPS = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  static GOAL_BASE = 300;
  static GOAL_GROWTH = 1.6;

  constructor(root, slot){ super(root, slot); this.fresh = new Set() }

  get key(){ return 'dp' }
  get theme(){ return 'dice' }
  get palette(){ return ['#e63946', '#2f8cff', '#ffb627', '#8b5cf6', '#2bb673'] }
  logoHtml(){ return `<div class="dp-logo"><div class="dp-logo-dice">${DicePit.dieArt(6)}${DicePit.dieArt(1)}${DicePit.dieArt(5)}</div><div class="logo-text">${this.tr('logo1')} <span>${this.tr('logo2')}</span></div></div>` }
  static thumb(){ return `<div class="th th-dice">${DicePit.dieArt(6)}${DicePit.dieArt(6)}</div>` }
  perkDefs(){ return [
    { id: 'dice',  icon: '🎲', max: 2, base: 6, step: 6 },
    { id: 'rolls', icon: '🤚', max: 2, base: 4, step: 4 },
    { id: 'hands', icon: '✋', max: 1, base: 8, step: 0 },
    { id: 'mult',  icon: '✖️', max: 3, base: 3, step: 3 },
  ] }
  upgradeDefs(){ return [
    { id: 'rerolls', icon: '🥤', max: 4 }, { id: 'hands', icon: '✋', max: 3 }, { id: 'dice',    icon: '🎲', max: 3 },
    { id: 'loaded',  icon: '🧲', max: 4 }, { id: 'mult',  icon: '✖️', max: 6 }, { id: 'chips',   icon: '🪙', max: 6 },
    { id: 'sixes',   icon: '6️⃣', max: 5 }, { id: 'kindred', icon: '👪', max: 4 }, { id: 'straights', icon: '📈', max: 4 },
  ] }
  defaults(){ const d = super.defaults(); d.meta.bestHand = 0; d.meta.rolls = 0; return d }
  extraBadges(m){ return this.badge(Art.icon('trophy'), this.tr('bestHand'), Fmt.num(m.bestHand)) + this.badge(Art.icon('reroll'), this.tr('rolls'), Fmt.num(m.rolls)) }
  handName(h){ return h?.id ? this.tr(`hand.${h.id}`) : (h?.name || '') }   // h.name: saves from before translations

  /* ---- pure rules ---- */
  static evaluate(values, up = {}, perkMult = 0){
    const counts = Array(7).fill(0); values.forEach(v => counts[v]++);
    const sorted = counts.slice(1).sort((a, b) => b - a);
    const pairs = counts.filter(c => c >= 2).length;
    const uniq = [...new Set(values)].sort((a, b) => a - b);
    let streak = 1, longest = 1;
    for (let i = 1; i < uniq.length; i++){ streak = uniq[i] === uniq[i - 1] + 1 ? streak + 1 : 1; longest = Math.max(longest, streak) }

    const match = {
      five: sorted[0] >= 5, four: sorted[0] >= 4, straight: longest >= 5, house: sorted[0] >= 3 && sorted[1] >= 2,
      small: longest >= 4, three: sorted[0] >= 3, twopair: pairs >= 2, pair: sorted[0] >= 2, high: true,
    };
    const sum = values.reduce((a, b) => a + b, 0);
    const sixes = counts[6] * 5 * (up.sixes || 0);
    const score = h => {
      const chips = h.chips + sum + sixes + 8 * (up.chips || 0);
      const mult = h.mult + perkMult + (up.mult || 0) + (h.kind ? 4 * (up.kindred || 0) : 0) + (h.straight ? 5 * (up.straights || 0) : 0);
      return { id: h.id, chips, mult, score: Math.floor(chips * mult) };
    };
    return DicePit.HANDS.filter(h => match[h.id]).map(score).sort((a, b) => b.score - a.score)[0];
  }
  static roll(index, loaded){ return index < loaded ? Rng.int(3, 6) : Rng.int(1, 6) }
  static pips(v){ return Array.from({ length: 9 }, (_, k) => `<i class="${v && DicePit.PIPS[v].includes(k) ? 'on' : ''}"></i>`).join('') }
  static dieArt(v){ return `<span class="die v${v}">${DicePit.pips(v)}</span>` }

  /* ---- run rules ---- */
  diceCount(){ return 5 + this.perkLevel('dice') + this.level('dice') }
  handsTotal(){ return 3 + this.perkLevel('hands') + this.level('hands') }
  rerollsPerHand(){ return 2 + this.perkLevel('rolls') + this.level('rerolls') }
  newRun(){ return { score: 0, handsLeft: 0, rollsLeft: 0, rolled: false, dice: [], last: null, biggest: 0 } }
  startRound(run){ run.score = 0; run.handsLeft = this.handsTotal(); run.last = null; this.startHand(run) }
  startHand(run){
    run.dice = Array.from({ length: this.diceCount() }, () => ({ v: 0, held: false }));
    run.rolled = false; run.rollsLeft = this.rerollsPerHand();
  }
  goal(run){ return Math.round(DicePit.GOAL_BASE * DicePit.GOAL_GROWTH ** (run.round - 1)) }
  roundValue(run){ return run.score }
  hudStats(run){ return [
    { icon: Art.icon('chip'), label: this.tr('hands'), value: run.handsLeft },
    { icon: Art.icon('reroll'), label: this.tr('rerolls'), value: run.rolled ? run.rollsLeft : this.rerollsPerHand() },
  ] }
  starsFor(run){ return Math.max(0, run.round - 1) + Math.floor(run.biggest / 400) }
  resultNote(run){ return run.last ? this.tr('last', { name: this.handName(run.last), n: Fmt.num(run.last.score) }) : '' }

  /* ---- actions ---- */
  playAct(name, d, run){
    this.fresh = new Set();
    if (name === 'roll') return this.rollDice(run);
    if (name === 'hold' && run.rolled){ run.dice[d.i].held = !run.dice[d.i].held; return this.commit() }
    if (name === 'score' && run.rolled) return this.scoreHand(run);
  }
  rollDice(run){
    const first = !run.rolled;
    if (!first && (run.rollsLeft <= 0 || run.dice.every(x => x.held))) return;
    const loaded = this.level('loaded');
    run.dice.forEach((die, i) => {
      if (first || !die.held){ die.v = DicePit.roll(i, loaded); this.fresh.add(i) }
    });
    if (!first) run.rollsLeft--;
    run.rolled = true;
    this.data.meta.rolls++;
    this.commit();
  }
  scoreHand(run){
    const res = DicePit.evaluate(run.dice.map(x => x.v), run.upgrades, this.perkLevel('mult'));
    run.score += res.score; run.last = res; run.handsLeft--;
    run.biggest = Math.max(run.biggest, res.score);
    this.data.meta.bestHand = Math.max(this.data.meta.bestHand, res.score);
    if (run.handsLeft <= 0) return this.finishRound();
    this.fx = res;
    this.startHand(run);
    this.commit();
  }

  /* ---- view ---- */
  dieButton(d, i){
    const label = this.tr('die', { i: i + 1, v: d.v || this.tr('notRolled') }) + (d.held ? this.tr('heldSuffix') : '');
    return `<button class="die v${d.v} ${d.v ? '' : 'blank'} ${d.held ? 'held' : ''} ${this.fresh.has(i) ? 'roll' : ''}" data-act="hold" data-i="${i}"
      data-held="${this.tr('held')}" ${d.v ? '' : 'disabled'} aria-label="${label}">${DicePit.pips(d.v)}</button>`;
  }
  viewPlay(run){
    const preview = run.rolled ? DicePit.evaluate(run.dice.map(x => x.v), run.upgrades, this.perkLevel('mult')) : null;
    const canReroll = run.rolled && run.rollsLeft > 0 && !run.dice.every(d => d.held);
    const plate = preview
      ? `<div class="hand-name">${this.handName(preview)}</div><div class="formula"><span class="dp-chips">${preview.chips}</span><span class="x">×</span>
          <span class="dp-mult">${preview.mult}</span><span class="x">=</span><span class="total">${Fmt.num(preview.score)}</span></div>`
      : `<div class="hand-name hint">${run.last ? this.tr('lastShort', { name: this.handName(run.last), n: Fmt.num(run.last.score) }) : this.tr('shake')}</div>`;
    const pop = this.fx ? `<div class="g-pop" style="top:12%">+${Fmt.num(this.fx.score)}</div>` : '';
    const hands = Array.from({ length: this.handsTotal() }, (_, i) => `<i class="token ${i < run.handsLeft ? '' : 'used'}"></i>`).join('');
    const rerolls = Array.from({ length: this.rerollsPerHand() }, (_, i) => `<i class="token blue ${!run.rolled || i < run.rollsLeft ? '' : 'used'}"></i>`).join('');
    const table = DicePit.HANDS.map(h => `<div class="${preview?.id === h.id ? 'hit' : ''}"><span>${this.tr(`hand.${h.id}`)}</span><span><span class="c">${h.chips}</span> × <span class="m">${h.mult}</span></span></div>`).join('');
    return `<div class="dp-play">
      <div class="felt">${pop}
        <div class="dice-row">${run.dice.map((d, i) => this.dieButton(d, i)).join('')}</div>
        <div class="plate">${plate}</div>
        <div class="g-row">
          <button class="g-btn big ${run.rolled ? 'alt' : ''}" data-act="roll" ${run.rolled && !canReroll ? 'disabled' : ''}>
            ${run.rolled ? `${this.tr('reroll')}<small>${this.tr('rerollLeft', { n: run.rollsLeft })}</small>` : this.tr('roll')}</button>
          <button class="g-btn big" data-act="score" ${run.rolled ? '' : 'disabled'} style="--g-accent:#2bb673;--g-accent-shadow:#17794a">${this.tr('score')}</button>
        </div>
        <div class="g-muted" style="font-size:.85rem;font-weight:600">${run.rolled ? this.tr('tapHold') : '&nbsp;'}</div>
      </div>
      <div class="dp-side">
        <div class="g-panel"><div class="tok-label">${this.tr('handsLeft')}</div><div class="tokens">${hands}</div>
          <div class="tok-label">${this.tr('rerollsHand')}</div><div class="tokens" style="margin:0">${rerolls}</div></div>
        <div class="plaque"><h3>${this.tr('payTable')}</h3>${table}</div>
      </div></div>`;
  }
}

/* ---------- 5c. Dig Pit ------------------------------------------- */
class DigPit extends RunGame {
  static GOAL_BASE = 24;
  static GOAL_GROWTH = 1.4;
  static BASE_ENERGY = 12;
  static STRATA = ['#9a6a3a', '#8a5a30', '#7a4e2b', '#6e5a4c', '#5d5560', '#4d4760', '#3e3658', '#2f2748'];

  get key(){ return 'dg' }
  get theme(){ return 'dig' }
  get palette(){ return ['#f5b82e', '#3fd0ff', '#c0652b', '#7ccf5f', '#a78bfa'] }
  logoHtml(){ return `<div class="dg-logo">${Art.MINER}<div class="logo-text">${this.tr('logo')}</div></div>` }
  static thumb(){ return `<div class="th th-dig">${Art.MINER}</div>` }
  perkDefs(){ return [
    { id: 'energy', icon: '⚡', max: 4, base: 3, step: 2 },
    { id: 'helmet', icon: '🪖', max: 3, base: 4, step: 3 },
    { id: 'pick',   icon: '⛏️', max: 4, base: 3, step: 2 },
    { id: 'rope',   icon: '🪢', max: 1, base: 6, step: 0 },
  ] }
  upgradeDefs(){ return [
    { id: 'pick',  icon: '⛏️', max: 4 }, { id: 'helmet',   icon: '🪖', max: 4 }, { id: 'lantern', icon: '🔦', max: 4 },
    { id: 'charm', icon: '🍀', max: 4 }, { id: 'backpack', icon: '🎒', max: 4 }, { id: 'rope',    icon: '🪢', max: 3 },
    { id: 'contract', icon: '📜', max: 3 },
  ] }
  defaults(){ const d = super.defaults(); d.meta.deepest = 0; d.meta.gold = 0; return d }
  extraBadges(m){ return this.badge(Art.icon('depth'), this.tr('deepest'), m.deepest + 'm') + this.badge(Art.icon('coin'), this.tr('goldFound'), Fmt.num(m.gold)) }

  /* ---- pure rules ---- */
  static hazard(depth, helmet){ return Math.min(0.7, Math.max(0.02, 0.06 + 0.035 * depth - 0.03 * helmet)) }
  static outcome(depth, lanternLv, charmLv, lootMult){
    const table = [
      { id: 'nothing', w: 22 }, { id: 'ore', w: 55 },
      { id: 'gem', w: 12 + 4 * lanternLv }, { id: 'chest', w: 4 + 2 * charmLv },
    ];
    const kind = Rng.weighted(table, e => e.w).id;
    const base = { nothing: 0, ore: Rng.int(3, 6) + 2 * depth, gem: 12 + 4 * depth, chest: 30 + 10 * depth }[kind];
    return { kind, gold: Math.round(base * lootMult) };
  }
  static stratumColor(d){ return DigPit.STRATA[Math.min(DigPit.STRATA.length - 1, Math.floor((d - 1) / 2))] }
  /** Pebbles, crystals and fossils in the rock wall, placed deterministically per depth. */
  static deco(d){
    const n = k => Rng.noise(d, k);
    let s = '';
    for (let k = 0; k < 6; k++){
      const r = (n(k + 19) * 5 + 3).toFixed(1);
      s += `<ellipse cx="${(n(k) * 92 + 4).toFixed(1)}%" cy="${(n(k + 9) * 70 + 15).toFixed(1)}%" rx="${r}" ry="${(r * 0.7).toFixed(1)}" fill="${n(k + 29) > 0.5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.2)'}"/>`;
    }
    const side = n(40) > 0.5 ? n(41) * 22 + 6 : n(41) * 22 + 66;   // keep art out of the shaft
    if (d % 3 === 0) s += `<svg x="${side.toFixed(1)}%" y="22%" width="22" height="22" viewBox="0 0 64 64" opacity=".85">${Art.SYMBOLS.gem}</svg>`;
    if (d % 5 === 2) s += `<svg x="${(100 - side - 8).toFixed(1)}%" y="30%" width="34" height="22" viewBox="0 0 64 40" opacity=".45">
      <path d="M12 20 h40" stroke="#efe3c8" stroke-width="7" stroke-linecap="round"/><circle cx="10" cy="15" r="6" fill="#efe3c8"/><circle cx="10" cy="25" r="6" fill="#efe3c8"/><circle cx="54" cy="15" r="6" fill="#efe3c8"/><circle cx="54" cy="25" r="6" fill="#efe3c8"/></svg>`;
    return `<svg class="deco" aria-hidden="true">${s}</svg>`;
  }

  /* ---- run rules ---- */
  energyTotal(){ return DigPit.BASE_ENERGY + 2 * (this.perkLevel('energy') + this.level('backpack')) }
  newRun(){ return { energy: 0, depth: 0, shaft: 0, carry: 0, haul: 0, deepest: 0, log: [] } }
  startRound(run){
    run.energy = this.energyTotal();
    run.depth = 0; run.shaft = 0; run.carry = 0; run.haul = 0; run.log = [{ k: 'dg.log.start' }];
  }
  goal(run){ return Math.round(DigPit.GOAL_BASE * DigPit.GOAL_GROWTH ** (run.round - 1) * (1 - 0.1 * this.level('contract'))) }
  roundValue(run){ return run.haul }
  hudStats(run){ return [
    { icon: Art.icon('bolt'), label: this.tr('energy'), value: run.energy },
    { icon: Art.icon('depth'), label: this.tr('depth'), value: run.depth + 'm' },
  ] }
  starsFor(run){ return Math.max(0, run.round - 1) + Math.floor(run.deepest / 5) }
  lootMult(){ return 1 + 0.25 * this.level('pick') + 0.15 * this.perkLevel('pick') }
  helmet(){ return this.level('helmet') + this.perkLevel('helmet') }
  ropeKeep(){ return Math.min(0.75, 0.25 * (this.level('rope') + this.perkLevel('rope'))) }
  note(run, k, v){ run.log = [{ k, v }, ...run.log].slice(0, 5) }

  /* ---- actions ---- */
  playAct(name, d, run){
    if (name === 'dig') return this.dig(run);
    if (name === 'climb') return this.climb(run);
  }
  dig(run){
    if (run.energy <= 0) return;
    run.energy--; run.depth++;
    run.shaft = Math.max(run.shaft || 0, run.depth);
    run.deepest = Math.max(run.deepest, run.depth);
    this.data.meta.deepest = Math.max(this.data.meta.deepest, run.depth);

    if (Rng.chance(DigPit.hazard(run.depth, this.helmet()))){
      const keep = Math.floor(run.carry * this.ropeKeep()), lost = run.carry - keep;
      this.note(run, keep ? 'dg.log.caveKeep' : 'dg.log.cave', { d: run.depth, lost, keep });
      run.carry = keep; run.depth = 0; run.shaft = 0; run.energy = Math.max(0, run.energy - 2);
      this.fx = { type: 'cave' };
    } else {
      const r = DigPit.outcome(run.depth, this.level('lantern'), this.level('charm'), this.lootMult());
      run.carry += r.gold; this.data.meta.gold += r.gold;
      this.note(run, `dg.log.${r.kind}`, { n: r.gold });
      this.fx = { type: 'loot', ...r };
    }
    this.afterMove(run);
  }
  climb(run){
    if (run.depth <= 0 || run.energy <= 0) return;
    run.energy--;
    this.fx = { type: 'bank', gold: run.carry };
    this.bank(run, 'dg.log.climb');
    this.afterMove(run);
  }
  bank(run, key){
    this.note(run, key, { n: run.carry });
    run.haul += run.carry; run.carry = 0; run.depth = 0;
  }
  afterMove(run){
    if (run.energy <= 0){
      if (run.carry) this.bank(run, 'dg.log.tired');
      return this.finishRound();
    }
    this.commit();
  }
  resultNote(run){ return this.tr('hauled', { n: Fmt.num(run.haul) }) }

  /* ---- view ---- */
  afterRender(){
    const scene = this.root.querySelector('.scene'), miner = scene?.querySelector('.shaft .miner');
    if (scene) scene.scrollTop = miner ? Math.max(0, miner.closest('.stratum').offsetTop - scene.clientHeight / 2) : 0;
  }
  viewScene(run){
    const fx = this.fx, shaft = run.shaft || run.depth;
    const rows = Math.max(6, run.depth + 3, shaft + 2);
    const pop = (html, cls = '') => `<div class="g-pop ${cls}">${html}</div>`;
    let html = `<div class="sky"><div class="sun"></div><div class="cloud" style="left:10%;top:26px"></div><div class="cloud" style="left:64%;top:52px;transform:scale(.7)"></div>
      <div class="headframe">${Art.HEADFRAME}</div>
      ${run.depth > 0 ? '<div class="rope-top"></div>' : `<div class="miner at-surface">${Art.MINER}</div>`}
      <div class="grass"></div>
      ${fx?.type === 'bank' ? pop(`${Art.icon('coin')} ${this.tr('banked', { n: fx.gold })}`) : ''}</div>`;
    for (let d = 1; d <= rows; d++){
      const here = d === run.depth, risk = DigPit.hazard(d, this.helmet());
      const level = risk < 0.15 ? 'low' : risk < 0.3 ? 'mid' : 'high';
      const loot = here && fx?.type === 'loot' ? pop(`${Art.LOOT[fx.kind]} ${fx.gold ? '+' + fx.gold : this.tr('rocks')}`, fx.gold ? '' : 'dim') : '';
      html += `<div class="stratum ${d <= shaft ? 'dug' : ''}" style="background:${DigPit.stratumColor(d)}">
        ${DigPit.deco(d)}
        <div class="shaft">${d < run.depth ? '<i class="rope"></i>' : ''}${here ? `<i class="rope half"></i><div class="miner ${fx?.type === 'loot' ? 'dig' : ''}">${Art.MINER}</div>` : ''}</div>
        <span class="depth-label">${d}m</span>
        ${d > run.depth ? `<span class="risk ${level}">${Math.round(risk * 100)}%</span>` : ''}
        ${loot}</div>`;
    }
    const rocks = fx?.type === 'cave'
      ? `<div class="cavein"><b>${this.tr('cavein')}</b>${Array.from({ length: 10 }, (_, k) => `<i style="left:${8 + k * 9}%;animation-delay:${(k % 4) * 0.07}s"></i>`).join('')}</div>` : '';
    return `<div class="scene ${fx?.type === 'cave' ? 'shake' : ''}">${rocks}${html}</div>`;
  }
  viewPlay(run){
    const next = run.depth + 1, risk = Math.round(DigPit.hazard(next, this.helmet()) * 100), max = this.energyTotal();
    const energy = Array.from({ length: max }, (_, i) => `<i class="${i < run.energy ? 'on' : ''}"></i>`).join('');
    return `<div class="dg-play">${this.viewScene(run)}
      <div class="dg-side">
        <div class="g-panel"><div class="side-h">${Art.icon('bolt')} ${this.tr('energy')} <b>${run.energy} / ${max}</b></div><div class="energy">${energy}</div></div>
        <div class="purse">
          <div class="at-risk">${Art.LOOT.sack}<b>${Fmt.num(run.carry)}</b><small>${this.tr('carrying')}</small></div>
          <div>${Art.LOOT.chest}<b>${Fmt.num(run.haul)}</b><small>${this.tr('bankedSafe')}</small></div></div>
        <button class="g-btn big" data-act="dig">${this.tr('digTo', { d: next })}<small>${this.tr('risk', { p: risk })}</small></button>
        <button class="g-btn alt big" data-act="climb" ${run.depth <= 0 ? 'disabled' : ''}>${this.tr('climb')}<small>${run.depth > 0 ? this.tr('bankN', { n: run.carry }) : this.tr('atSurface')}</small></button>
        <div class="journal"><h4>${this.tr('journal')}</h4>${run.log.map(l => `<div>${I18n.msg(l)}</div>`).join('')}</div>
      </div></div>`;
  }
}

/* ---------- 5d. Embedded games ------------------------------------ */
/**
 * Runs a complete, self-contained game page in an iframe. The page source lives in a
 * <script type="text/plain" id="src-<id>"> block in this file (closing script tags stored as <\/script).
 * The page keeps its own UI, sound/language buttons and localStorage keys; cfg tells the hub
 * which key holds its language (synced from the hub on open) and which keys hold its save data.
 */
class EmbeddedGame extends Game {
  static cfg = { id: '', key: '', langKey: '', saveKeys: [] };
  static define(cfg){ return class extends EmbeddedGame { static cfg = cfg } }

  get key(){ return this.constructor.cfg.key }
  static source(){
    const el = document.getElementById('src-' + this.cfg.id);
    return el ? el.textContent.replace(/<\\\/script/gi, '<' + '/script') : '';
  }
  mount(){
    const cfg = this.constructor.cfg;
    try { if (cfg.langKey) localStorage.setItem(cfg.langKey, I18n.lang) } catch {}   // open in the hub's language
    this.root.innerHTML = `<div class="embed">
      <div class="embed-bar">${t('embed.hint')}</div>
      <iframe class="embed-frame" title="${t(cfg.key + '.title')}" allow="fullscreen; autoplay"></iframe></div>`;
    this.frame = this.root.querySelector('iframe');
    // Fullscreen lives in the hub's title row (not offered where the browser can't do it, e.g. iPhone Safari).
    this.tools = document.getElementById('gameTools');
    if (this.tools && document.fullscreenEnabled){
      this.tools.innerHTML = `<button class="btn">⛶ <span class="lbl">${t('embed.full')}</span></button>`;
      this.tools.firstChild.onclick = () => this.frame.requestFullscreen?.().then(() => this.frame.contentWindow?.focus()).catch(() => {});
    }
    this.frame.addEventListener('load', () => {
      const win = this.frame.contentWindow;
      win?.focus();
      // These pages size their canvas once at load; re-run that after their pixel font arrives and the layout settles.
      const relayout = () => win?.dispatchEvent(new Event('resize'));
      win?.document.fonts?.ready.then(relayout);
      setTimeout(relayout, 400);
    });
    this.frame.srcdoc = this.constructor.source();
  }
  destroy(){ if (this.tools) this.tools.innerHTML = ''; this.root.innerHTML = '' }
  static embedded(){ return true }
  static savesData(){ return this.cfg.saveKeys.length > 0 }
  static hasSave(store){ return this.cfg.saveKeys.some(k => store.rawGet(k) !== null) }
  static saveBytes(store){ return this.cfg.saveKeys.reduce((n, k) => n + (store.rawGet(k)?.length || 0), 0) }
  static clearSave(store){ this.cfg.saveKeys.forEach(k => store.rawRemove(k)) }
  static rawKeys(){ return this.cfg.saveKeys }
  static summary(store){ return this.cfg.summary?.(k => store.rawGet(k)) || '' }
  static thumb(){ return this.cfg.thumb || '' }
}
