/* ---------- 7. Hub UI --------------------------------------------- */
class SavesDialog {
  constructor(store, catalog, onChange){
    this.store = store; this.catalog = catalog; this.onChange = onChange;
    this.dlg = document.getElementById('dlg');
    this.list = document.getElementById('saveList');
    const on = (id, fn) => document.getElementById(id).addEventListener('click', fn);
    on('savesBtn', () => this.open());
    on('close', () => { this.dlg.close(); this.onChange() });
    on('wipe', () => { if (confirm(t('saves.confirmWipe'))){ store.clearAll(); catalog.forEach(g => g.GameClass.clearSave(store, g.id)); this.open(); this.onChange() } });
    on('exp', () => this.export());
    on('imp', () => document.getElementById('file').click());
    this.list.addEventListener('click', e => {
      const id = e.target.dataset.del;
      if (!id) return;
      const g = catalog.find(x => x.id === id);
      g ? g.GameClass.clearSave(store, id) : store.clear(id);
      this.open(); this.onChange();
    });
    document.getElementById('file').addEventListener('change', e => this.import(e));
  }
  rawKeys(){ return this.catalog.flatMap(g => g.GameClass.rawKeys()) }
  /** One row per game with data, plus any leftover hub saves from games no longer in the catalog. */
  rows(){
    const rows = this.catalog.filter(g => g.GameClass.hasSave(this.store, g.id)).map(g =>
      ({ id: g.id, name: g.icon + ' ' + gameTitle(g), bytes: g.GameClass.saveBytes(this.store, g.id), updated: this.store.info(g.id)?.updated }));
    this.store.ids().filter(id => !this.catalog.some(g => g.id === id)).forEach(id => {
      const i = this.store.info(id); rows.push({ id, name: id, bytes: i.bytes, updated: i.updated });
    });
    return rows;
  }
  open(){
    const rows = this.rows();
    this.list.innerHTML = rows.length ? rows.map(r =>
      `<div class="save-row"><div><b>${r.name}</b><br><small>${Fmt.bytes(r.bytes)}${r.updated ? ' · ' + new Date(r.updated).toLocaleString(I18n.locale()) : ''}</small></div>
        <button class="btn danger" data-del="${r.id}">${t('saves.delete')}</button></div>`).join('') : `<div class="muted" style="text-align:center;padding:18px">${t('saves.empty')}</div>`;
    if (!this.dlg.open) this.dlg.showModal();
  }
  export(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(this.store.exportAll(this.rawKeys()), null, 2)], { type: 'application/json' }));
    a.download = 'arcade-hub-saves.json'; a.click(); URL.revokeObjectURL(a.href);
  }
  async import(e){
    try { this.store.importAll(JSON.parse(await e.target.files[0].text()), this.rawKeys()); Toast.show(t('saves.imported')); this.open(); this.onChange() }
    catch { Toast.show(t('saves.invalid')) }
    e.target.value = '';
  }
}

class Hub {
  constructor(store, catalog){
    this.store = store; this.catalog = catalog;
    this.settings = new Settings(store);
    this.genre = 'all'; this.game = null;
    this.focus = -1; this.list = []; this.genres = ['all']; this.lastId = null;
    this.$ = id => document.getElementById(id);
  }
  init(){
    new ThemeToggle(this.settings, this.$('themeBtn'));
    new LanguageToggle(this.settings, this.$('langBtn'), this.$('langLabel'), () => { this.renderChips(); this.route() });
    this.saves = new SavesDialog(this.store, this.catalog, () => this.route());
    this.$('home').onclick = this.$('back').onclick = () => { location.hash = '#/' };
    this.bindMenu();
    this.$('resetGame').onclick = () => this.resetCurrent();
    addEventListener('hashchange', () => this.route());
    if (!this.store.persistent) Toast.show(t('saves.blocked'));
    this.renderChips();
    this.route();
  }
  route(){
    this.game?.destroy(); this.game = null;
    const id = (location.hash.match(/^#\/game\/([^?]+)/) || [])[1];
    const entry = this.catalog.find(g => g.id === id);
    this.$('menu').classList.toggle('active', !entry);
    this.$('game').classList.toggle('active', !!entry);
    // Layout hooks: in-game hides the footer (and the top bar on phones); embed-mode makes the iframe fill the screen.
    document.body.classList.toggle('in-game', !!entry);
    document.body.classList.toggle('embed-mode', !!entry?.GameClass.embedded());
    if (entry) this.openGame(entry); else { this.renderGrid(); this.renderStats() }
    scrollTo(0, 0);
  }
  openGame(entry){
    this.current = entry; this.lastId = entry.id;
    this.$('gameTitle').textContent = gameTitle(entry);
    this.$('resetGame').hidden = !entry.GameClass.savesData();
    this.game = new entry.GameClass(this.$('stage'), this.store.slot(entry.id));
    this.game.mount();
  }
  resetCurrent(){
    if (!this.current || !confirm(t('saves.confirmReset', { title: gameTitle(this.current) }))) return;
    this.current.GameClass.clearSave(this.store, this.current.id);
    this.route(); Toast.show(t('saves.reset'));
  }
  /* ---- home screen: tabs, tile row, details panel, keyboard + gamepad ---- */
  bindMenu(){
    const grid = this.$('grid');
    this.$('search').oninput = () => { this.lastId = null; this.renderGrid() };
    this.$('chips').onclick = e => { const b = e.target.closest('[data-g]'); if (b) this.setGenre(b.dataset.g) };
    // Mouse: hovering focuses a tile (no scrolling, so the row never moves under the cursor) and a click opens it.
    // Touch: the first tap focuses and centres the tile, tapping it again opens it.
    grid.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const tile = e.target.closest('.tile'); if (tile) this.setFocus(+tile.dataset.i, false) });
    grid.addEventListener('click', e => {
      const tile = e.target.closest('.tile'); if (!tile) return;
      const i = +tile.dataset.i;
      i === this.focus ? this.openFocused() : this.setFocus(i, true);
    });
    this.$('info').addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      b.dataset.act === 'random' ? this.openRandom() : this.openFocused();
    });
    addEventListener('keydown', e => this.onKey(e));
    const clock = () => { this.$('clock').textContent = new Date().toLocaleTimeString(I18n.locale(), { hour: 'numeric', minute: '2-digit' }) };
    clock(); setInterval(clock, 20000);
    this.padLoop();
  }
  menuActive(){ return this.$('menu').classList.contains('active') && !this.$('dlg').open }
  onKey(e){
    if (!this.menuActive() || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.matches?.('input,textarea,select')){ if (e.key === 'Escape') e.target.blur(); return }
    const k = e.key;
    if (k === 'ArrowRight') this.setFocus(this.focus + 1, true);
    else if (k === 'ArrowLeft') this.setFocus(this.focus - 1, true);
    else if (k === 'Home') this.setFocus(0, true);
    else if (k === 'End') this.setFocus(this.list.length - 1, true);
    else if (k === 'ArrowDown') this.cycleGenre(1);
    else if (k === 'ArrowUp') this.cycleGenre(-1);
    else if ((k === 'Enter' || k === ' ') && (e.target === document.body || e.target.classList?.contains('tile'))) this.openFocused();
    else return;
    e.preventDefault();
  }
  /** D-pad / left stick to browse, A (cross) to play, shoulder buttons to change category. */
  padLoop(){
    let last = 0, held = false;
    const tick = now => {
      requestAnimationFrame(tick);
      if (!this.menuActive()) return;
      const pad = (navigator.getGamepads?.() || []).find(Boolean); if (!pad) return;
      const b = i => !!pad.buttons[i]?.pressed, x = pad.axes[0] || 0, y = pad.axes[1] || 0;
      const ok = b(0);
      if (ok && !held) this.openFocused();
      held = ok;
      if (now - last < 200) return;
      if (b(15) || x > 0.6) this.setFocus(this.focus + 1, true);
      else if (b(14) || x < -0.6) this.setFocus(this.focus - 1, true);
      else if (b(5) || b(13) || y > 0.7) this.cycleGenre(1);
      else if (b(4) || b(12) || y < -0.7) this.cycleGenre(-1);
      else return;
      last = now;
    };
    requestAnimationFrame(tick);
  }
  setGenre(g){ this.genre = g; this.lastId = null; this.renderChips(); this.renderGrid() }
  cycleGenre(d){ const n = this.genres.length; this.setGenre(this.genres[(this.genres.indexOf(this.genre) + d + n) % n]) }
  openFocused(){ const g = this.list[this.focus]; if (g) location.hash = '#/game/' + g.id }
  openRandom(){ location.hash = '#/game/' + Rng.pick(this.catalog).id }
  renderChips(){
    const all = [...new Set(this.catalog.map(g => g.genre))];
    this.genres = ['all', ...all.filter(g => g === 'multi'), ...all.filter(g => g !== 'multi')];   // Multiplayer comes first
    this.$('chips').innerHTML = this.genres.map(g => `<button class="ps-tab ${g === this.genre ? 'on' : ''}" data-g="${g}">${t('genre.' + g)}</button>`).join('');
  }
  renderGrid(){
    const q = this.$('search').value.trim().toLowerCase();
    const list = this.list = this.catalog.filter(g => (this.genre === 'all' || g.genre === this.genre)
      && (gameTitle(g) + gameDesc(g) + t('genre.' + g.genre)).toLowerCase().includes(q));
    this.$('gridTitle').textContent = this.genre === 'all' ? t('hub.allGames') : t('genre.' + this.genre);
    this.$('grid').innerHTML = list.length ? list.map((g, i) =>
      `<button class="tile" data-i="${i}" tabindex="-1" aria-label="${gameTitle(g)}"><div class="thumb">${g.GameClass.thumb()}</div><span class="tile-name">${gameTitle(g)}</span></button>`).join('')
      : `<div class="empty">${t('hub.noMatch')}</div>`;
    this.focus = -1;
    this.setFocus(Math.max(0, list.findIndex(g => g.id === this.lastId)), true, true);
  }
  /** Highlights tile i, fills the details panel, swaps the blurred backdrop and (optionally) slides the row to it. */
  setFocus(i, scroll = true, instant = false){
    const list = this.list, info = this.$('info');
    if (!list.length){ this.focus = -1; info.innerHTML = ''; this.$('psBg').querySelectorAll('.ps-art').forEach(a => a.remove()); return }
    i = Math.max(0, Math.min(list.length - 1, i));
    if (i === this.focus) return;
    this.focus = i;
    const g = list[i], tiles = this.$('grid').querySelectorAll('.tile');
    this.lastId = g.id;
    tiles.forEach((el, n) => { el.classList.toggle('on', n === i); el.setAttribute('aria-current', n === i) });
    const summary = g.GameClass.hasSave(this.store, g.id) ? g.GameClass.summary(this.store, g.id) : '';
    info.innerHTML = `<span class="ps-genre">${t('genre.' + g.genre)}</span><h2 class="ps-title">${gameTitle(g)}</h2>
      <p class="ps-desc">${gameDesc(g)}</p><div class="ps-meta">${summary || t('hub.new')}</div>
      <div class="ps-actions"><button class="ps-play" data-act="play">▶ ${t('hub.play')}</button><button class="ps-ghost" data-act="random">${t('hub.random')}</button></div>`;
    const bg = this.$('psBg'), art = document.createElement('div');
    art.className = 'ps-art'; art.innerHTML = g.GameClass.thumb(); bg.appendChild(art);
    requestAnimationFrame(() => art.classList.add('in'));
    [...bg.querySelectorAll('.ps-art')].slice(0, -1).forEach(old => { old.classList.remove('in'); setTimeout(() => old.remove(), 650) });
    if (scroll){
      const row = this.$('grid'), tile = tiles[i];
      row.scrollTo({ left: Math.max(0, tile.offsetLeft - 56), behavior: instant ? 'auto' : 'smooth' });
    }
  }
  renderStats(){
    const saved = this.catalog.filter(g => g.GameClass.hasSave(this.store, g.id));
    const orphans = this.store.ids().filter(id => !this.catalog.some(g => g.id === id));
    const bytes = saved.reduce((s, g) => s + g.GameClass.saveBytes(this.store, g.id), 0) + orphans.reduce((s, id) => s + (this.store.info(id)?.bytes || 0), 0);
    this.$('sGames').textContent = this.catalog.length;
    this.$('sSaved').textContent = saved.length + orphans.length;
    this.$('sSize').textContent = Fmt.bytes(bytes);
  }
}

new Hub(new SaveStore(), CATALOG).init(); /*BOOT*/
</script>
