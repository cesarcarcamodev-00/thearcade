<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   STYLES
   1. Tokens       4. Components      7. Scratch Lotto
   2. Base         5. Hub             8. Dice Pit
   3. Layout       6. Game shell      9. Dig Pit      10. Responsive
   ===================================================================== */

/* 1. Tokens ---------------------------------------------------------- */
:root{
  --bg:#111111; --surface:#181818; --surface-hover:#202020; --line:#2a2a2a;
  --text:#f2f2f2; --muted:#8a8a8a; --accent:#5b8cff; --good:#34d399; --bad:#f87171;
  --radius:12px; --radius-sm:8px;
  --display:Fredoka, "Trebuchet MS", ui-rounded, system-ui, sans-serif;
}
:root[data-theme="light"]{
  --bg:#fafafa; --surface:#ffffff; --surface-hover:#f3f3f3; --line:#e6e6e6; --text:#161616; --muted:#6f6f6f;
}

/* 2. Base ------------------------------------------------------------ */
*{box-sizing:border-box;margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3{letter-spacing:-.02em}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 3. Layout ---------------------------------------------------------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.spacer{flex:1}
.view{display:none}
.view.active{display:block}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:12px;height:62px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.85rem;text-align:center;margin-top:40px}

/* 4. Components ------------------------------------------------------ */
.btn{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:var(--radius-sm);font-weight:500;font-size:.9rem;transition:background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){background:var(--surface-hover)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent);opacity:.9}
.btn.danger{color:var(--bad)}
.btn.big{padding:12px 22px;font-size:1rem}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 14px;font-size:.85rem;color:var(--muted);transition:.15s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{padding:2px 8px;border-radius:6px;background:var(--line);color:var(--muted);font-size:.78rem}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--surface);border:1px solid var(--line);padding:10px 18px;border-radius:var(--radius-sm);transition:transform .25s;z-index:99;font-weight:500}
#toast.show{transform:translate(-50%,0)}

/* 5. Hub ------------------------------------------------------------- */
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;background:none;border:0}
.logo i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;background:var(--accent);font-size:.95rem}
.hero{padding:48px 0 24px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;font-weight:800}
.hero h1 span{color:var(--muted)}
.hero p{color:var(--muted);margin:14px 0 22px;max-width:48ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat b{display:block;font-size:1.6rem;letter-spacing:-.03em}
.stat small{color:var(--muted);font-size:.8rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 16px}
.search{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:14px 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--accent);background:var(--surface-hover)}
.thumb{height:140px;overflow:hidden}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-body h3{font-size:1.05rem}
.card-body p{color:var(--muted);font-size:.88rem;flex:1}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);gap:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
.game-head{display:flex;align-items:center;gap:14px;padding:20px 0 14px;flex-wrap:wrap}
.game-head h1{font-size:1.4rem}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:24px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.saves{margin:16px 0;display:grid;gap:8px;max-height:260px;overflow:auto}
.save-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;font-size:.9rem}
.save-row small{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* hub thumbnails (game art previews) */
.th{width:100%;height:100%;display:grid;place-items:center;position:relative}
.th-scratch{background:#2a1052 repeating-conic-gradient(from 0deg at 50% 110%,rgba(255,255,255,.06) 0 6deg,transparent 6deg 12deg)}
.th-ticket{background:#fff8e7;border-radius:10px;padding:10px 12px;display:flex;gap:6px;transform:rotate(-5deg);border-top:12px solid #f0b429}
.th-ticket svg{width:38px;height:38px}
.th-dice{background:#1d6b45 radial-gradient(ellipse at center,#24804f 0,#1a5e3d 75%);gap:14px;grid-auto-flow:column;place-content:center}
.th-dice .die{width:52px;height:52px;padding:8px;border-radius:12px}
.th-dice .die:first-child{transform:rotate(-12deg)}
.th-dice .die:last-child{transform:rotate(9deg) translateY(8px)}
.th-dig{background:linear-gradient(#8fd3ff 0 34%,#5cbf4a 34% 40%,#9a6a3a 40% 62%,#7a4e2b 62% 82%,#5d5560 82%)}
.th-dig svg{width:70px;height:70px;transform:translateY(14px)}

/* 6. Game shell (themed by .g-<game>) -------------------------------- */
.g{
  --g-bg:#222; --g-surface:#2c2c2c; --g-shade:#111; --g-ink:#fff; --g-muted:#aaa; --g-line:rgba(255,255,255,.12);
  --g-accent:#5b8cff; --g-accent-ink:#fff; --g-accent-shadow:#3355aa; --g-good:#5cf08f; --g-bad:#ff5f7e;
  position:relative;border-radius:22px;padding:20px;background:var(--g-bg);color:var(--g-ink);
  font-family:var(--display);min-height:560px;overflow:hidden;margin-bottom:10px
}
.g b,.g strong{font-weight:700}
.g-muted{color:var(--g-muted)}
.g-btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:14px;padding:11px 20px;
  background:var(--g-accent);color:var(--g-accent-ink);box-shadow:0 5px 0 var(--g-accent-shadow);transition:transform .08s,box-shadow .08s,filter .15s;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15}
.g-btn:hover:not(:disabled){filter:brightness(1.08)}
.g-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--g-accent-shadow)}
.g-btn:disabled{opacity:.45}
.g-btn.alt{background:var(--g-surface);color:var(--g-ink);box-shadow:0 5px 0 var(--g-shade)}
.g-btn.alt:active:not(:disabled){box-shadow:0 2px 0 var(--g-shade)}
.g-btn.big{font-size:1.15rem;padding:14px 28px}
.g-btn.sm{font-size:.75rem;padding:7px 12px;border-radius:10px;box-shadow:0 3px 0 var(--g-shade)}
.g-btn small{font-size:.7rem;opacity:.8;text-transform:none;letter-spacing:0;font-weight:600}
.g-btn svg{width:18px;height:18px}
.g-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.g-panel{background:var(--g-surface);border-radius:18px;padding:16px;box-shadow:0 6px 0 var(--g-shade)}
.g-pop{position:absolute;left:50%;top:30%;z-index:8;font-size:1.7rem;font-weight:700;color:var(--g-good);white-space:nowrap;pointer-events:none;
  text-shadow:0 3px 0 rgba(0,0,0,.45);animation:floatUp 1.3s ease-out forwards;display:flex;align-items:center;gap:6px}
.g-pop svg{width:30px;height:30px}
.g-pop.dim{color:var(--g-muted);font-size:1.2rem}
@keyframes floatUp{0%{transform:translate(-50%,10px) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{transform:translate(-50%,-70px);opacity:0}}
@keyframes stamp{from{transform:scale(2.3) rotate(-10deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
@keyframes deal{from{transform:translateY(50px) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* HUD */
.g-hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.g-round{background:var(--g-ink);color:var(--g-bg);border-radius:14px;padding:6px 14px;text-align:center;line-height:1}
.g-round small{display:block;font-size:.62rem;letter-spacing:.15em;font-weight:700;opacity:.75}
.g-round b{font-size:1.7rem}
.g-meter{flex:1;min-width:200px}
.g-meter-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--g-muted);margin-bottom:4px;font-weight:600}
.g-meter-top b{color:var(--g-ink);font-size:1.15rem}
.g-track{height:18px;border-radius:10px;background:rgba(0,0,0,.35);overflow:hidden}
.g-track i{display:block;height:100%;background:var(--g-accent);border-radius:10px;transition:width .5s cubic-bezier(.2,1.2,.4,1)}
.g-track.done i{background:var(--g-good)}
.g-res{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:14px;padding:6px 14px 6px 8px;font-size:1.25rem;font-weight:700;line-height:1}
.g-res svg{width:30px;height:30px}
.g-res small{display:block;font-size:.6rem;letter-spacing:.12em;color:var(--g-muted);text-transform:uppercase;margin-bottom:2px}
.g-relics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.g-relic{width:40px;height:40px;border-radius:12px;background:var(--g-surface);box-shadow:0 3px 0 var(--g-shade);display:grid;place-items:center;font-size:1.25rem;position:relative;cursor:help}
.g-relic b{position:absolute;right:-6px;bottom:-6px;background:var(--g-accent);color:var(--g-accent-ink);font-size:.65rem;border-radius:8px;padding:0 5px;line-height:16px}

/* Title / perk shop */
.g-title{display:grid;gap:20px;justify-items:center;text-align:center;padding:16px 0}
.g-tag{color:var(--g-muted);max-width:60ch;font-size:1.02rem;font-weight:500}
.g-tag b{color:var(--g-ink)}
.g-badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.g-badge{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:12px;padding:7px 14px;font-size:.9rem;font-weight:600}
.g-badge svg{width:20px;height:20px}
.g-badge b{font-size:1.1rem}
.g-shop{width:100%;text-align:left;margin-top:6px}
.g-shop h3{font-size:1.15rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.g-shop h3 svg{width:22px;height:22px}
.g-shop h3 span{font-size:.85rem;color:var(--g-muted);font-weight:500}
.g-perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.g-perk{background:var(--g-surface);box-shadow:0 5px 0 var(--g-shade);border-radius:16px;padding:14px;display:grid;gap:10px;grid-template-columns:46px 1fr;align-items:center}
.g-perk .ico{width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.28);display:grid;place-items:center;font-size:1.5rem}
.g-perk p{grid-column:1/-1;color:var(--g-muted);font-size:.85rem;font-weight:500;line-height:1.35}
.g-perk .g-btn{grid-column:1/-1;flex-direction:row}
.g-dots{display:flex;gap:4px;margin-top:4px}
.g-dots i{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.4)}
.g-dots i.on{background:var(--g-accent)}
.g-dots i.next{background:var(--g-good);animation:pop .6s ease-in-out infinite alternate}

/* Upgrade cards */
.g-pick{display:grid;gap:14px;justify-items:center;text-align:center;padding:6px 0 24px}
.g-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.g-card{width:200px;border:0;padding:0;border-radius:18px;background:var(--g-surface);color:var(--g-ink);box-shadow:0 8px 0 var(--g-shade);overflow:hidden;
  text-align:center;animation:deal .5s both;animation-delay:calc(var(--i) * .1s);transition:transform .15s;font-family:var(--display)}
.g-card:hover{transform:translateY(-10px) rotate(-2deg)}
.g-card-art{height:130px;display:grid;place-items:center;background:var(--c);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 10px,transparent 10px 20px)}
.g-card-art span{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:2.6rem;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.g-card-body{padding:14px;display:grid;gap:6px;justify-items:center}
.g-card-body b{font-size:1.2rem}
.g-card-body p{font-size:.85rem;color:var(--g-muted);min-height:2.6em;font-weight:500;line-height:1.3}

/* Banners */
.g-banner{display:grid;gap:16px;justify-items:center;text-align:center;padding:40px 20px}
.g-stamp{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:700;line-height:1;animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.g-stamp.ok{color:var(--g-good)}
.g-stamp.bad{color:var(--g-bad)}
.g-stamp.neutral{color:var(--g-accent);font-size:clamp(1.8rem,5vw,2.6rem)}
.g-big{font-size:2.2rem;font-weight:700}
.g-big span{font-size:1.2rem;color:var(--g-muted)}
.g-newbest{background:var(--g-good);color:#06321a;font-weight:700;border-radius:10px;padding:4px 14px;letter-spacing:.1em;animation:pop .5s .3s both}
.g-bigstar{width:110px;height:110px;animation:pop .6s both}

/* 7. Scratch Lotto --------------------------------------------------- */
.g-scratch{
  --g-bg:#2a1052; --g-surface:#3d1a78; --g-shade:#170630; --g-ink:#fff; --g-muted:#cdb8f5; --g-line:rgba(255,255,255,.14);
  --g-accent:#ffcc33; --g-accent-ink:#3a1a00; --g-accent-shadow:#c98a00; --g-good:#5cf08f; --g-bad:#ff6b8a;
  background:#2a1052 repeating-conic-gradient(from 0deg at 50% -10%,rgba(255,255,255,.045) 0 6deg,transparent 6deg 12deg)
}
.logo-text{font-size:clamp(2.6rem,8vw,4.4rem);font-weight:700;line-height:.95;letter-spacing:.01em}
.sc-logo{display:grid;justify-items:center;gap:6px}
.sc-logo .logo-text{color:#ffcc33;text-shadow:0 4px 0 #e8344e,0 9px 0 #170630;transform:rotate(-3deg)}
.sc-logo .logo-text span{color:#fff}
.sc-logo-syms{display:flex;gap:4px}
.sc-logo-syms svg{width:54px;height:54px;animation:pop .5s both}
.sc-logo-syms svg:nth-child(2){animation-delay:.1s;transform:translateY(-8px)}
.sc-logo-syms svg:nth-child(3){animation-delay:.2s}
.sc-play{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.sc-stage{display:grid;justify-items:center;gap:16px;padding:6px 0 10px;position:relative}
.sc-msg{font-size:1.35rem;font-weight:700;min-height:1.6em;text-align:center}
.sc-msg.win{color:var(--g-accent)}
.sc-msg.lose{color:var(--g-muted)}
.ticket{--tc:#d4823b;--tc2:#8a4f1c;width:min(400px,100%);background:#fff8e7;color:#2a1052;border-radius:16px;position:relative;
  box-shadow:0 10px 0 rgba(0,0,0,.3);transform:rotate(-1.2deg);animation:deal .45s both}
.ticket::before,.ticket::after{content:"";position:absolute;top:96px;width:24px;height:24px;border-radius:50%;background:var(--g-bg);z-index:2}
.ticket::before{left:-12px}
.ticket::after{right:-12px}
.tier-bronze{--tc:#d4823b;--tc2:#8a4f1c}
.tier-silver{--tc:#7f95ad;--tc2:#40516a}
.tier-gold{--tc:#f0b429;--tc2:#8f6200}
.ticket-head{background:var(--tc);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:16px 16px 0 0;
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px)}
.ticket-head small{display:block;font-size:.7rem;letter-spacing:.2em;opacity:.9}
.ticket-head b{font-size:1.7rem;line-height:1;text-shadow:0 3px 0 var(--tc2)}
.ticket-price{background:#fff;color:var(--tc2);border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;
  transform:rotate(12deg);border:3px dashed var(--tc);line-height:1;text-align:center}
.ticket-price small{font-size:.55rem;letter-spacing:.1em;display:block}
.ticket-sub{text-align:center;font-weight:700;font-size:.8rem;letter-spacing:.2em;color:var(--tc2);padding:14px 0 4px}
.spots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 22px 16px}
.spot{aspect-ratio:1;position:relative;border-radius:14px;background:#fff;border:2px dashed rgba(42,16,82,.18);display:grid;place-items:center;overflow:hidden;transition:opacity .3s}
.spot svg.sym{width:74%;height:74%}
.spot canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .35s}
.spot canvas:active{cursor:grabbing}
.spot.open canvas{opacity:0;pointer-events:none}
.spot.open svg.sym{animation:pop .35s ease-out}
.spot.win{border:3px solid #ffcc33;background:#fff1b8;animation:glow .8s ease-in-out infinite alternate}
.spot.lose{opacity:.4}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,204,51,0)}to{box-shadow:0 0 0 7px rgba(255,204,51,.5)}}
.ticket-foot{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed rgba(42,16,82,.18);margin:0 16px;padding:10px 4px 14px;
  font-size:.72rem;color:rgba(42,16,82,.6);letter-spacing:.12em;font-weight:600}
.barcode{width:120px;height:24px;background:repeating-linear-gradient(90deg,#2a1052 0 2px,transparent 2px 4px,#2a1052 4px 5px,transparent 5px 8px,#2a1052 8px 11px,transparent 11px 13px)}
.ticket-stamp{position:absolute;left:50%;top:52%;z-index:3;font-size:2.4rem;font-weight:700;padding:4px 18px;border:5px solid;border-radius:14px;
  transform:translate(-50%,-50%) rotate(-12deg);animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none;background:rgba(255,248,231,.85)}
.ticket-stamp.win{color:#16a34a}
.ticket-stamp.lose{color:#9a8fb0;font-size:1.8rem}
@keyframes stampIn{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.ticket-empty{width:min(400px,100%);aspect-ratio:1.15;border:4px dashed var(--g-line);border-radius:18px;display:grid;place-items:center;color:var(--g-muted);text-align:center;padding:24px;font-size:1.1rem;font-weight:600}
.ticket-empty svg{width:70px;height:70px;opacity:.6;display:block;margin:0 auto 10px}
.booth{display:grid;gap:16px}
.booth h3{font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--g-muted)}
.stubs{display:grid;gap:12px}
.stub{--tc:#d4823b;--tc2:#8a4f1c;position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:0;padding:12px 20px;
  background:var(--tc);color:#fff;border-radius:12px;box-shadow:0 5px 0 var(--tc2);transition:transform .1s;font-family:var(--display);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px)}
.stub::before,.stub::after{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--g-surface);transform:translateY(-50%)}
.stub::before{left:-8px}
.stub::after{right:-8px}
.stub:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.stub b{font-size:1.2rem;line-height:1.1;text-shadow:0 2px 0 var(--tc2)}
.stub small{display:block;opacity:.9;font-size:.72rem;letter-spacing:.08em;font-weight:600}
.stub .price{font-size:1.15rem;font-weight:700;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 10px}
.stub:disabled{filter:grayscale(.85);opacity:.45}
.tickets-left{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:30px}
.tickets-left svg{width:30px;height:30px}
.paytable{display:grid;gap:6px}
.paytable div{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:10px;padding:4px 12px 4px 6px;font-weight:600}
.paytable svg{width:30px;height:30px}
.paytable span{color:var(--g-muted);font-size:.8rem}
.paytable b{margin-left:auto;color:var(--g-accent)}

/* 8. Dice Pit -------------------------------------------------------- */
.g-dice{
  --g-bg:#0f3a28; --g-surface:#17503a; --g-shade:#06200f; --g-ink:#fdf6e3; --g-muted:#a7cdb7; --g-line:rgba(255,255,255,.12);
  --g-accent:#e63946; --g-accent-ink:#fff; --g-accent-shadow:#9b1d27; --g-good:#7dff9e; --g-bad:#ff7b7b;
  background:#0f3a28 radial-gradient(circle at 50% 0,#1a5c40 0,transparent 65%)
}
.dp-logo{display:grid;justify-items:center;gap:8px}
.dp-logo .logo-text{color:#fdf6e3;text-shadow:0 4px 0 #e63946,0 9px 0 #06200f}
.dp-logo .logo-text span{color:#ffcc33}
.dp-logo-dice{display:flex;gap:12px}
.dp-logo-dice .die:first-child{transform:rotate(-14deg)}
.dp-logo-dice .die:last-child{transform:rotate(10deg) translateY(6px)}
.dp-play{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start}
.felt{position:relative;background:#1d6b45 radial-gradient(ellipse at center,#25834f 0,#195a3b 78%);border:16px solid #6b3e1f;border-radius:30px;
  box-shadow:inset 0 0 0 3px #8a5329,0 8px 0 #3a210e;padding:30px 18px 24px;display:grid;gap:22px;justify-items:center;min-height:380px;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px),radial-gradient(ellipse at center,#25834f 0,#195a3b 78%);background-size:8px 8px,auto}
.dice-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;min-height:120px;align-items:center;padding-top:6px}
.die{width:78px;height:78px;border-radius:17px;border:0;background:#fdf6e3;box-shadow:0 7px 0 #c9bc97;padding:13px;display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px;position:relative;transition:transform .15s,box-shadow .15s}
.die i{border-radius:50%}
.die i.on{background:#1d1d1d}
.die.v1 i.on{background:#e63946;transform:scale(1.25)}
button.die:not(:disabled):hover{transform:translateY(-4px)}
.die.blank{background:rgba(253,246,227,.1);box-shadow:none;border:3px dashed rgba(253,246,227,.3)}
.die.held{transform:translateY(-16px);box-shadow:0 7px 0 #c9bc97,0 0 0 5px #ffcc33}
button.die.held:hover{transform:translateY(-18px)}
.die.held::after{content:attr(data-held);position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);font-size:.65rem;font-weight:700;letter-spacing:.14em;
  background:#ffcc33;color:#3a2a00;border-radius:6px;padding:2px 7px}
.die.roll{animation:tumble .5s cubic-bezier(.2,1.3,.4,1)}
.die.roll:nth-child(2n){animation-duration:.6s}
.die.roll:nth-child(3n){animation-duration:.45s}
@keyframes tumble{0%{transform:translateY(-60px) rotate(-260deg) scale(.6);opacity:.2}100%{transform:none;opacity:1}}
.plate{display:grid;gap:10px;justify-items:center;min-height:96px}
.hand-name{font-size:1.5rem;font-weight:700;color:#fff}
.hand-name.hint{font-size:1.1rem;color:var(--g-muted);font-weight:600}
.formula{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.dp-chips,.dp-mult{min-width:78px;text-align:center;border-radius:12px;padding:5px 14px;font-size:1.6rem;font-weight:700;color:#fff}
.dp-chips{background:#2f8cff;box-shadow:0 4px 0 #1a5bb0}
.dp-mult{background:#e63946;box-shadow:0 4px 0 #9b1d27}
.formula .x{font-size:1.5rem;font-weight:700;opacity:.8}
.formula .total{font-size:2rem;font-weight:700;color:#ffcc33;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.dp-side{display:grid;gap:16px}
.tok-label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--g-muted);font-weight:700;margin-bottom:6px}
.tokens{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.token{width:30px;height:30px;border-radius:50%;background:#e63946;border:4px dashed #fff;box-shadow:0 3px 0 #9b1d27;transition:opacity .3s}
.token.blue{background:#2f8cff;box-shadow:0 3px 0 #1a5bb0}
.token.used{opacity:.18}
.plaque{background:#6b3e1f;border-radius:16px;box-shadow:inset 0 0 0 3px #8a5329,0 6px 0 #3a210e;padding:14px;display:grid;gap:3px;color:#fdf6e3}
.plaque h3{text-align:center;font-size:.85rem;letter-spacing:.18em;color:#ffcc33;margin-bottom:6px}
.plaque div{display:flex;justify-content:space-between;font-size:.85rem;padding:3px 8px;border-radius:8px;font-weight:600}
.plaque div.hit{background:#ffcc33;color:#3a2a00}
.plaque .c{color:#8cc4ff}
.plaque .m{color:#ff9aa1}
.plaque div.hit .c,.plaque div.hit .m{color:#3a2a00}

/* 9. Dig Pit --------------------------------------------------------- */
.g-dig{
  --g-bg:#2b1d14; --g-surface:#402c1e; --g-shade:#160e08; --g-ink:#fff4e0; --g-muted:#cdb79c; --g-line:rgba(255,240,220,.14);
  --g-accent:#f5b82e; --g-accent-ink:#3a2400; --g-accent-shadow:#a8720a; --g-good:#9af07f; --g-bad:#ff7052;
  background:#2b1d14
}
.dg-logo{display:grid;justify-items:center;gap:4px}
.dg-logo svg{width:96px;height:96px;animation:pop .5s both}
.dg-logo .logo-text{color:#f5b82e;text-shadow:0 4px 0 #8a5329,0 9px 0 #160e08}
.dg-play{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start}
.scene{position:relative;border-radius:20px;overflow-y:auto;overflow-x:hidden;max-height:600px;box-shadow:0 6px 0 var(--g-shade);background:#160e08}
.scene.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.sky{height:130px;background:#8fd3ff;position:relative;overflow:hidden}
.sun{position:absolute;right:34px;top:18px;width:46px;height:46px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 10px rgba(255,210,63,.3)}
.cloud{position:absolute;width:70px;height:20px;background:#fff;border-radius:20px}
.cloud::before{content:"";position:absolute;left:14px;top:-12px;width:30px;height:30px;border-radius:50%;background:#fff}
.grass{position:absolute;left:0;right:0;bottom:0;height:16px;background:#5cbf4a;border-bottom:5px solid #3f9a36}
.headframe{position:absolute;bottom:16px;left:50%;width:120px;height:90px;transform:translateX(-50%);z-index:2}
.headframe svg{width:100%;height:100%}
.rope-top{position:absolute;left:50%;bottom:0;height:78px;width:3px;background:#e2c08a;transform:translateX(-50%);z-index:1}
.miner{width:58px;height:58px;z-index:3}
.miner svg{width:100%;height:100%}
.miner.at-surface{position:absolute;bottom:14px;left:calc(50% + 52px)}
.stratum{height:66px;position:relative;display:flex;align-items:center}
.stratum svg.deco{position:absolute;inset:0;width:100%;height:100%}
.shaft{position:absolute;left:50%;top:0;bottom:0;width:80px;transform:translateX(-50%)}
.stratum.dug .shaft{background:#140b06;box-shadow:inset 6px 0 0 rgba(0,0,0,.4),inset -6px 0 0 rgba(0,0,0,.4)}
.shaft .rope{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#e2c08a;transform:translateX(-50%)}
.shaft .rope.half{bottom:45%}
.shaft .miner{position:absolute;bottom:2px;left:50%;transform:translateX(-50%)}
.shaft .miner.dig svg{animation:bob .35s ease-out}
@keyframes bob{0%{transform:rotate(-12deg) translateY(-4px)}100%{transform:none}}
.depth-label{position:absolute;left:12px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.6)}
.risk{position:absolute;right:12px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:7px;background:#d9b47a;box-shadow:0 3px 0 #7c5a2e}
.risk.low{color:#1f6b2a}
.risk.mid{color:#8a5a00}
.risk.high{color:#a3241a}
.cavein{position:absolute;left:0;right:0;top:0;height:330px;pointer-events:none;z-index:9;overflow:hidden}
.cavein b{position:absolute;left:50%;top:44%;font-size:2.6rem;color:#ff7052;text-shadow:0 4px 0 #160e08;transform:translate(-50%,-50%);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both}
.cavein i{position:absolute;top:-30px;width:24px;height:19px;background:#7a6555;border-radius:40% 55% 45% 50%;animation:fall .9s ease-in forwards}
@keyframes fall{to{transform:translateY(360px) rotate(280deg);opacity:.15}}
.dg-side{display:grid;gap:14px}
.side-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.side-h svg{width:22px;height:22px}
.side-h b{margin-left:auto}
.energy{display:flex;flex-wrap:wrap;gap:5px}
.energy i{width:16px;height:24px;border-radius:5px;background:rgba(0,0,0,.4)}
.energy i.on{background:#ffd23f;box-shadow:inset 0 -5px 0 #e0a21a}
.purse{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.purse div{background:var(--g-surface);box-shadow:0 5px 0 var(--g-shade);border-radius:16px;padding:12px 8px;text-align:center}
.purse svg{width:48px;height:48px}
.purse b{display:block;font-size:1.6rem;line-height:1.1}
.purse small{color:var(--g-muted);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.purse .at-risk b{color:#ffd23f}
.dg-side .g-btn{width:100%}
.journal{background:#f3e3c3;color:#4a3420;border-radius:14px;padding:12px 16px;font-size:.88rem;display:grid;gap:5px;box-shadow:0 5px 0 #a88a5a;font-weight:500;
  background-image:repeating-linear-gradient(transparent 0 23px,rgba(74,52,32,.12) 23px 24px)}
.journal h4{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.journal div:not(:nth-child(2)){opacity:.6}
.journal div:nth-child(2){font-weight:700}

/* 9b. Embedded games ------------------------------------------------ */
[hidden]{display:none!important}
.embed{display:grid;gap:10px;margin-bottom:10px}
.embed-bar{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.embed-bar span{flex:1;min-width:200px}
.embed-frame{width:100%;height:min(880px,calc(100dvh - 180px));min-height:540px;border:1px solid var(--line);border-radius:var(--radius);background:#000;display:block}
.th svg.px{shape-rendering:crispEdges}
.th svg.full{position:absolute;inset:0;width:100%;height:100%}
.th-sm,.th-ss{overflow:hidden}
.th-sm .th-hero{position:relative;width:45px;height:80px;transform:translateY(12px)}
.th-ss .ship{position:relative;width:54px;height:48px;transform:translateY(16px)}
.th-pp{background:#1d5c47;grid-auto-flow:column;place-content:center;gap:6px}
.th-card{width:46px;height:64px;background:#f4ecd8;border:3px solid #000;box-shadow:0 3px 0 #000;display:grid;place-items:center;
  font:700 15px/1 ui-monospace,Consolas,monospace;padding:4px 0}
.th-card svg{width:22px;height:22px}
.th-card:nth-child(1){transform:rotate(-10deg) translateY(4px)}
.th-card:nth-child(3){transform:rotate(10deg) translateY(4px)}

/* 10. Responsive ----------------------------------------------------- */
@media(max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:28px}
  .btn .lbl{display:none}
  .sc-play,.dp-play,.dg-play{grid-template-columns:1fr}
  .g{padding:14px;border-radius:16px}
  .die{width:62px;height:62px;padding:10px;border-radius:14px}
  .felt{border-width:10px;padding:24px 10px 18px}
  .spots{gap:8px;padding:8px 16px 14px}
  .scene{max-height:340px}
  .sky{height:110px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- sound ---------- */
let AC=null,muted=false;
function beep(f,d=.06,type='square',v=.03,slide=0){
 if(muted)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
const vib=n=>{try{navigator.vibrate&&!muted&&navigator.vibrate(n)}catch(e){}};

/* ---------- data ---------- */
const TW={
 arrow:{cost:50,dmg:8,range:62,cd:.5,col:'#c9d1e0',spd:220},
 cannon:{cost:90,dmg:28,range:54,cd:1.5,splash:26,col:'#555566',spd:110},
 frost:{cost:70,dmg:3,range:50,cd:.9,slow:.5,col:'#6ec6ff',spd:170}
};
const EN={
 slime:{hp:26,sp:28,rw:4,r:5,col:'#5be37d'},
 runner:{hp:16,sp:56,rw:5,r:4,col:'#ff9f43'},
 brute:{hp:110,sp:20,rw:12,r:7,col:'#a66bd6'},
 boss:{hp:650,sp:18,rw:50,r:9,col:'#e63946'}
};
const WAVES=[
 [['slime',8,.9]],
 [['slime',8,.8],['runner',6,.6]],
 [['runner',10,.5],['slime',8,.7]],
 [['brute',4,2],['slime',10,.6]],
 [['runner',12,.4],['brute',6,1.6],['boss',1,1]]
];
const WP=[[-1,1],[7,1],[7,4],[1,4],[1,7],[7,7],[7,10],[2,10],[2,12]];
const PATH=WP.map(([x,y])=>[(x+.5)*TS,(y+.5)*TS]);
const CUM=[0];for(let i=1;i<PATH.length;i++)CUM.push(CUM[i-1]+Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]));
const PLEN=CUM[CUM.length-1];
const blocked=Array.from({length:ROWS},()=>Array(COLS).fill(false));
for(let i=1;i<WP.length;i++){
 const [x0,y0]=WP[i-1],[x1,y1]=WP[i];
 for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
  if(x>=0&&x<COLS&&y>=0&&y<ROWS)blocked[y][x]=true;
}
function posAt(d){
 let i=1;while(i<CUM.length-1&&CUM[i]<d)i++;
 const f=(d-CUM[i-1])/(CUM[i]-CUM[i-1]);
 return[PATH[i-1][0]+(PATH[i][0]-PATH[i-1][0])*f,PATH[i-1][1]+(PATH[i][1]-PATH[i-1][1])*f];
}

/* ---------- upgrade cards (random, buffs and curses) ---------- */
const CARDS=[
 {id:'dmg',w:3,gen:()=>{const v=ri(10,25);return{a:[v],ap:()=>M.dmg*=1+v/100}}},
 {id:'range',w:3,gen:()=>{const v=ri(8,18);return{a:[v],ap:()=>M.range*=1+v/100}}},
 {id:'rate',w:3,gen:()=>{const v=ri(10,25);return{a:[v],ap:()=>M.rate*=1+v/100}}},
 {id:'gold',w:3,gen:()=>{const v=ri(40,90);return{a:[v],ap:()=>S.gold+=v}}},
 {id:'life',w:2,gen:()=>{const v=ri(1,2);return{a:[v],ap:()=>S.lives+=v}}},
 {id:'splash',w:2,gen:()=>{const v=ri(20,40);return{a:[v],ap:()=>M.splash*=1+v/100}}},
 {id:'slow',w:2,gen:()=>{const v=ri(10,20);return{a:[v],ap:()=>M.slow+=v/100}}},
 {id:'int',w:2,gen:()=>{const v=ri(5,10);return{a:[v],ap:()=>M.interest+=v/100}}},
 {id:'cu1',w:1.4,curse:1,gen:()=>{const v=ri(30,50),h=ri(15,25);return{a:[v,h],ap:()=>{M.dmg*=1+v/100;M.hp*=1+h/100}}}},
 {id:'cu2',w:1.4,curse:1,gen:()=>{const v=ri(30,45),c=ri(20,30);return{a:[v,c],ap:()=>{M.rate*=1+v/100;M.cost*=1+c/100}}}},
 {id:'cu3',w:1.4,curse:1,gen:()=>{const v=ri(120,200),l=2;return{a:[v,l],ap:()=>{S.gold+=v;S.lives=Math.max(1,S.lives-l)}}}}
];
function rollCards(){
 const out=[],pool=CARDS.slice();
 while(out.length<3){
  const tot=pool.reduce((a,c)=>a+c.w,0);let r=Math.random()*tot,i=0;
  for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}
  const c=pool.splice(Math.min(i,pool.length-1),1)[0];
  out.push(Object.assign({id:c.id,curse:c.curse},c.gen()));
 }
 return out;
}

/* ---------- state ---------- */
let clearT=0,S,M,state='title',enemies,towers,projs,parts,queue,spawnT,sel,build,speed=1,tick=0;
function resetGame(){
 S={gold:160,lives:10,wave:0,kills:0,ups:[]};
 M={dmg:1,range:1,rate:1,hp:1,cost:1,splash:1,slow:0,interest:0};
 enemies=[];towers=[];projs=[];parts=[];queue=[];spawnT=0;sel=null;build='arrow';speed=1;
 state='build';
}
const tcost=ty=>Math.round(TW[ty].cost*M.cost);
const upCost=tw=>Math.round(TW[tw.type].cost*(tw.lv===1?.7:1.1)*M.cost);
function stat(tw){
 const b=TW[tw.type],l=tw.lv-1;
 return{dmg:b.dmg*(1+.6*l)*M.dmg,range:b.range*(1+.08*l)*M.range,cd:b.cd*(1-.08*l)/M.rate,
  splash:(b.splash||0)*M.splash,slow:Math.min(.85,(b.slow||0)+M.slow)};
}
function toast(msg){const e=$('#toast');e.textContent=msg;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',1100)}

/* ---------- waves ---------- */
function startWave(){
 if(state!=='build')return;
 const w=WAVES[S.wave];queue=[];
 w.forEach(([ty,n,iv])=>{for(let i=0;i<n;i++)queue.push({ty,dt:i===0&&queue.length?1.2:iv})});
 spawnT=.5;S.wave++;state='wave';sel=null;beep(300,.2,'triangle',.05,300);renderBar();renderHud();
}
function spawn(ty){
 const e=EN[ty];
 const hp=e.hp*M.hp*(1+1.6*(S.wave-1));
 enemies.push({ty,hp,max:hp,d:0,slowT:0,slowA:0,dead:0,ph:Math.random()*6});
}
function waveClear(){
 const bonus=25+S.wave*5,inter=Math.min(60,Math.floor(S.gold*M.interest));
 S.gold+=bonus+inter;beep(660,.15,'triangle',.05);beep(880,.25,'triangle',.05);
 if(S.wave>=WAVES.length){state='win';showWin();return}
 state='pick';showPick(bonus+inter);
}

/* ---------- update ---------- */
function damage(e,d){
 if(e.dead)return;e.hp-=d;
 if(e.hp<=0){
  e.dead=1;S.kills++;S.gold+=EN[e.ty].rw;
  const [x,y]=posAt(e.d);for(let i=0;i<8;i++)parts.push({x,y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,life:.35,col:EN[e.ty].col});
  parts.push({x:x-4,y:y-8,vx:0,vy:-25,life:.6,txt:'+'+EN[e.ty].rw,col:'#ffcf3f'});
  beep(160,.08,'square',.03,-60);renderHud();
 }
}
function hit(p,x,y){
 if(p.splash>0){
  for(const e of enemies){if(e.dead)continue;const [ex,ey]=posAt(e.d);if(Math.hypot(ex-x,ey-y)<=p.splash+EN[e.ty].r)damage(e,p.dmg)}
  for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-.5)*110,vy:(Math.random()-.5)*110,life:.3,col:'#ffb347'});
  beep(90,.15,'sawtooth',.05,-30);
 }else{
  if(p.slow>0&&p.tgt&&!p.tgt.dead){p.tgt.slowT=1.6;p.tgt.slowA=p.slow}
  if(p.tgt)damage(p.tgt,p.dmg);
 }
}
function update(dt){
 tick+=dt;
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);
 if(state==='clearing'){clearT-=dt;if(clearT<=0)waveClear();return}
 if(state!=='wave')return;
 // spawn
 if(queue.length){spawnT-=dt;while(queue.length&&spawnT<=0){const q=queue.shift();spawn(q.ty);spawnT+=queue.length?queue[0].dt:0}}
 // enemies
 for(const e of enemies){
  if(e.dead)continue;
  if(e.slowT>0)e.slowT-=dt;
  e.d+=EN[e.ty].sp*(e.slowT>0?1-e.slowA:1)*dt;
  if(e.d>=PLEN){
   e.dead=1;S.lives-=e.ty==='boss'?3:1;beep(110,.25,'sawtooth',.06,-50);vib(40);renderHud();
   if(S.lives<=0){S.lives=0;state='over';renderHud();showOver();return}
  }
 }
 enemies=enemies.filter(e=>!e.dead);
 // towers
 for(const tw of towers){
  tw.cd-=dt;const st=stat(tw),cx=(tw.x+.5)*TS,cy=(tw.y+.5)*TS;
  let best=null,bd=-1;
  for(const e of enemies){const [ex,ey]=posAt(e.d);if(Math.hypot(ex-cx,ey-cy)<=st.range&&e.d>bd){bd=e.d;best=e}}
  if(best){
   const [ex,ey]=posAt(best.d);tw.ang=Math.atan2(ey-cy,ex-cx);
   if(tw.cd<=0){
    tw.cd=st.cd;
    projs.push({x:cx,y:cy,tgt:best,lx:ex,ly:ey,dmg:st.dmg,splash:st.splash,slow:TW[tw.type].slow?st.slow:0,spd:TW[tw.type].spd,ty:tw.type});
    beep(tw.type==='cannon'?110:tw.type==='frost'?600:420,.04,'square',.015);
   }
  }
 }
 // projectiles
 for(const p of projs){
  if(p.tgt&&!p.tgt.dead){const [ex,ey]=posAt(p.tgt.d);p.lx=ex;p.ly=ey}
  const dx=p.lx-p.x,dy=p.ly-p.y,dist=Math.hypot(dx,dy),step=p.spd*dt;
  if(dist<=step+2){p.done=1;hit(p,p.lx,p.ly)}else{p.x+=dx/dist*step;p.y+=dy/dist*step}
 }
 projs=projs.filter(p=>!p.done);
 if(state==='wave'&&!queue.length&&!enemies.length){state='clearing';clearT=.4}
}

/* ---------- rendering ---------- */
const BG=document.createElement('canvas');BG.width=VW;BG.height=VH;
(function(){
 const g=BG.getContext('2d');let s=11;const r=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  if(blocked[y][x]){
   g.fillStyle='#b58a56';g.fillRect(x*TS,y*TS,TS,TS);
   g.fillStyle='#a37a49';for(let i=0;i<5;i++)g.fillRect(x*TS+ri(1,16),y*TS+ri(1,16),3,2);
  }else{
   g.fillStyle=(x+y)%2?'#3f8f4f':'#3b8749';g.fillRect(x*TS,y*TS,TS,TS);
   if(r()<.25){g.fillStyle=r()<.5?'#ffd86b':'#ff9fb2';g.fillRect(x*TS+ri(3,15),y*TS+ri(3,15),2,2)}
   else if(r()<.3){g.fillStyle='#2f7a3f';g.fillRect(x*TS+ri(2,14),y*TS+ri(2,14),2,3)}
  }
 }
 // path borders
 g.fillStyle='#7a5a34';
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(blocked[y][x]){
  if(y>0&&!blocked[y-1][x])g.fillRect(x*TS,y*TS,TS,2);
  if(y<ROWS-1&&!blocked[y+1][x])g.fillRect(x*TS,y*TS+TS-2,TS,2);
  if(x>0&&!blocked[y][x-1])g.fillRect(x*TS,y*TS,2,TS);
  if(x<COLS-1&&!blocked[y][x+1])g.fillRect(x*TS+TS-2,y*TS,2,TS);
 }
 // base marker at the exit
 g.fillStyle='#e63946';g.fillRect(2*TS+2,VH-8,TS-4,8);g.fillStyle='#fff';g.fillRect(2*TS+6,VH-6,TS-12,4);
})();

function drawTower(tw,hl){
 const cx=Math.round((tw.x+.5)*TS),cy=Math.round((tw.y+.5)*TS),b=TW[tw.type];
 ctx.fillStyle='#000';ctx.fillRect(cx-9,cy-9,18,18);
 ctx.fillStyle='#6b6b80';ctx.fillRect(cx-8,cy-8,16,16);
 ctx.fillStyle=b.col;ctx.fillRect(cx-6,cy-6,12,12);
 ctx.save();ctx.translate(cx,cy);ctx.rotate(tw.ang||0);
 ctx.fillStyle=tw.type==='cannon'?'#222':tw.type==='frost'?'#fff':'#5a3a1a';
 ctx.fillRect(0,-2,tw.type==='cannon'?10:8,tw.type==='cannon'?4:3);
 ctx.restore();
 ctx.fillStyle='#ffcf3f';for(let i=0;i<tw.lv;i++)ctx.fillRect(cx-7+i*5,cy+6,3,2);
 if(hl){ctx.strokeStyle='#ffcf3f';ctx.lineWidth=1;ctx.strokeRect(cx-9.5,cy-9.5,19,19)}
}
function drawEnemy(e){
 const [x,y]=posAt(e.d),E=EN[e.ty],r=E.r,bob=Math.sin(tick*8+e.ph)*1;
 const X=Math.round(x),Y=Math.round(y+bob);
 ctx.fillStyle='#0006';ctx.fillRect(X-r,Y+r-1,r*2,2);
 ctx.fillStyle='#000';ctx.fillRect(X-r-1,Y-r-1,r*2+2,r*2+2);
 ctx.fillStyle=e.slowT>0?'#9fd8ff':E.col;ctx.fillRect(X-r,Y-r,r*2,r*2);
 ctx.fillStyle='#fff';ctx.fillRect(X-r+2,Y-r+2,2,2);ctx.fillRect(X+r-4,Y-r+2,2,2);
 ctx.fillStyle='#000';ctx.fillRect(X-r+3,Y-r+3,1,1);ctx.fillRect(X+r-3,Y-r+3,1,1);
 if(e.ty==='boss'){ctx.fillStyle='#ffcf3f';ctx.fillRect(X-r+1,Y-r-3,r*2-2,2);ctx.fillRect(X-r+1,Y-r-5,2,2);ctx.fillRect(X+r-3,Y-r-5,2,2)}
 if(e.hp<e.max){ctx.fillStyle='#000';ctx.fillRect(X-r,Y-r-4,r*2,3);ctx.fillStyle='#ff4d5e';ctx.fillRect(X-r+1,Y-r-3,Math.max(0,(r*2-2)*e.hp/e.max),1)}
}
function render(){
 ctx.drawImage(BG,0,0);
 if(sel){const tw=sel,st=stat(tw),cx=(tw.x+.5)*TS,cy=(tw.y+.5)*TS;
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(cx,cy,st.range,0,6.3);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.stroke()}
 towers.forEach(tw=>drawTower(tw,tw===sel));
 enemies.forEach(drawEnemy);
 for(const p of projs){
  ctx.fillStyle=p.ty==='cannon'?'#222':p.ty==='frost'?'#cfefff':'#fff';
  const s=p.ty==='cannon'?4:2;ctx.fillRect(Math.round(p.x)-s/2,Math.round(p.y)-s/2,s,s);
 }
 for(const q of parts){
  if(q.txt){ctx.font='7px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(q.txt,Math.round(q.x)+1,Math.round(q.y)+1);ctx.fillStyle=q.col;ctx.fillText(q.txt,Math.round(q.x),Math.round(q.y))}
  else{ctx.fillStyle=q.col;ctx.fillRect(Math.round(q.x),Math.round(q.y),2,2)}
 }
}

/* ---------- UI ---------- */
function renderHud(){
 $('#lives').innerHTML=`${t('lives')}<b>${S.lives}</b>`;
 $('#gold').innerHTML=`${t('gold')}<b>$${S.gold}</b>`;
 $('#wave').innerHTML=`${t('wave')}<b>${Math.max(1,Math.min(S.wave+(state==='build'||state==='pick'?(state==='build'?1:0):0),5))}/5</b>`;
}
function renderBar(){
 const bar=$('#bar');
 if(state==='title'||state==='over'||state==='win'){bar.innerHTML='';return}
 let top;
 if(sel){
  const tw=sel,max=tw.lv>=3,uc=upCost(tw),val=Math.floor(tw.inv*.6);
  top=`<div class="row"><div class="info">${t('tw_'+tw.type)} - ${t('lvl',tw.lv)}</div></div>
   <div class="row"><button class="btn gold" id="bup" ${max||S.gold<uc?'disabled':''}>${max?t('maxlv'):t('up',uc)}</button>
   <button class="btn red" id="bsell">${t('sell',val)}</button><button class="btn" id="bx">X</button></div>`;
 }else{
  top=`<div class="row">${['arrow','cannon','frost'].map(ty=>`<button class="tb ${build===ty?'sel':''} ${S.gold<tcost(ty)?'no':''}" data-t="${ty}">
   <i style="background:${TW[ty].col}"></i>${t('tw_'+ty)}<br><span style="color:var(--gold)">$${tcost(ty)}</span></button>`).join('')}</div>`;
 }
 const canGo=state==='build';
 bar.innerHTML=top+`<div class="row"><button class="btn green" id="bgo" ${canGo?'':'disabled'} style="flex:2">${t('go')}</button>
  <button class="btn" id="bsp">${t('x2',speed)}</button><button class="btn" id="bups">${t('ups')}</button></div>`;
 bar.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{build=b.dataset.t;beep(500,.04);renderBar()});
 const g=id=>bar.querySelector(id);
 if(g('#bup'))g('#bup').onclick=()=>{
  const tw=sel,c=upCost(tw);if(S.gold<c||tw.lv>=3)return;
  S.gold-=c;tw.inv+=c;tw.lv++;beep(700,.12,'triangle',.04,300);renderHud();renderBar();
 };
 if(g('#bsell'))g('#bsell').onclick=()=>{
  S.gold+=Math.floor(sel.inv*.6);towers=towers.filter(x=>x!==sel);sel=null;beep(250,.1);renderHud();renderBar();
 };
 if(g('#bx'))g('#bx').onclick=()=>{sel=null;renderBar()};
 g('#bgo').onclick=startWave;
 g('#bsp').onclick=()=>{speed=speed===1?2:1;renderBar()};
 g('#bups').onclick=showUps;
}
function show(html){$('#ov').innerHTML=`<div class="modal">${html}</div>`;$('#ov').style.display='flex'}
function hide(){$('#ov').style.display='none';cur=null}
let cur=null;
function showTitle(){cur=showTitle;
 show(`<h2>${t('title')}</h2><p>${t('sub')}</p><p>${t('how')}</p><button class="btn gold" onclick="startGame()">${t('start')}</button>`)}
function showOver(){cur=showOver;
 show(`<h2 style="color:var(--red)">${t('over')}</h2><p>${t('waves_done',Math.max(0,S.wave-1))}</p><p>${t('killed',S.kills)}</p>
 <button class="btn red" onclick="startGame()">${t('retry')}</button>`);renderBar()}
function showWin(){cur=showWin;
 show(`<h2>${t('win')}</h2><p>${t('waves_done',5)}</p><p>${t('killed',S.kills)}</p>
 <p>${t('lives')}: ${S.lives}</p><button class="btn gold" onclick="startGame()">${t('again')}</button>`);renderBar()}
let pickCards=[],pickBonus=0;
function showPick(bonus){
 pickBonus=bonus;pickCards=rollCards();cur=showPick;drawPick();renderBar();renderHud();
}
function cardText(c){return{n:t('c_'+c.id),d:t('c_'+c.id+'_d',...c.a)}}
function drawPick(){
 show(`<h2>${t('cleared')}</h2><p>${t('bonus',pickBonus)}</p><p style="color:var(--gold)">${t('pick')}</p><div class="opts">${pickCards.map((c,i)=>{
  const x=cardText(c);return`<button class="opt ${c.curse?'curse':''}" onclick="choose(${i})"><b>${x.n}${c.curse?' ['+t('cursed')+']':''}</b>${x.d}</button>`}).join('')}</div>`);
}
function choose(i){
 const c=pickCards[i];c.ap();S.ups.push({id:c.id,a:c.a,curse:c.curse});
 beep(520,.15,'triangle',.05,300);hide();state='build';renderHud();renderBar();
}
function showUps(){
 const prev=cur;
 const list=S.ups.length?`<div class="ul">${S.ups.map(u=>`<div style="color:${u.curse?'#ffb3bd':'#fff'}">- ${t('c_'+u.id)}: ${t('c_'+u.id+'_d',...u.a)}</div>`).join('')}</div>`:`<p>${t('noups')}</p>`;
 show(`<h2>${t('ups')}</h2>${list}<button class="btn" id="cl">${t('close')}</button>`);
 cur=showUps;$('#cl').onclick=()=>{hide();cur=null};
}
function startGame(){resetGame();hide();renderHud();renderBar();beep(440,.1,'triangle')}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(state==='title'||state==='over'||state==='win'||state==='pick')return;
 const r=cv.getBoundingClientRect(),w=cv.clientWidth,h=cv.clientHeight;
 const px=(e.clientX-r.left-cv.clientLeft)*VW/w,py=(e.clientY-r.top-cv.clientTop)*VH/h;
 const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
 if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return;
 const ex=towers.find(q=>q.x===tx&&q.y===ty);
 if(ex){sel=ex===sel?null:ex;beep(600,.04);renderBar();return}
 if(sel){sel=null;renderBar();return}
 if(blocked[ty][tx]){toast(t('toast_spot'));return}
 const c=tcost(build);
 if(S.gold<c){toast(t('toast_gold'));beep(120,.1,'sawtooth');return}
 S.gold-=c;towers.push({x:tx,y:ty,type:build,lv:1,cd:0,ang:0,inv:c});
 beep(380,.08,'triangle',.05,200);vib(10);renderHud();renderBar();
});

/* ---------- language / sound / layout ---------- */
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('#lang').textContent=LANG.toUpperCase();
 $('#mute').textContent=t('snd');$('#mute').classList.toggle('off',muted);
 document.title=t('title');
}
$('#lang').onclick=()=>{
 LANG=LANG==='es'?'en':'es';try{localStorage.setItem(langKey,LANG)}catch(e){}
 applyLang();renderHud();renderBar();
 if($('#ov').style.display==='flex'&&cur){if(cur===showPick)drawPick();else cur()}
};
$('#mute').onclick=()=>{muted=!muted;applyLang()};
function layout(){
 const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;
 const sc=Math.max(.5,Math.min((w-8)/VW,(h-8)/VH));
 cv.style.width=Math.floor(VW*sc)+'px';cv.style.height=Math.floor(VH*sc)+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
 acc+=Math.min(.1,(now-last)/1000);last=now;
 const step=1/60/speed;
 while(acc>=step){update(1/60);acc-=step}
 render();requestAnimationFrame(frame);
}
resetGame();state='title';applyLang();renderHud();renderBar();layout();showTitle();
requestAnimationFrame(frame);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-spiderman">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Spider-Man Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--red:#d6243a;--blue:#2457d6;--gold:#ffcf3f;--panel:#1b2340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#0b1020;color:#fff;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
 font-family:'Press Start 2P',ui-monospace,Consolas,monospace;font-size:9px;line-height:1.6}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
 padding:max(4px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:38px}

header .r{display:flex;gap:4px;flex:none}

.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.small{font-size:8px;padding:4px 6px;min-height:34px}

.btn.red{background:var(--red)}.btn.gold{background:#d9a21b;color:#000}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;border:4px solid #000;background:#000;display:block;box-shadow:0 4px 0 #000}
#pad{flex:none;height:150px;display:flex;justify-content:space-between;align-items:center;padding:0 4px}
#pad .g{display:flex;gap:12px}
.pb{width:76px;height:76px;border:4px solid #000;box-shadow:0 5px 0 #000,inset 0 0 0 3px rgba(255,255,255,.25);background:#2a3560;color:#fff;
 display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;line-height:1.3;touch-action:none;position:relative}
.pb.on{transform:translateY(4px);box-shadow:0 1px 0 #000;filter:brightness(1.4)}

.pb i{display:block;width:0;height:0;border-style:solid}
.pb.l i{border-width:14px 22px 14px 0;border-color:transparent #fff transparent transparent}

.modal{background:var(--panel);border:4px solid #000;box-shadow:0 4px 0 #000,inset 0 0 0 3px rgba(255,255,255,.12);max-width:520px;width:100%;padding:16px;text-align:center;margin:auto}
.modal h2{margin:0 0 10px;font-size:18px;color:var(--red);text-shadow:3px 3px 0 #000}
.modal p{font-size:9px;line-height:1.9;color:#dfe6f5;margin:8px 0}
.final .big{font-size:26px;line-height:1.5;color:var(--gold);text-shadow:4px 4px 0 #000;margin:14px 0;animation:bl 1s steps(2) infinite}
.final .big b{color:#fff}
.final .big small{display:block;font-size:13px;color:#fff;margin:4px 0}
@keyframes bl{50%{color:#fff}}
@media(orientation:landscape) and (max-height:520px){
 #app{position:relative}
 #pad{position:absolute;left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));height:auto;pointer-events:none;z-index:5}
 .pb{width:60px;height:60px;pointer-events:auto;opacity:.75;font-size:8px}
 header{min-height:34px}
}
