<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   STYLES
   1. Tokens       4. Components      7. Scratch Lotto
   2. Base         5. Hub             8. Dice Pit
   3. Layout       6. Game shell      9. Dig Pit      10. Responsive
   ===================================================================== */

/* 1. Tokens ---------------------------------------------------------- */
:root{
  --bg:#111111; --surface:#181818; --surface-hover:#202020; --line:#2a2a2a;
  --text:#f2f2f2; --muted:#8a8a8a; --accent:#5b8cff; --good:#34d399; --bad:#f87171;
  --radius:12px; --radius-sm:8px;
  --display:Fredoka, "Trebuchet MS", ui-rounded, system-ui, sans-serif;
}
:root[data-theme="light"]{
  --bg:#fafafa; --surface:#ffffff; --surface-hover:#f3f3f3; --line:#e6e6e6; --text:#161616; --muted:#6f6f6f;
}

/* 2. Base ------------------------------------------------------------ */
*{box-sizing:border-box;margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3{letter-spacing:-.02em}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 3. Layout ---------------------------------------------------------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.spacer{flex:1}
.view{display:none}
.view.active{display:block}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:12px;height:62px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.85rem;text-align:center;margin-top:40px}

/* 4. Components ------------------------------------------------------ */
.btn{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:var(--radius-sm);font-weight:500;font-size:.9rem;transition:background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){background:var(--surface-hover)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent);opacity:.9}
.btn.danger{color:var(--bad)}
.btn.big{padding:12px 22px;font-size:1rem}
.tag{padding:2px 8px;border-radius:6px;background:var(--line);color:var(--muted);font-size:.78rem}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--surface);border:1px solid var(--line);padding:10px 18px;border-radius:var(--radius-sm);transition:transform .25s;z-index:99;font-weight:500}
#toast.show{transform:translate(-50%,0)}

/* 5. Hub ------------------------------------------------------------- */
.logo{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;background:none;border:0}
.logo i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;background:var(--accent);font-size:.95rem}
/* 5b. PlayStation-style home: dark stage, a row of tiles, the focused game's details underneath */
body:not(.in-game){background:#03050d}
body:not(.in-game) header{position:absolute;left:0;right:0;background:transparent;border-bottom:0}
body:not(.in-game) .logo{color:#fff}
body:not(.in-game) header .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(8px)}
body:not(.in-game) header .btn:hover{background:rgba(255,255,255,.18)}
body:not(.in-game) footer{margin-top:0;border:0;background:#03050d;color:rgba(255,255,255,.35);padding:14px}
body.in-game .clock{display:none}
.clock{color:rgba(255,255,255,.8);font-weight:500;font-size:.95rem;margin-right:6px}
.ps{position:relative;isolation:isolate;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:62px;overflow:hidden;color:#fff}
.ps-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(1100px 620px at 12% -8%,rgba(52,98,255,.38),transparent 70%),radial-gradient(900px 600px at 95% 105%,rgba(120,70,255,.28),transparent 70%),linear-gradient(180deg,#071030,#050918 60%,#03050d)}
.ps-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,13,.2),rgba(3,5,13,.8) 72%,#03050d)}
.ps-art{position:absolute;inset:-14%;opacity:0;transition:opacity .6s ease;filter:blur(46px) saturate(1.5)}
.ps-art.in{opacity:.8}
.ps-top{display:flex;align-items:center;gap:20px;padding:14px 56px 0;flex-wrap:wrap}
.ps-tabs{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.ps-tabs::-webkit-scrollbar,.ps-row::-webkit-scrollbar{display:none}
.ps-tab{background:none;border:0;color:rgba(255,255,255,.55);font-size:1.08rem;font-weight:500;padding:10px 0;position:relative;white-space:nowrap;transition:color .2s}
.ps-tab:hover{color:#fff}
.ps-tab.on{color:#fff;font-weight:600}
.ps-tab.on::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:3px;background:#fff;box-shadow:0 0 12px rgba(120,170,255,.8)}
.ps-search{width:min(240px,100%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:8px 18px;color:#fff;font-size:.92rem}
.ps-search::placeholder{color:rgba(255,255,255,.5)}
.ps-search:focus{outline:2px solid rgba(255,255,255,.7);outline-offset:2px;background:rgba(255,255,255,.16)}
.ps-label{padding:26px 56px 0;color:rgba(255,255,255,.55);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.ps-stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.ps-row{position:relative;display:flex;gap:22px;overflow-x:auto;padding:26px 56px 44px;scrollbar-width:none}
.ps-row::after{content:'';flex:none;width:55vw}
.tile{flex:none;position:relative;width:clamp(230px,21vw,310px);aspect-ratio:16/10;border:0;padding:0;border-radius:20px;overflow:hidden;background:#111;opacity:.6;transform:scale(.95);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s,box-shadow .3s}
.tile.on{opacity:1;transform:scale(1.07);box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(110,160,255,.3),0 26px 60px rgba(0,0,0,.6)}
.tile .thumb{position:absolute;inset:0;overflow:hidden}
.tile-name{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;text-align:left;font-weight:600;font-size:1rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.empty{padding:40px 0;color:rgba(255,255,255,.6)}
.ps-info{padding:0 56px;max-width:840px;min-height:230px}
.ps-genre{display:inline-block;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#9fc0ff;margin-bottom:8px}
.ps-title{font-size:clamp(2rem,4.6vw,3.8rem);font-weight:300;letter-spacing:-.025em;line-height:1.05}
.ps-desc{color:rgba(255,255,255,.74);font-size:1.05rem;max-width:58ch;margin:12px 0 4px}
.ps-meta{color:rgba(255,255,255,.5);font-size:.9rem}
.ps-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.ps-play{border:0;background:#fff;color:#07102e;border-radius:99px;padding:13px 38px;font-weight:700;font-size:1.05rem;display:inline-flex;gap:10px;align-items:center;transition:transform .15s,box-shadow .15s}
.ps-play:hover{transform:scale(1.05);box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.ps-ghost{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:13px 24px;font-weight:600;font-size:1rem;transition:background .15s}
.ps-ghost:hover{background:rgba(255,255,255,.22)}
.ps-foot{display:flex;gap:26px;align-items:center;padding:14px 56px 20px;color:rgba(255,255,255,.5);font-size:.82rem;flex-wrap:wrap}
.ps-foot b{color:#fff;font-weight:600;margin-right:5px}
.ps-hint{margin-left:auto}
.game-head{display:flex;align-items:center;gap:14px;padding:20px 0 14px;flex-wrap:wrap}
.game-head h1{font-size:1.4rem}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:24px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.saves{margin:16px 0;display:grid;gap:8px;max-height:260px;overflow:auto}
.save-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;font-size:.9rem}
.save-row small{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* hub thumbnails (game art previews) */
.th{width:100%;height:100%;display:grid;place-items:center;position:relative}
.th-scratch{background:#2a1052 repeating-conic-gradient(from 0deg at 50% 110%,rgba(255,255,255,.06) 0 6deg,transparent 6deg 12deg)}
.th-ticket{background:#fff8e7;border-radius:10px;padding:10px 12px;display:flex;gap:6px;transform:rotate(-5deg);border-top:12px solid #f0b429}
.th-ticket svg{width:38px;height:38px}
.th-dice{background:#1d6b45 radial-gradient(ellipse at center,#24804f 0,#1a5e3d 75%);gap:14px;grid-auto-flow:column;place-content:center}
.th-dice .die{width:52px;height:52px;padding:8px;border-radius:12px}
.th-dice .die:first-child{transform:rotate(-12deg)}
.th-dice .die:last-child{transform:rotate(9deg) translateY(8px)}
.th-dig{background:linear-gradient(#8fd3ff 0 34%,#5cbf4a 34% 40%,#9a6a3a 40% 62%,#7a4e2b 62% 82%,#5d5560 82%)}
.th-dig svg{width:70px;height:70px;transform:translateY(14px)}

/* 6. Game shell (themed by .g-<game>) -------------------------------- */
.g{
  --g-bg:#222; --g-surface:#2c2c2c; --g-shade:#111; --g-ink:#fff; --g-muted:#aaa; --g-line:rgba(255,255,255,.12);
  --g-accent:#5b8cff; --g-accent-ink:#fff; --g-accent-shadow:#3355aa; --g-good:#5cf08f; --g-bad:#ff5f7e;
  position:relative;border-radius:22px;padding:20px;background:var(--g-bg);color:var(--g-ink);
  font-family:var(--display);min-height:560px;overflow:hidden;margin-bottom:10px
}
.g b,.g strong{font-weight:700}
.g-muted{color:var(--g-muted)}
.g-btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:14px;padding:11px 20px;
  background:var(--g-accent);color:var(--g-accent-ink);box-shadow:0 5px 0 var(--g-accent-shadow);transition:transform .08s,box-shadow .08s,filter .15s;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15}
.g-btn:hover:not(:disabled){filter:brightness(1.08)}
.g-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--g-accent-shadow)}
.g-btn:disabled{opacity:.45}
.g-btn.alt{background:var(--g-surface);color:var(--g-ink);box-shadow:0 5px 0 var(--g-shade)}
.g-btn.alt:active:not(:disabled){box-shadow:0 2px 0 var(--g-shade)}
.g-btn.big{font-size:1.15rem;padding:14px 28px}
.g-btn.sm{font-size:.75rem;padding:7px 12px;border-radius:10px;box-shadow:0 3px 0 var(--g-shade)}
.g-btn small{font-size:.7rem;opacity:.8;text-transform:none;letter-spacing:0;font-weight:600}
.g-btn svg{width:18px;height:18px}
.g-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.g-panel{background:var(--g-surface);border-radius:18px;padding:16px;box-shadow:0 6px 0 var(--g-shade)}
.g-pop{position:absolute;left:50%;top:30%;z-index:8;font-size:1.7rem;font-weight:700;color:var(--g-good);white-space:nowrap;pointer-events:none;
  text-shadow:0 3px 0 rgba(0,0,0,.45);animation:floatUp 1.3s ease-out forwards;display:flex;align-items:center;gap:6px}
.g-pop svg{width:30px;height:30px}
.g-pop.dim{color:var(--g-muted);font-size:1.2rem}
@keyframes floatUp{0%{transform:translate(-50%,10px) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{transform:translate(-50%,-70px);opacity:0}}
@keyframes stamp{from{transform:scale(2.3) rotate(-10deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
@keyframes deal{from{transform:translateY(50px) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* HUD */
.g-hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.g-round{background:var(--g-ink);color:var(--g-bg);border-radius:14px;padding:6px 14px;text-align:center;line-height:1}
.g-round small{display:block;font-size:.62rem;letter-spacing:.15em;font-weight:700;opacity:.75}
.g-round b{font-size:1.7rem}
.g-meter{flex:1;min-width:200px}
.g-meter-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--g-muted);margin-bottom:4px;font-weight:600}
.g-meter-top b{color:var(--g-ink);font-size:1.15rem}
.g-track{height:18px;border-radius:10px;background:rgba(0,0,0,.35);overflow:hidden}
.g-track i{display:block;height:100%;background:var(--g-accent);border-radius:10px;transition:width .5s cubic-bezier(.2,1.2,.4,1)}
.g-track.done i{background:var(--g-good)}
.g-res{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:14px;padding:6px 14px 6px 8px;font-size:1.25rem;font-weight:700;line-height:1}
.g-res svg{width:30px;height:30px}
.g-res small{display:block;font-size:.6rem;letter-spacing:.12em;color:var(--g-muted);text-transform:uppercase;margin-bottom:2px}
.g-relics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.g-relic{width:40px;height:40px;border-radius:12px;background:var(--g-surface);box-shadow:0 3px 0 var(--g-shade);display:grid;place-items:center;font-size:1.25rem;position:relative;cursor:help}
.g-relic b{position:absolute;right:-6px;bottom:-6px;background:var(--g-accent);color:var(--g-accent-ink);font-size:.65rem;border-radius:8px;padding:0 5px;line-height:16px}

/* Title / perk shop */
.g-title{display:grid;gap:20px;justify-items:center;text-align:center;padding:16px 0}
.g-tag{color:var(--g-muted);max-width:60ch;font-size:1.02rem;font-weight:500}
.g-tag b{color:var(--g-ink)}
.g-badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.g-badge{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:12px;padding:7px 14px;font-size:.9rem;font-weight:600}
.g-badge svg{width:20px;height:20px}
.g-badge b{font-size:1.1rem}
.g-shop{width:100%;text-align:left;margin-top:6px}
.g-shop h3{font-size:1.15rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.g-shop h3 svg{width:22px;height:22px}
.g-shop h3 span{font-size:.85rem;color:var(--g-muted);font-weight:500}
.g-perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.g-perk{background:var(--g-surface);box-shadow:0 5px 0 var(--g-shade);border-radius:16px;padding:14px;display:grid;gap:10px;grid-template-columns:46px 1fr;align-items:center}
.g-perk .ico{width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.28);display:grid;place-items:center;font-size:1.5rem}
.g-perk p{grid-column:1/-1;color:var(--g-muted);font-size:.85rem;font-weight:500;line-height:1.35}
.g-perk .g-btn{grid-column:1/-1;flex-direction:row}
.g-dots{display:flex;gap:4px;margin-top:4px}
.g-dots i{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.4)}
.g-dots i.on{background:var(--g-accent)}
.g-dots i.next{background:var(--g-good);animation:pop .6s ease-in-out infinite alternate}

/* Upgrade cards */
.g-pick{display:grid;gap:14px;justify-items:center;text-align:center;padding:6px 0 24px}
.g-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.g-card{width:200px;border:0;padding:0;border-radius:18px;background:var(--g-surface);color:var(--g-ink);box-shadow:0 8px 0 var(--g-shade);overflow:hidden;
  text-align:center;animation:deal .5s both;animation-delay:calc(var(--i) * .1s);transition:transform .15s;font-family:var(--display)}
.g-card:hover{transform:translateY(-10px) rotate(-2deg)}
.g-card-art{height:130px;display:grid;place-items:center;background:var(--c);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 10px,transparent 10px 20px)}
.g-card-art span{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:2.6rem;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.g-card-body{padding:14px;display:grid;gap:6px;justify-items:center}
.g-card-body b{font-size:1.2rem}
.g-card-body p{font-size:.85rem;color:var(--g-muted);min-height:2.6em;font-weight:500;line-height:1.3}

/* Banners */
.g-banner{display:grid;gap:16px;justify-items:center;text-align:center;padding:40px 20px}
.g-stamp{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:700;line-height:1;animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.g-stamp.ok{color:var(--g-good)}
.g-stamp.bad{color:var(--g-bad)}
.g-stamp.neutral{color:var(--g-accent);font-size:clamp(1.8rem,5vw,2.6rem)}
.g-big{font-size:2.2rem;font-weight:700}
.g-big span{font-size:1.2rem;color:var(--g-muted)}
.g-newbest{background:var(--g-good);color:#06321a;font-weight:700;border-radius:10px;padding:4px 14px;letter-spacing:.1em;animation:pop .5s .3s both}
.g-bigstar{width:110px;height:110px;animation:pop .6s both}

/* 7. Scratch Lotto --------------------------------------------------- */
.g-scratch{
  --g-bg:#2a1052; --g-surface:#3d1a78; --g-shade:#170630; --g-ink:#fff; --g-muted:#cdb8f5; --g-line:rgba(255,255,255,.14);
  --g-accent:#ffcc33; --g-accent-ink:#3a1a00; --g-accent-shadow:#c98a00; --g-good:#5cf08f; --g-bad:#ff6b8a;
  background:#2a1052 repeating-conic-gradient(from 0deg at 50% -10%,rgba(255,255,255,.045) 0 6deg,transparent 6deg 12deg)
}
.logo-text{font-size:clamp(2.6rem,8vw,4.4rem);font-weight:700;line-height:.95;letter-spacing:.01em}
.sc-logo{display:grid;justify-items:center;gap:6px}
.sc-logo .logo-text{color:#ffcc33;text-shadow:0 4px 0 #e8344e,0 9px 0 #170630;transform:rotate(-3deg)}
.sc-logo .logo-text span{color:#fff}
.sc-logo-syms{display:flex;gap:4px}
.sc-logo-syms svg{width:54px;height:54px;animation:pop .5s both}
.sc-logo-syms svg:nth-child(2){animation-delay:.1s;transform:translateY(-8px)}
.sc-logo-syms svg:nth-child(3){animation-delay:.2s}
.sc-play{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.sc-stage{display:grid;justify-items:center;gap:16px;padding:6px 0 10px;position:relative}
.sc-msg{font-size:1.35rem;font-weight:700;min-height:1.6em;text-align:center}
.sc-actions{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sc-tool{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.9rem}
.sc-msg.win{color:var(--g-accent)}
.sc-msg.lose{color:var(--g-muted)}
.sc2 .sc-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sc-coins{display:flex;align-items:center;gap:8px;font-size:1.7rem;font-weight:700;background:rgba(0,0,0,.3);border-radius:14px;padding:6px 16px;color:var(--g-accent)}
.sc-coins svg{width:30px;height:30px}
.sc-goal{flex:1;min-width:220px}
.sc-goal.done{color:var(--g-good);font-size:1.1rem}
.sc-next{color:var(--g-muted);font-size:.9rem;margin:2px 0 12px}
.sc-next b{color:var(--g-ink)}
.spots.c4{grid-template-columns:repeat(4,1fr)}
.spots.sc-winrow{grid-template-columns:repeat(2,1fr);padding:4px 22% 6px}
.sc-label{text-align:center;font-size:.7rem;letter-spacing:.2em;font-weight:700;color:var(--tc2);padding-top:6px}
.sc-num{display:grid;place-items:center;line-height:1}
.sc-num b{font-size:1.5rem;color:#2a1052}
.sc-num.big b{font-size:1.9rem;color:#e8344e}
.sc-num small{font-size:.75rem;color:#16a34a;font-weight:700;margin-top:4px}
.sc-mult{font-size:1.9rem;font-weight:800;color:#e8344e;text-shadow:0 2px 0 #ffd23f}
.sc-mult.sm{font-size:1.1rem;min-width:30px;text-align:center}
.sc-num-ico{width:30px;text-align:center;font-weight:800;color:var(--g-accent)}
.stub.sel{outline:3px solid var(--g-accent);outline-offset:2px}
.stub.locked{filter:saturate(.35)}
.stub.locked.next{filter:none;animation:glow .9s ease-in-out infinite alternate}
.stub.locked:not(button){opacity:.5}
.stub small.ret{margin-top:2px}
.stub small.ret.up{color:#b8ffcf}
.stub small.ret.down{color:#ffd0d8}
.sc-shop{display:grid;gap:8px}
.sc-item{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 8px}
.sc-item .ico{font-size:1.3rem;text-align:center}
.sc-item b{font-size:.9rem}
.sc-item .lv{font-size:.72rem;color:var(--g-accent);font-weight:700}
.sc-item p{margin:2px 0 0;font-size:.75rem;color:var(--g-muted);line-height:1.3}
.sc-item .g-btn{white-space:nowrap}
.sc-max{font-weight:700;font-size:.8rem}
.sc-crown{background:linear-gradient(90deg,rgba(255,204,51,.28),rgba(0,0,0,.25));border:2px solid var(--g-accent)}
.sc-stats{font-size:.78rem;text-align:center;margin:4px 0 0}
.sc-link{background:none;border:0;color:var(--g-muted);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.g-pop.jackpot{color:var(--g-accent);font-size:2.2rem;text-shadow:0 3px 0 #e8344e}
.ticket{--tc:#d4823b;--tc2:#8a4f1c;width:min(400px,100%);background:#fff8e7;color:#2a1052;border-radius:16px;position:relative;
  box-shadow:0 10px 0 rgba(0,0,0,.3);transform:rotate(-1.2deg);animation:deal .45s both}
.ticket::before,.ticket::after{content:"";position:absolute;top:96px;width:24px;height:24px;border-radius:50%;background:var(--g-bg);z-index:2}
.ticket::before{left:-12px}
.ticket::after{right:-12px}
.tier-bronze{--tc:#d4823b;--tc2:#8a4f1c}
.tier-silver{--tc:#7f95ad;--tc2:#40516a}
.tier-gold{--tc:#f0b429;--tc2:#8f6200}
.ticket-head{background:var(--tc);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:16px 16px 0 0;
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px)}
.ticket-head small{display:block;font-size:.7rem;letter-spacing:.2em;opacity:.9}
.ticket-head b{font-size:1.7rem;line-height:1;text-shadow:0 3px 0 var(--tc2)}
.ticket-price{background:#fff;color:var(--tc2);border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;
  transform:rotate(12deg);border:3px dashed var(--tc);line-height:1;text-align:center}
.ticket-price small{font-size:.55rem;letter-spacing:.1em;display:block}
.ticket-sub{text-align:center;font-weight:700;font-size:.8rem;letter-spacing:.2em;color:var(--tc2);padding:14px 0 4px}
.spots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 22px 16px}
.spot{aspect-ratio:1;position:relative;border-radius:14px;background:#fff;border:2px dashed rgba(42,16,82,.18);display:grid;place-items:center;overflow:hidden;transition:opacity .3s}
.spot svg.sym{width:74%;height:74%}
.spot canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .35s}
.spot canvas:active{cursor:grabbing}
.spot.open canvas{opacity:0;pointer-events:none}
.spot.open svg.sym{animation:pop .35s ease-out}
.spot.win{border:3px solid #ffcc33;background:#fff1b8;animation:glow .8s ease-in-out infinite alternate}
.spot.lose{opacity:.4}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,204,51,0)}to{box-shadow:0 0 0 7px rgba(255,204,51,.5)}}
.ticket-foot{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed rgba(42,16,82,.18);margin:0 16px;padding:10px 4px 14px;
  font-size:.72rem;color:rgba(42,16,82,.6);letter-spacing:.12em;font-weight:600}
.barcode{width:120px;height:24px;background:repeating-linear-gradient(90deg,#2a1052 0 2px,transparent 2px 4px,#2a1052 4px 5px,transparent 5px 8px,#2a1052 8px 11px,transparent 11px 13px)}
.ticket-stamp{position:absolute;left:50%;top:52%;z-index:3;font-size:2.4rem;font-weight:700;padding:4px 18px;border:5px solid;border-radius:14px;
  transform:translate(-50%,-50%) rotate(-12deg);animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none;background:rgba(255,248,231,.85)}
.ticket-stamp.win{color:#16a34a}
.ticket-stamp.lose{color:#9a8fb0;font-size:1.8rem}
@keyframes stampIn{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.ticket-empty{width:min(400px,100%);aspect-ratio:1.15;border:4px dashed var(--g-line);border-radius:18px;display:grid;place-items:center;color:var(--g-muted);text-align:center;padding:24px;font-size:1.1rem;font-weight:600}
.ticket-empty svg{width:70px;height:70px;opacity:.6;display:block;margin:0 auto 10px}
.booth{display:grid;gap:16px}
.booth h3{font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--g-muted)}
.stubs{display:grid;gap:12px}
.stub{--tc:#d4823b;--tc2:#8a4f1c;position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:0;padding:12px 20px;
  background:var(--tc);color:#fff;border-radius:12px;box-shadow:0 5px 0 var(--tc2);transition:transform .1s;font-family:var(--display);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px)}
.stub::before,.stub::after{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--g-surface);transform:translateY(-50%)}
.stub::before{left:-8px}
.stub::after{right:-8px}
.stub:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.stub b{font-size:1.2rem;line-height:1.1;text-shadow:0 2px 0 var(--tc2)}
.stub small{display:block;opacity:.9;font-size:.72rem;letter-spacing:.08em;font-weight:600}
.stub .price{font-size:1.15rem;font-weight:700;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 10px}
.stub:disabled{filter:grayscale(.85);opacity:.45}
.tickets-left{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:30px}
.tickets-left svg{width:30px;height:30px}
.paytable{display:grid;gap:6px}
.paytable div{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:10px;padding:4px 12px 4px 6px;font-weight:600}
.paytable svg{width:30px;height:30px}
.paytable span{color:var(--g-muted);font-size:.8rem}
.paytable b{margin-left:auto;color:var(--g-accent)}
.odds{margin-top:14px}
.odds-tabs{display:flex;gap:6px;margin:6px 0 8px}
.odds-tab{border:0;border-radius:8px;padding:4px 12px;background:rgba(0,0,0,.25);color:var(--g-muted);font-weight:600;font-size:.8rem;cursor:pointer}
.odds-tab.on{background:var(--g-accent);color:#fff}
.odds-table[hidden]{display:none}
.odds-row{display:grid;grid-template-columns:34px 1fr 1fr;align-items:center;gap:6px;font-size:.85rem;padding:2px 6px}
.odds-row svg{width:24px;height:24px}
.odds-row b,.odds-head span{text-align:right}
.odds-head{color:var(--g-muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
.odds-sum{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 6px;margin-top:2px;border-top:1px solid rgba(255,255,255,.1)}
.odds-note{font-size:.72rem;margin-top:8px;font-weight:500}
.pt{display:grid;gap:5px;margin-top:10px}
.pt-row{display:grid;grid-template-columns:28px 1fr 48px 48px 66px;align-items:center;gap:6px;background:rgba(0,0,0,.25);border-radius:10px;padding:3px 10px 3px 6px;font-weight:600;font-size:.85rem}
.pt-row svg{width:26px;height:26px}
.pt-row span{color:var(--g-muted);font-size:.75rem}
.pt-row em{font-style:normal;text-align:right;color:#8fe3ff}
.pt-row b{text-align:right;color:var(--g-accent)}
.pt-head{background:none;padding-top:0;padding-bottom:0}
.pt-head span{text-align:right;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em}
.pt-sum{display:flex;justify-content:space-between;font-size:.88rem;padding:4px 6px;margin-top:2px;border-top:1px solid rgba(255,255,255,.1)}
@media(max-width:600px){.pt-row{grid-template-columns:26px repeat(3,1fr)}.pt-row .lab{display:none}}
.odds-strip{display:none;flex-wrap:wrap;justify-content:center;gap:5px;max-width:100%}
.odds-strip span{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.28);border-radius:99px;padding:2px 9px 2px 4px;font-size:.78rem;font-weight:700}
.odds-strip svg{width:20px;height:20px}
.odds-strip .win{background:rgba(255,182,39,.2);color:var(--g-accent)}
@media(max-width:820px){.odds-strip{display:flex}}

/* 8. Dice Pit -------------------------------------------------------- */
.g-dice{
  --g-bg:#0f3a28; --g-surface:#17503a; --g-shade:#06200f; --g-ink:#fdf6e3; --g-muted:#a7cdb7; --g-line:rgba(255,255,255,.12);
  --g-accent:#e63946; --g-accent-ink:#fff; --g-accent-shadow:#9b1d27; --g-good:#7dff9e; --g-bad:#ff7b7b;
  background:#0f3a28 radial-gradient(circle at 50% 0,#1a5c40 0,transparent 65%)
}
.dp-logo{display:grid;justify-items:center;gap:8px}
.dp-logo .logo-text{color:#fdf6e3;text-shadow:0 4px 0 #e63946,0 9px 0 #06200f}
.dp-logo .logo-text span{color:#ffcc33}
.dp-logo-dice{display:flex;gap:12px}
.dp-logo-dice .die:first-child{transform:rotate(-14deg)}
.dp-logo-dice .die:last-child{transform:rotate(10deg) translateY(6px)}
.dp-play{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start}
.felt{position:relative;background:#1d6b45 radial-gradient(ellipse at center,#25834f 0,#195a3b 78%);border:16px solid #6b3e1f;border-radius:30px;
  box-shadow:inset 0 0 0 3px #8a5329,0 8px 0 #3a210e;padding:30px 18px 24px;display:grid;gap:22px;justify-items:center;min-height:380px;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px),radial-gradient(ellipse at center,#25834f 0,#195a3b 78%);background-size:8px 8px,auto}
.dice-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;min-height:120px;align-items:center;padding-top:6px}
.die{width:78px;height:78px;border-radius:17px;border:0;background:#fdf6e3;box-shadow:0 7px 0 #c9bc97;padding:13px;display:grid;
  grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px;position:relative;transition:transform .15s,box-shadow .15s}
.die i{border-radius:50%}
.die i.on{background:#1d1d1d}
.die.v1 i.on{background:#e63946;transform:scale(1.25)}
button.die:not(:disabled):hover{transform:translateY(-4px)}
.die.blank{background:rgba(253,246,227,.1);box-shadow:none;border:3px dashed rgba(253,246,227,.3)}
.die.held{transform:translateY(-16px);box-shadow:0 7px 0 #c9bc97,0 0 0 5px #ffcc33}
button.die.held:hover{transform:translateY(-18px)}
.die.held::after{content:attr(data-held);position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);font-size:.65rem;font-weight:700;letter-spacing:.14em;
  background:#ffcc33;color:#3a2a00;border-radius:6px;padding:2px 7px}
.die.roll{animation:tumble .5s cubic-bezier(.2,1.3,.4,1)}
.die.roll:nth-child(2n){animation-duration:.6s}
.die.roll:nth-child(3n){animation-duration:.45s}
@keyframes tumble{0%{transform:translateY(-60px) rotate(-260deg) scale(.6);opacity:.2}100%{transform:none;opacity:1}}
.plate{display:grid;gap:10px;justify-items:center;min-height:96px}
.hand-name{font-size:1.5rem;font-weight:700;color:#fff}
.hand-name.hint{font-size:1.1rem;color:var(--g-muted);font-weight:600}
.formula{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.dp-chips,.dp-mult{min-width:78px;text-align:center;border-radius:12px;padding:5px 14px;font-size:1.6rem;font-weight:700;color:#fff}
.dp-chips{background:#2f8cff;box-shadow:0 4px 0 #1a5bb0}
.dp-mult{background:#e63946;box-shadow:0 4px 0 #9b1d27}
.formula .x{font-size:1.5rem;font-weight:700;opacity:.8}
.formula .total{font-size:2rem;font-weight:700;color:#ffcc33;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.dp-side{display:grid;gap:16px}
.tok-label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--g-muted);font-weight:700;margin-bottom:6px}
.tokens{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.token{width:30px;height:30px;border-radius:50%;background:#e63946;border:4px dashed #fff;box-shadow:0 3px 0 #9b1d27;transition:opacity .3s}
.token.blue{background:#2f8cff;box-shadow:0 3px 0 #1a5bb0}
.token.used{opacity:.18}
.plaque{background:#6b3e1f;border-radius:16px;box-shadow:inset 0 0 0 3px #8a5329,0 6px 0 #3a210e;padding:14px;display:grid;gap:3px;color:#fdf6e3}
.plaque h3{text-align:center;font-size:.85rem;letter-spacing:.18em;color:#ffcc33;margin-bottom:6px}
.plaque div{display:flex;justify-content:space-between;font-size:.85rem;padding:3px 8px;border-radius:8px;font-weight:600}
.plaque div.hit{background:#ffcc33;color:#3a2a00}
.plaque .c{color:#8cc4ff}
.plaque .m{color:#ff9aa1}
.plaque div.hit .c,.plaque div.hit .m{color:#3a2a00}

/* 9. Dig Pit --------------------------------------------------------- */
.g-dig{
  --g-bg:#2b1d14; --g-surface:#402c1e; --g-shade:#160e08; --g-ink:#fff4e0; --g-muted:#cdb79c; --g-line:rgba(255,240,220,.14);
  --g-accent:#f5b82e; --g-accent-ink:#3a2400; --g-accent-shadow:#a8720a; --g-good:#9af07f; --g-bad:#ff7052;
  background:#2b1d14
}
.dg-logo{display:grid;justify-items:center;gap:4px}
.dg-logo svg{width:96px;height:96px;animation:pop .5s both}
.dg-logo .logo-text{color:#f5b82e;text-shadow:0 4px 0 #8a5329,0 9px 0 #160e08}
.dg-play{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start}
.scene{position:relative;border-radius:20px;overflow-y:auto;overflow-x:hidden;max-height:600px;box-shadow:0 6px 0 var(--g-shade);background:#160e08}
.scene.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.sky{height:130px;background:#8fd3ff;position:relative;overflow:hidden}
.sun{position:absolute;right:34px;top:18px;width:46px;height:46px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 10px rgba(255,210,63,.3)}
.cloud{position:absolute;width:70px;height:20px;background:#fff;border-radius:20px}
.cloud::before{content:"";position:absolute;left:14px;top:-12px;width:30px;height:30px;border-radius:50%;background:#fff}
.grass{position:absolute;left:0;right:0;bottom:0;height:16px;background:#5cbf4a;border-bottom:5px solid #3f9a36}
.headframe{position:absolute;bottom:16px;left:50%;width:120px;height:90px;transform:translateX(-50%);z-index:2}
.headframe svg{width:100%;height:100%}
.rope-top{position:absolute;left:50%;bottom:0;height:78px;width:3px;background:#e2c08a;transform:translateX(-50%);z-index:1}
.miner{width:58px;height:58px;z-index:3}
.miner svg{width:100%;height:100%}
.miner.at-surface{position:absolute;bottom:14px;left:calc(50% + 52px)}
.stratum{height:66px;position:relative;display:flex;align-items:center}
.stratum svg.deco{position:absolute;inset:0;width:100%;height:100%}
.shaft{position:absolute;left:50%;top:0;bottom:0;width:80px;transform:translateX(-50%)}
.stratum.dug .shaft{background:#140b06;box-shadow:inset 6px 0 0 rgba(0,0,0,.4),inset -6px 0 0 rgba(0,0,0,.4)}
.shaft .rope{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#e2c08a;transform:translateX(-50%)}
.shaft .rope.half{bottom:45%}
.shaft .miner{position:absolute;bottom:2px;left:50%;transform:translateX(-50%)}
.shaft .miner.dig svg{animation:bob .35s ease-out}
@keyframes bob{0%{transform:rotate(-12deg) translateY(-4px)}100%{transform:none}}
.depth-label{position:absolute;left:12px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.6)}
.risk{position:absolute;right:12px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:7px;background:#d9b47a;box-shadow:0 3px 0 #7c5a2e}
.risk.low{color:#1f6b2a}
.risk.mid{color:#8a5a00}
.risk.high{color:#a3241a}
.cavein{position:absolute;left:0;right:0;top:0;height:330px;pointer-events:none;z-index:9;overflow:hidden}
.cavein b{position:absolute;left:50%;top:44%;font-size:2.6rem;color:#ff7052;text-shadow:0 4px 0 #160e08;transform:translate(-50%,-50%);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both}
.cavein i{position:absolute;top:-30px;width:24px;height:19px;background:#7a6555;border-radius:40% 55% 45% 50%;animation:fall .9s ease-in forwards}
@keyframes fall{to{transform:translateY(360px) rotate(280deg);opacity:.15}}
.dg-side{display:grid;gap:14px}
.side-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.side-h svg{width:22px;height:22px}
.side-h b{margin-left:auto}
.energy{display:flex;flex-wrap:wrap;gap:5px}
.energy i{width:16px;height:24px;border-radius:5px;background:rgba(0,0,0,.4)}
.energy i.on{background:#ffd23f;box-shadow:inset 0 -5px 0 #e0a21a}
.purse{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.purse div{background:var(--g-surface);box-shadow:0 5px 0 var(--g-shade);border-radius:16px;padding:12px 8px;text-align:center}
.purse svg{width:48px;height:48px}
.purse b{display:block;font-size:1.6rem;line-height:1.1}
.purse small{color:var(--g-muted);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.purse .at-risk b{color:#ffd23f}
.dg-side .g-btn{width:100%}
.journal{background:#f3e3c3;color:#4a3420;border-radius:14px;padding:12px 16px;font-size:.88rem;display:grid;gap:5px;box-shadow:0 5px 0 #a88a5a;font-weight:500;
  background-image:repeating-linear-gradient(transparent 0 23px,rgba(74,52,32,.12) 23px 24px)}
.journal h4{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.journal div:not(:nth-child(2)){opacity:.6}
.journal div:nth-child(2){font-weight:700}

/* 9b. Embedded games ------------------------------------------------ */
[hidden]{display:none!important}
/* The game view becomes a full-height column: title row on top, iframe takes the rest (no page scroll). */
body.in-game footer{display:none}
body.embed-mode #game.active{display:flex;flex-direction:column;height:calc(100vh - 63px);height:calc(100dvh - 63px)}
body.embed-mode #stage{flex:1;min-height:0}
.embed{height:100%;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.embed-bar{color:var(--muted);font-size:.85rem}
.embed-frame{flex:1;min-height:0;width:100%;border:1px solid var(--line);border-radius:var(--radius);background:#000;display:block}
#gameTools:empty{display:none}
/* scratch booth pieces (spacing kept here so the mobile block can override it) */
.stubs{margin-top:12px}
.left-box h3{margin:16px 0 6px}
.paytable{margin-top:10px}
.board-hint{font-size:.78rem;margin-top:10px;font-weight:500}
.th svg.px{shape-rendering:crispEdges}
.th svg.full{position:absolute;inset:0;width:100%;height:100%}
.th-sm,.th-ss{overflow:hidden}
.th-sm .th-hero{position:relative;width:45px;height:80px;transform:translateY(12px)}
.th-ss .ship{position:relative;width:54px;height:48px;transform:translateY(16px)}
.th-pp{background:#1d5c47;grid-auto-flow:column;place-content:center;gap:6px}
.th-card{width:46px;height:64px;background:#f4ecd8;border:3px solid #000;box-shadow:0 3px 0 #000;display:grid;place-items:center;
  font:700 15px/1 ui-monospace,Consolas,monospace;padding:4px 0}
.th-card svg{width:22px;height:22px}
.th-card:nth-child(1){transform:rotate(-10deg) translateY(4px)}
.th-card:nth-child(3){transform:rotate(10deg) translateY(4px)}

/* Touch screens: no sticky hover lifts, no double-tap zoom on game buttons, no keyboard hint. */

}

  .ps-info{padding:0 18px;min-height:0}
  .ps-foot{padding:10px 18px 18px;gap:16px}

  .game-head{padding:8px 0;gap:8px;flex-wrap:nowrap}

  .game-head .btn{padding:7px 10px;flex:none}
  .embed{padding-bottom:8px}
}

/* Phones: compact versions of every native game screen so a round fits without scrolling. */
@media(max-width:600px){
  .g{padding:10px;border-radius:14px}
  .g-btn.big{font-size:1rem;padding:12px 16px}
  /* HUD: round + goal on one line, counters + quit on the next */
  .g-hud{gap:8px;margin-bottom:8px}
  .g-round{padding:5px 10px}
  .g-round b{font-size:1.3rem}
  .g-meter{flex:1 1 60%;min-width:0}
  .g-track{height:14px}
  .g-res{font-size:1.05rem;padding:4px 10px 4px 6px}
  .g-res svg{width:22px;height:22px}
  .g-hud .g-btn.sm{margin-left:auto}
  .g-relics{gap:6px;margin-bottom:8px}
  .g-relic{width:32px;height:32px;font-size:1rem}
  /* title / perk shop */
  .g-title{gap:14px;padding:6px 0}
  .logo-text{font-size:2.3rem}
  .sc-logo-syms svg{width:40px;height:40px}
  .dp-logo-dice .die{width:44px;height:44px;padding:7px}
  .dg-logo svg{width:64px;height:64px}
  .g-tag{font-size:.92rem}
  .g-badge{padding:5px 10px;font-size:.8rem}
  .g-perks{grid-template-columns:1fr;gap:10px}
  .g-perk{padding:10px;grid-template-columns:40px 1fr auto}
  .g-perk .ico{width:40px;height:40px;font-size:1.3rem}
  .g-perk .g-btn{grid-column:auto}
  /* upgrade picks become full-width rows */
  .g-pick{gap:10px;padding:4px 0 10px}
  .g-cards{flex-direction:column;gap:10px;width:100%;margin-top:0}
  .g-card{width:100%;display:grid;grid-template-columns:76px 1fr;text-align:left;box-shadow:0 5px 0 var(--g-shade)}
  .g-card-art{height:auto;min-height:86px}
  .g-card-art span{width:52px;height:52px;font-size:1.7rem}
  .g-card-body{justify-items:start;padding:10px 12px;gap:3px}
  .g-card-body p{min-height:0}
  .g-banner{padding:24px 10px;gap:12px}

  /* Scratch Lotto: ticket, then a one-row booth and a compact prize board */
  .sc-play{gap:10px}
  .sc-stage{gap:8px;padding:0}
  .ticket{transform:none}
  .ticket::before,.ticket::after{top:84px}
  .ticket-head{padding:10px 14px}
  .ticket-head b{font-size:1.35rem}
  .ticket-price{width:46px;height:46px;font-size:.95rem}
  .ticket-sub{padding:8px 0 2px;font-size:.7rem}
  .spots{gap:8px;padding:8px 14px 10px}
  .ticket-foot{display:none}
  .spots{padding-bottom:14px}
  .ticket-stamp{font-size:1.9rem}
  .sc-msg{font-size:1.1rem;min-height:1.4em}
  .booth{gap:10px}
  .booth .g-panel{padding:10px}
  .stubs{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .stub{grid-template-columns:1fr;text-align:center;padding:8px 4px;gap:4px}
  .stub::before,.stub::after{display:none}
  .stub b{font-size:.95rem}
  .stub small,.left-box{display:none}
  .stub .price{justify-self:center;font-size:1rem;padding:2px 10px}
  .paytable{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .paytable div{padding:3px 8px 3px 4px;gap:4px}
  .paytable svg{width:24px;height:24px}
  .paytable span{display:none}
  .board-hint{display:none}

  /* Dice Pit: smaller dice in one row, side panel reduced to a two-column pay table */
  .felt{border-width:8px;border-radius:22px;padding:18px 8px 12px;gap:14px;min-height:0}
  .dice-row{gap:8px;min-height:86px;padding-top:4px}
  .die{width:52px;height:52px;padding:8px;border-radius:12px;box-shadow:0 5px 0 #c9bc97}
  .die.held{transform:translateY(-10px);box-shadow:0 5px 0 #c9bc97,0 0 0 4px #ffcc33}
  button.die.held:hover{transform:translateY(-10px)}
  .die.held::after{bottom:-26px;font-size:.55rem;padding:1px 5px}
  .plate{min-height:74px;gap:6px}
  .hand-name{font-size:1.2rem}
  .hand-name.hint{font-size:.95rem}
  .formula{gap:6px}
  .dp-chips,.dp-mult{min-width:56px;font-size:1.2rem;padding:4px 10px}
  .formula .total{font-size:1.5rem}
  .felt .g-row{width:100%;flex-wrap:nowrap;gap:8px}
  .felt .g-row .g-btn{flex:1;padding:12px 8px}
  .dp-side{gap:10px}
  .dp-side .g-panel{display:none}
  .plaque{grid-template-columns:1fr 1fr;column-gap:8px;padding:10px}
  .plaque h3{grid-column:1/-1;margin-bottom:2px}
  .plaque div{font-size:.72rem;padding:2px 6px}

  /* Dig Pit: shorter shaft view, side-by-side buttons, two-line journal */
  .scene{max-height:min(340px,42vh)}
  .sky{height:92px}
  .headframe{width:96px;height:72px}
  .rope-top{height:60px}
  .miner{width:48px;height:48px}
  .miner.at-surface{left:calc(50% + 40px)}
  .stratum{height:54px}
  .dg-side{gap:10px}
  .dg-side .g-panel{padding:10px}
  .side-h{margin-bottom:6px}
  .energy{gap:4px}
  .energy i{width:12px;height:18px}
  .purse{gap:8px}
  .purse div{display:grid;grid-template-columns:auto 1fr;align-items:center;text-align:left;padding:8px 10px;column-gap:8px}
  .purse svg{width:34px;height:34px;grid-row:span 2}
  .purse b{font-size:1.25rem}
  .purse small{font-size:.58rem}
  .dg-side{grid-template-columns:1fr 1fr}
  .dg-side > .g-panel,.dg-side > .purse,.dg-side > .journal{grid-column:1/-1}
  .dg-side .g-btn{padding:10px 6px;font-size:.9rem}
  .journal{padding:8px 12px;font-size:.8rem;gap:3px}
  .journal div:nth-child(n+4){display:none}
}
/* Short phones (e.g. 360×640): drop secondary panels so the play area still fits on one screen. */
@media(max-width:600px) and (max-height:720px){
  .g-hud{margin-bottom:6px}
  .g-meter-top{margin-bottom:2px;font-size:.78rem}
  .ticket{width:min(290px,100%)}
  .ticket-sub,.booth h3{display:none}
  .stubs{margin-top:0}
  .booth .g-panel:last-child{display:none}           /* prize board; the result line under the ticket shows each win */
  .felt{padding:14px 6px 10px;gap:10px}
  .dice-row{min-height:70px}
  .plate{min-height:62px}
  .felt > .g-muted{display:none}                    /* "tap a die to hold it" hint */
  .plaque div{padding:1px 6px}
  .scene{max-height:34vh}
  .journal{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// Weighted draw of n relics not owned; rares get likelier every stage.
function rollRelics(n,noRare){
 const out=[],pool=RELICS.filter(r=>!has(r.id)&&!(noRare&&r.r==='r'));
 const w=r=>r.r==='r'?Math.min(30,RAR.r.w+2*S.level):RAR[r.r].w;
 while(out.length<n&&pool.length){
  let x=Math.random()*pool.reduce((a,r)=>a+w(r),0),i=0;
  for(;i<pool.length-1;i++){x-=w(pool[i]);if(x<=0)break}
  out.push(pool.splice(i,1)[0].id);
 }
 return out;
}

// Each endless level is WPL generated waves; then a new map. Towers, gold and upgrades carry over.
const WPL=3;
function genWave(g,L,wi){
 const w=[['slime',5+g,Math.max(.35,.9-.03*g)]];
 if(g>=3)w.push(['runner',2+Math.floor(g*1.1),Math.max(.25,.6-.02*g)]);
 if(g>=6)w.push(['brute',Math.floor(g/2)-1,Math.max(.8,2-.05*g)]);
 if(g>=8)w.push(['flyer',1+Math.floor(g/3),Math.max(.45,1-.02*g)]);
 if(g>=9)w.push(['healer',1+Math.floor(g/5),Math.max(1,2-.04*g)]);
 for(let i=w.length-1;i>0;i--){const j=ri(0,i);[w[i],w[j]]=[w[j],w[i]]}
 if(wi===WPL&&L%3===0)w.push(['boss',1+Math.floor((L-3)/6),Math.max(4,8-L*.3)]);   // boss enemies close each boss stage
 return w;
}

  const entries=[side()];if(Math.random()<.4)entries.push(side());

/* ---------- map: open field, towers form the maze ---------- */
// rock: blocked for walking and building. occ: tower on a tile. FLOW: steps from each tile to the base
// (multi-source BFS from the exits); enemies always step to the neighbour with the lowest value.
let MAP,rock,occ,padOK,reserved,FLOW,ROUTES=[],AIR,showAir=false;
const inG=(x,y)=>x>=0&&x<COLS&&y>=0&&y<ROWS;
const DIRS=[[0,1],[1,0],[-1,0],[0,-1]];
const grid=v=>Array.from({length:ROWS},()=>Array(COLS).fill(v));
const entryTile=([x,y])=>[Math.min(COLS-1,Math.max(0,x)),Math.min(ROWS-1,Math.max(0,y))];
const INF=1e9;
function mkPath(wp){
 const pts=wp.map(([x,y])=>[(x+.5)*TS,(y+.5)*TS]),cum=[0];
 for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
 return{wp,pts,cum,len:cum[cum.length-1]};
}
function posAt(p,d){
 const c=p.cum;let i=1;while(i<c.length-1&&c[i]<d)i++;
 const f=(d-c[i-1])/(c[i]-c[i-1]),a=p.pts[i-1],b=p.pts[i];
 return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
}

function flow(block,m){
 m=m||MAP;const D=grid(INF),q=[],R=m===MAP?rock:rocksOf(m);
 const free=(x,y)=>inG(x,y)&&!R[y][x]&&!(m===MAP&&occ[y][x])&&!(block&&block[0]===x&&block[1]===y);
 for(const ex of m.exits)if(free(ex,ROWS-1)&&D[ROWS-1][ex]>1){D[ROWS-1][ex]=1;q.push([ex,ROWS-1])}
 for(let i=0;i<q.length;i++){const [x,y]=q[i];
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(free(nx,ny)&&D[ny][nx]>D[y][x]+1){D[ny][nx]=D[y][x]+1;q.push([nx,ny])}}}
 return D;
}
function rocksOf(m){const R=grid(false);for(const [x,y] of m.rocks)if(inG(x,y))R[y][x]=true;return R}
function nextTile(D,x,y){
 if(y===ROWS-1&&D[y][x]===1)return[x,ROWS];   // step into the base
 let b=null,bd=D[y][x];
 for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(inG(nx,ny)&&D[ny][nx]<bd){bd=D[ny][nx];b=[nx,ny]}}
 return b;
}
// The tiles an enemy from this entry walks, ending at the base (empty if blocked).
function routeFrom(D,entry){
 let [x,y]=entryTile(entry);if(D[y][x]>=INF)return[];
 const out=[[x,y]];
 for(let g=0;g<200;g++){const n=nextTile(D,x,y);if(!n||n[1]>=ROWS)break;[x,y]=n;out.push(n)}
 return out;
}
const mapOK=m=>{const D=flow(null,m);return m.entries.every(e=>{const [x,y]=entryTile(e);return D[y][x]<INF&&!rocksOf(m)[y][x]})};
function setMap(m,air){
 MAP={entries:m.entries,exits:m.exits,rocks:m.rocks||[],pads:m.pads||null};
 rock=rocksOf(MAP);occ=grid(null);reserved=grid(false);showAir=!!air;
 for(const e of MAP.entries){const [x,y]=entryTile(e);reserved[y][x]=true}
 for(const ex of MAP.exits)reserved[ROWS-1][ex]=true;
 padOK=grid(!MAP.pads);if(MAP.pads)for(const [x,y] of MAP.pads)if(inG(x,y))padOK[y][x]=true;
 // flyers go straight from each entry to the nearest base
 AIR=MAP.entries.map(e=>{const ex=MAP.exits.reduce((b,x)=>Math.abs(x-e[0])<Math.abs(b-e[0])?x:b);return mkPath([e,[ex,ROWS]])});
 for(const tw of towers)if(inG(tw.x,tw.y))occ[tw.y][tw.x]=tw;
 refresh();drawBG();
}
// Recompute the flow field and the drawn routes after any build, sale or map change.
function refresh(){FLOW=flow();ROUTES=MAP.entries.map(e=>routeFrom(FLOW,e));ghostInfo()}
const canPlace=(x,y)=>inG(x,y)&&!rock[y][x]&&!reserved[y][x]&&padOK[y][x];
// Why a build at (x,y) is not allowed, or '' if it is. The route must stay open for every entry and every enemy.
function buildIssue(x,y){
 if(!canPlace(x,y))return MAP.pads&&!rock[y][x]&&!reserved[y][x]?'toast_pad':'toast_spot';
 if(occ[y][x])return'toast_spot';
 for(const e of enemies){if(EN[e.ty].fly)continue;
  if((e.tx===x&&e.ty_===y)||(Math.floor(e.x/TS)===x&&Math.floor(e.y/TS)===y))return'toast_enemy'}
 const D=flow([x,y]);
 if(MAP.entries.some(e=>{const [ex,ey]=entryTile(e);return D[ey][ex]>=INF}))return'toast_block';
 for(const e of enemies)if(!EN[e.ty].fly&&inG(e.tx,e.ty_)&&D[e.ty_][e.tx]>=INF)return'toast_block';
 return'';
}
function placeTower(x,y,type,inv){const tw={x,y,type,lv:1,cd:0,ang:0,inv};towers.push(tw);occ[y][x]=tw;refresh();return tw}
function removeTower(tw){towers=towers.filter(q=>q!==tw);if(inG(tw.x,tw.y)&&occ[tw.y][tw.x]===tw)occ[tw.y][tw.x]=null;refresh()}
// Ground enemies: where they are, the tile they walk to, and how far they still are from the base.
const epos=e=>[e.x,e.y];
const remaining=e=>EN[e.ty].fly?e.p.len-e.d:(e.ty_>=ROWS?0:(FLOW[e.ty_]?FLOW[e.ty_][e.tx]:0)*TS)+Math.hypot((e.tx+.5)*TS-e.x,(e.ty_+.5)*TS-e.y);

/* ---------- placement preview ---------- */
// ghost: the tile being previewed (tap once to preview, again to build). Shows the new route, its length
// and how many route tiles the tower would cover.
let ghost=null,GI=null;
function ghostInfo(){
 if(!ghost){GI=null;return}
 const [x,y]=ghost,issue=buildIssue(x,y);
 if(issue&&issue!=='toast_block'){GI={issue};return}
 const D=flow([x,y]),routes=MAP.entries.map(e=>routeFrom(D,e));
 const len=r=>r.reduce((a,b)=>Math.max(a,b.length),0);
 const rng=TW[build].wall?0:stat({type:build,lv:1}).range,cx=(x+.5)*TS,cy=(y+.5)*TS;
 const seen=new Set();let hits=0;
 for(const r of routes)for(const [tx,ty] of r){const k=tx+','+ty;if(seen.has(k))continue;seen.add(k);if(Math.hypot((tx+.5)*TS-cx,(ty+.5)*TS-cy)<=rng)hits++}
 GI={issue,routes,from:len(ROUTES),to:len(routes),hits,rng};
}

/* ---------- upgrade cards (random, buffs and curses) ---------- */
const CARDS=[
 {id:'dmg',w:3,gen:()=>{const v=ri(10,25);return{a:[v],ap:()=>M.dmg*=1+v/100}}},
 {id:'range',w:3,gen:()=>{const v=ri(8,18);return{a:[v],ap:()=>M.range*=1+v/100}}},
 {id:'rate',w:3,gen:()=>{const v=ri(10,25);return{a:[v],ap:()=>M.rate*=1+v/100}}},
 {id:'gold',w:3,gen:()=>{const v=ri(40,90);return{a:[v],ap:()=>S.gold+=v}}},
 {id:'life',w:2,gen:()=>{const v=ri(1,2);return{a:[v],ap:()=>S.lives+=v}}},
 {id:'splash',w:2,gen:()=>{const v=ri(20,40);return{a:[v],ap:()=>M.splash*=1+v/100}}},
 {id:'slow',w:2,gen:()=>{const v=ri(10,20);return{a:[v],ap:()=>M.slow+=v/100}}},
 {id:'int',w:2,gen:()=>{const v=ri(5,10);return{a:[v],ap:()=>M.interest+=v/100}}},
 {id:'cu1',w:1.4,curse:1,gen:()=>{const v=ri(30,50),h=ri(15,25);return{a:[v,h],ap:()=>{M.dmg*=1+v/100;M.hp*=1+h/100}}}},
 {id:'cu2',w:1.4,curse:1,gen:()=>{const v=ri(30,45),c=ri(20,30);return{a:[v,c],ap:()=>{M.rate*=1+v/100;M.cost*=1+c/100}}}},
 {id:'cu3',w:1.4,curse:1,gen:()=>{const v=ri(120,200),l=2;return{a:[v,l],ap:()=>{S.gold+=v;S.lives=Math.max(1,S.lives-l)}}}}
];
function rollCards(){
 const out=[],pool=CARDS.slice();
 while(out.length<3){
  const tot=pool.reduce((a,c)=>a+c.w,0);let r=Math.random()*tot,i=0;
  for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}
  const c=pool.splice(Math.min(i,pool.length-1),1)[0];
  out.push(Object.assign({id:c.id,curse:c.curse},c.gen()));
 }
 return out;
}

/* ---------- state ---------- */

let clearT=0,S,M,state='menu',enemies=[],towers=[],projs=[],parts=[],queue=[],spawnT,sel,build,speed=1,tick=0;
function resetRun(mode,gold,lives){
 S={mode,li:0,level:1,gold,lives,startLives:lives,wave:0,lw:0,kills:0,ups:[],rr:0,

/* ---------- saves ---------- */
const starsKey='towerLiteStars',bestKey='towerLiteBest';
let STARS=[];try{STARS=(localStorage.getItem(starsKey)||'').split(',').map(v=>+v||0)}catch(e){}
let best=1;try{best=+localStorage.getItem(bestKey)||1}catch(e){}

const endlessOpen=()=>(STARS[2]||0)>0;
function saveStars(i,n){if(n>(STARS[i]||0)){STARS[i]=n;for(let k=0;k<LEVELS.length;k++)STARS[k]=STARS[k]||0;try{localStorage.setItem(starsKey,STARS.join(','))}catch(e){}}}
function saveBest(){if(S.mode==='endless'&&S.level>best){best=S.level;try{localStorage.setItem(bestKey,best)}catch(e){}}}
const starStr=n=>`<span class="st">${'★'.repeat(n)}<em>${'★'.repeat(3-n)}</em></span>`;

// Endless: after the shop, +1 life and a new map; every 3rd stage applies the announced boss rule.
// Towers that cannot stay on the new map are refunded in full; the rest stay where they are.
const levelBonus=L=>40+L*10;
function nextLevel(){
 S.level++;S.lw=0;
 if(!has('glass')||S.lives<3)S.lives++;
 if(S.level%3===0){S.rule=S.nextRule;S.nextRule=pick(RULES.filter(r=>r.id!==S.rule)).id}else S.rule=null;
 // towers keep their tiles; ones on rocks or entries are refunded, then walls (and if needed towers) until the route is open
 const m=randomMap();let refund=0;const R=rocksOf(m);ghost=null;
 const bad=tw=>R[tw.y][tw.x]||m.entries.some(e=>{const [x,y]=entryTile(e);return x===tw.x&&y===tw.y})||(tw.y===ROWS-1&&m.exits.includes(tw.x));
 towers=towers.filter(tw=>{if(bad(tw)){refund+=tw.inv;return false}return true});
 setMap(m,S.wave>=6||S.rule==='sky');
 const blockedNow=()=>MAP.entries.some(e=>{const [x,y]=entryTile(e);return FLOW[y][x]>=INF});
 for(const tw of [...towers].sort((a,b)=>(TW[b.type].wall?1:0)-(TW[a.type].wall?1:0))){if(!blockedNow())break;refund+=tw.inv;removeTower(tw)}
 S.gold+=refund;sel=null;saveBest();
 return refund;
}
// Every extra tower of a type costs 15% more, so spamming the best tower stops paying off.
const tcount=ty=>towers.reduce((n,tw)=>n+(tw.type===ty),0);
const tcost=ty=>TW[ty].wall?TW[ty].cost:Math.round(TW[ty].cost*M.cost*(1+.15*tcount(ty))*(has('overclock')?1.2:1));
const sellValue=tw=>TW[tw.type].wall?tw.inv:Math.floor(tw.inv*.6);
const shooters=()=>towers.filter(q=>!TW[q.type].wall);
const upCost=tw=>Math.round(TW[tw.type].cost*(tw.lv===1?.7:1.1)*M.cost);
function stat(tw){
 const b=TW[tw.type],l=tw.lv-1,R=relicStat(tw);
 return{dmg:b.dmg*(1+b.ud*l)*M.dmg*R.dmg,range:b.range*(1+.08*l)*M.range*R.range,cd:b.cd*(1-b.uc*l)/M.rate/R.rate,
  splash:(b.splash||0)*M.splash,slow:Math.min(.85,(b.slow||0)+M.slow+R.slow)};
}
// Tower-side relic effects (enemy-side ones live in damage()).
function relicStat(tw){
 const R={dmg:1,range:1,rate:1,slow:0};if(!S.relics.length)return R;
 if(has('hoarder'))R.dmg*=1+Math.min(.6,Math.floor(S.gold/10)*.01);
 if(has('mono')&&shooters().every(q=>q.type===tw.type))R.dmg*=1.4;
 if(has('blood'))R.dmg*=1+.01*(tw.kills||0);
 if(has('glass'))R.dmg*=2;
 if(has('heavy')&&tw.type==='cannon')R.dmg*=1.3;
 if(has('collector'))R.dmg*=1+.08*S.relics.length;
 if(has('sharp')&&tw.type==='arrow')R.range*=1.25;
 if(has('overclock'))R.rate*=1.3;
 if(has('momentum'))R.rate*=1+.04*S.streak;
 if(has('permafrost')&&tw.type==='frost')R.slow+=.1;
 return R;
}
function toast(msg){const e=$('#toast');e.textContent=msg;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',1100)}

/* ---------- waves ---------- */
function queueWave(){
 const w=S.mode==='camp'?LEVELS[S.li].waves[S.lw]:genWave(S.wave+1,S.level,S.lw+1);
 w.forEach(([ty,n,iv,pi])=>{for(let i=0;i<n;i++)queue.push({ty,pi,dt:i===0&&queue.length?1.2:iv})});
 S.wave++;S.lw++;
}
// While a wave is still on the field, the next one can be called early once it has finished spawning.
const canEarly=()=>state==='wave'&&!queue.length&&S.lw<nWaves();
const earlyBonus=()=>10+5*S.lw;
function startWave(){
 if(state==='build'){queue=[];queueWave();spawnT=.5;state='wave';sel=null;beep(300,.2,'triangle',.05,300)}
 else if(canEarly()){S.gold+=earlyBonus();queueWave();spawnT=.8;beep(300,.2,'triangle',.05,500)}
 else return;
 renderBar();renderHud();
}
function spawn(ty,pi){
 if(S.rule==='sky'&&ty!=='boss'&&Math.random()<.5)ty='flyer';
 const E=EN[ty];
 if(pi===undefined)pi=S.rr++;
 pi%=MAP.entries.length;
 let hs,rs=1;
 if(S.mode==='camp')hs=LEVELS[S.li].hp*(1+.06*(S.lw-1));
 else{const g=S.wave-1;hs=.8*(1+.25*g+.03*g*g);rs=1+.08*g}   // unmazed open fields are shorter than the old roads
 const hp=E.hp*M.hp*hs;
 const en=MAP.entries[pi],[tx,ty_]=entryTile(en);
 const e={ty,hp,max:hp,rw:Math.round(E.rw*rs),slowT:0,slowA:0,dead:0,ph:Math.random()*6,healT:1,x:(en[0]+.5)*TS,y:(en[1]+.5)*TS,tx,ty_};
 if(E.fly){e.p=AIR[pi];e.d=0}
 enemies.push(e);
}

 const bonus=20+S.lw*5,inter=Math.min(60,Math.floor(S.gold*M.interest));
 S.gold+=bonus+inter;beep(660,.15,'triangle',.05);beep(880,.25,'triangle',.05);

 if(done&&S.mode==='camp'){levelWon();return}

}

function runWaveClear(){
 let bonus=has('bounty')?0:20+S.lw*5;if(has('landlord'))bonus+=3*shooters().length;
 S.gold+=bonus;S.streak++;beep(660,.15,'triangle',.05);beep(880,.25,'triangle',.05);
 if(S.lw<nWaves()){state='build';toast(t('wave_bonus',bonus));renderHud();renderBar();return}
 const lb=levelBonus(S.level+1),inter=Math.min(has('piggy')?50:25,Math.floor(S.gold*.1));

/* ---------- update ---------- */
// tw: the tower that dealt the hit (null for effects), used by relics and the damage summary.
function damage(e,d,tw){
 if(e.dead)return;
 const E=EN[e.ty];
 if(tw&&tw.type==='arrow'&&has('frostbite')&&e.slowT>0)d*=1.5;
 if(has('exec')&&e.hp<e.max*.25)d*=2;
 const armor=(E.armor||0)+(S.rule==='armored'?8:0);
 const dealt=Math.min(e.hp,tw&&tw.type==='arrow'&&has('pierce')?d:armorHit(d,armor));
 e.hp-=dealt;
 if(tw)S.dmg[tw.type]=(S.dmg[tw.type]||0)+dealt;
 if(dealt>=60){const [x,y]=epos(e);parts.push({x:x-6,y:y-14,vx:0,vy:-30,life:.5,txt:''+Math.round(dealt),col:'#fff'})}
 if(e.hp<=0){
  e.dead=1;S.kills++;if(tw)tw.kills=(tw.kills||0)+1;
  let g=S.rule==='broke'?0:e.rw;if(has('bounty'))g+=2;
  const [x,y]=epos(e);
  if(has('lucky')&&g&&Math.random()<.1){g*=3;parts.push({x:x-6,y:y-16,vx:0,vy:-25,life:.7,txt:'x3',col:'#5be37d'})}
  S.gold+=g;
  for(let i=0;i<8;i++)parts.push({x,y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,life:.35,col:E.col});
  if(g)parts.push({x:x-4,y:y-8,vx:0,vy:-25,life:.6,txt:'+'+g,col:'#ffcf3f'});
  beep(160,.08,'square',.03,-60);renderHud();
  // Shrapnel: the blast is credited to the same cannon, so kills it causes can explode too (chain reactions).
  if(tw&&tw.type==='cannon'&&has('shrapnel')){
   for(let i=0;i<12;i++)parts.push({x,y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.3,col:'#ff6b3f'});
   parts.push({x:x-10,y:y-18,vx:0,vy:-20,life:.6,txt:'BOOM',col:'#ff6b3f'});
   for(const o of enemies){if(o.dead||EN[o.ty].fly)continue;const [ox,oy]=epos(o);if(Math.hypot(ox-x,oy-y)<=30)damage(o,e.max*.3,tw)}
  }
 }
}
function hit(p,x,y){
 if(p.splash>0){
  for(const e of enemies){if(e.dead||EN[e.ty].fly)continue;const [ex,ey]=epos(e);if(Math.hypot(ex-x,ey-y)<=p.splash+EN[e.ty].r)damage(e,p.dmg,p.src)}
  for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-.5)*110,vy:(Math.random()-.5)*110,life:.3,col:'#ffb347'});
  beep(90,.15,'sawtooth',.05,-30);
 }else{
  if(p.slow>0&&p.tgt&&!p.tgt.dead&&S.rule!=='thaw'){p.tgt.slowT=has('permafrost')?3.2:1.6;p.tgt.slowA=p.slow}
  if(p.tgt)damage(p.tgt,p.dmg,p.src);
 }
}
// Walk a ground enemy toward the base, one tile centre at a time; the next tile is picked from the current
// flow field, so enemies re-route as soon as the maze changes. Returns true when it reaches the base.
function walk(e,step){
 for(let g=0;g<4&&step>0;g++){
  const cx=(e.tx+.5)*TS,cy=(e.ty_+.5)*TS,dx=cx-e.x,dy=cy-e.y,d=Math.hypot(dx,dy);
  if(d>step){e.x+=dx/d*step;e.y+=dy/d*step;return false}
  e.x=cx;e.y=cy;step-=d;
  if(e.ty_>=ROWS)return true;
  const n=nextTile(FLOW,e.tx,e.ty_);if(!n)return false;
  e.tx=n[0];e.ty_=n[1];
 }
 return false;
}
function update(dt){
 tick+=dt;
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);
 if(state==='clearing'){clearT-=dt;if(clearT<=0)waveClear();return}
 if(state!=='wave')return;
 // spawn
 if(queue.length){
  spawnT-=dt;while(queue.length&&spawnT<=0){const q=queue.shift();spawn(q.ty,q.pi);spawnT+=queue.length?queue[0].dt:0}
  if(!queue.length)renderBar();   // the early-call button becomes available
 }
 // enemies
 for(const e of enemies){
  if(e.dead)continue;
  const E=EN[e.ty];
  if(e.slowT>0)e.slowT-=dt;
  const step=E.sp*(S.rule==='swift'?1.4:1)*(e.slowT>0?1-e.slowA:1)*dt;
  let leaked=false;
  if(E.fly){e.d+=step;[e.x,e.y]=posAt(e.p,Math.min(e.d,e.p.len));leaked=e.d>=e.p.len}
  else leaked=walk(e,step);
  if(S.rule==='leech'&&e.hp<e.max)e.hp=Math.min(e.max,e.hp+e.max*.02*dt);
  if(E.heal&&(e.healT-=dt)<=0){
   e.healT=1;const [hx,hy]=epos(e);
   for(const o of enemies){
    if(o.dead||o.hp>=o.max||tick-(o.healedAt||-9)<.9)continue;const [ox,oy]=epos(o);   // heals from several healers do not stack
    if(Math.hypot(ox-hx,oy-hy)<=34){o.hp=Math.min(o.max,o.hp+o.max*E.heal);o.healedAt=tick;parts.push({x:ox-1,y:oy-6,vx:0,vy:-18,life:.4,col:'#7dff9a'})}
   }
  }
  if(leaked){
   e.dead=1;S.lives-=E.dmg||1;S.streak=0;beep(110,.25,'sawtooth',.06,-50);vib(40);renderHud();
   if(S.lives<=0){S.lives=0;state='over';renderHud();showOver();return}
  }
 }
 enemies=enemies.filter(e=>!e.dead);
 // towers: shoot the enemy closest to the base that this tower can hit; anti-air towers take flyers first,
 // since nothing else can stop them
 for(const tw of towers){
  if(TW[tw.type].wall)continue;
  tw.cd-=dt;const b=TW[tw.type],st=stat(tw),cx=(tw.x+.5)*TS,cy=(tw.y+.5)*TS;
  let best=null,br=1e9,bx=0,by=0;
  for(const e of enemies){
   const fly=EN[e.ty].fly;if(fly&&!b.air)continue;
   const [ex,ey]=epos(e),rem=remaining(e)-(fly?1e5:0);
   if(rem<br&&Math.hypot(ex-cx,ey-cy)<=st.range){br=rem;best=e;bx=ex;by=ey}
  }
  if(best){
   tw.ang=Math.atan2(by-cy,bx-cx);
   if(tw.cd<=0){
    tw.cd=st.cd;
    const shot=(tg,tx,tyy)=>projs.push({x:cx,y:cy,tgt:tg,lx:tx,ly:tyy,dmg:st.dmg,splash:st.splash,slow:b.slow?st.slow:0,spd:b.spd,ty:tw.type,home:!b.splash,src:tw});
    shot(best,bx,by);
    if(tw.type==='arrow'&&has('volley')&&(tw.shots=(tw.shots||0)+1)%4===0){
     let n=0;
     for(const e of enemies){if(n>=2)break;if(e===best||e.dead||(EN[e.ty].fly&&!b.air))continue;const [ex,ey]=epos(e);if(Math.hypot(ex-cx,ey-cy)<=st.range){shot(e,ex,ey);n++}}
    }
    beep(tw.type==='cannon'?110:tw.type==='frost'?600:420,.04,'square',.015);
   }
  }
 }
 // projectiles (cannon shells fly to where the target was)
 for(const p of projs){
  if(p.home&&p.tgt&&!p.tgt.dead){const [ex,ey]=epos(p.tgt);p.lx=ex;p.ly=ey}
  const dx=p.lx-p.x,dy=p.ly-p.y,dist=Math.hypot(dx,dy),step=p.spd*dt;
  if(dist<=step+2){p.done=1;hit(p,p.lx,p.ly)}else{p.x+=dx/dist*step;p.y+=dy/dist*step}
 }
 projs=projs.filter(p=>!p.done);
 if(state==='wave'&&!queue.length&&!enemies.length){state='clearing';clearT=.4}
}

 }
 // flyer routes

function drawTower(tw,hl){
 const cx=Math.round((tw.x+.5)*TS),cy=Math.round((tw.y+.5)*TS),b=TW[tw.type];
 if(b.wall){
  ctx.fillStyle='#000';ctx.fillRect(cx-10,cy-10,20,20);ctx.fillStyle='#8d8172';ctx.fillRect(cx-9,cy-9,18,18);
  ctx.fillStyle='#6f6457';ctx.fillRect(cx-9,cy-1,18,2);ctx.fillRect(cx-1,cy-9,2,8);ctx.fillRect(cx-5,cy+1,2,8);ctx.fillRect(cx+4,cy+1,2,8);

  return;
 }

 ctx.save();ctx.translate(cx,cy);ctx.rotate(tw.ang||0);
 ctx.fillStyle=tw.type==='cannon'?'#222':tw.type==='frost'?'#fff':'#5a3a1a';
 ctx.fillRect(0,-2,tw.type==='cannon'?10:8,tw.type==='cannon'?4:3);
 ctx.restore();
 ctx.fillStyle='#ffcf3f';for(let i=0;i<tw.lv;i++)ctx.fillRect(cx-7+i*5,cy+6,3,2);

function drawEnemy(e){
 const [x,y]=epos(e),E=EN[e.ty],r=E.r,bob=Math.sin(tick*8+e.ph)*1;
 const X=Math.round(x),Y=Math.round(y+bob)-(E.fly?5:0);
 ctx.fillStyle='#0006';ctx.fillRect(X-r,Y+r-1+(E.fly?7:0),r*2,2);
 if(E.fly){const f=Math.sin(tick*22+e.ph)>0?2:0;ctx.fillStyle='#000';ctx.fillRect(X-r-5,Y-3-f,5,4);ctx.fillRect(X+r,Y-3-f,5,4);
  ctx.fillStyle='#fff';ctx.fillRect(X-r-4,Y-2-f,3,2);ctx.fillRect(X+r+1,Y-2-f,3,2)}
 ctx.fillStyle='#000';ctx.fillRect(X-r-1,Y-r-1,r*2+2,r*2+2);
 ctx.fillStyle=e.slowT>0?'#9fd8ff':E.col;ctx.fillRect(X-r,Y-r,r*2,r*2);
 if(E.armor){ctx.fillStyle='#c0c6d0';ctx.fillRect(X-r,Y-r,r*2,2);ctx.fillRect(X-r,Y+r-3,r*2,2)}
 if(E.heal){ctx.fillStyle='#fff';ctx.fillRect(X-1,Y,2,4);ctx.fillRect(X-2,Y+1,4,2)}
 ctx.fillStyle='#fff';ctx.fillRect(X-r+2,Y-r+2,2,2);ctx.fillRect(X+r-4,Y-r+2,2,2);
 ctx.fillStyle='#000';ctx.fillRect(X-r+3,Y-r+3,1,1);ctx.fillRect(X+r-3,Y-r+3,1,1);
 if(e.ty==='boss'){ctx.fillStyle='#ffcf3f';ctx.fillRect(X-r+1,Y-r-3,r*2-2,2);ctx.fillRect(X-r+1,Y-r-5,2,2);ctx.fillRect(X+r-3,Y-r-5,2,2)}

// Dotted route: where ground enemies will walk right now (yellow when previewing a build).
function drawRoutes(routes,col,sz){
